<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2b292b" />
<title>Shape Shooter 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Saira:wght@800&display=swap" rel="stylesheet" />
<style>
:root{--round:"M PLUS Rounded 1c","Arial Rounded MT Bold","Nunito","Segoe UI",Arial,sans-serif;--sans:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;--cy:#3ad8e8;--ol:#4a4a4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#2b292b;overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--round)}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
body.playing #game{cursor:none}
#stage{position:fixed;left:50%;top:50%;width:1200px;height:675px;margin:-337.5px 0 0 -600px;transform-origin:50% 50%;pointer-events:none;color:#fff}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:none}
.screen.on{display:block;pointer-events:auto}
.abs{position:absolute}
.otxt{color:#fff;text-shadow:2px 0 0 var(--ol),-2px 0 0 var(--ol),0 2px 0 var(--ol),0 -2px 0 var(--ol),1.5px 1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px -1.5px 0 var(--ol)}
.otxt3{color:#fff;text-shadow:3px 0 0 var(--ol),-3px 0 0 var(--ol),0 3px 0 var(--ol),0 -3px 0 var(--ol),2.2px 2.2px 0 var(--ol),-2.2px 2.2px 0 var(--ol),2.2px -2.2px 0 var(--ol),-2.2px -2.2px 0 var(--ol)}
.cytxt{color:#6fe3ea;text-shadow:2px 0 0 #124d50,-2px 0 0 #124d50,0 2px 0 #124d50,0 -2px 0 #124d50,1.5px 1.5px 0 #124d50,-1.5px 1.5px 0 #124d50,1.5px -1.5px 0 #124d50,-1.5px -1.5px 0 #124d50}
button{font:inherit;color:inherit;background:none;border:0;outline:0;cursor:pointer}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-weight:700;color:#fff;letter-spacing:.5px;white-space:nowrap;transition:filter .1s,transform .08s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.95)}
.btn.dis{filter:grayscale(.9) brightness(.78);cursor:default;transform:none}
.g{background:#12d812}.r{background:#f35b5b}.o{background:#ff3d10}.gr{background:#8b8b8b}
.b{background:#1597dd;box-shadow:inset 0 0 0 3px #46c7f3}
.coin{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#f8d21a;box-shadow:inset 0 0 0 3px #f09000;color:#ef8a00;font:900 21px var(--sans);font-style:normal}
.coin.s{width:22px;height:22px;font-size:15px;box-shadow:inset 0 0 0 2px #f09000}
/* title */
#logo{position:absolute;left:0;right:0;top:20px;text-align:center;font-family:"Saira",var(--sans);font-weight:800;font-size:88px;line-height:1.1;white-space:nowrap;letter-spacing:1px}
#logo .m{color:#ececec;text-shadow:3px 0 0 #505050,-3px 0 0 #505050,0 3px 0 #505050,0 -3px 0 #505050,2.2px 2.2px 0 #505050,-2.2px 2.2px 0 #505050,2.2px -2.2px 0 #505050,-2.2px -2.2px 0 #505050,0 8px 0 #363536,3px 7px 0 #363536,-3px 7px 0 #363536}
#logo .n{color:#3cd7ef;text-shadow:3px 0 0 #1b6773,-3px 0 0 #1b6773,0 3px 0 #1b6773,0 -3px 0 #1b6773,2.2px 2.2px 0 #1b6773,-2.2px 2.2px 0 #1b6773,2.2px -2.2px 0 #1b6773,-2.2px -2.2px 0 #1b6773,0 8px 0 #143f46,3px 7px 0 #143f46,-3px 7px 0 #143f46}
.modesel{left:105px;top:170px;width:300px;height:38px}
.arrow{position:absolute;top:0;width:38px;height:38px;background:#262526;box-shadow:inset 0 0 0 2px var(--cy);display:flex;align-items:center;justify-content:center}
.arrow:hover{background:#333}.arrow:active{transform:scale(.93)}
.arrow.l{left:0}.arrow.rr{right:0}
.modename{position:absolute;left:44px;right:44px;top:0;height:38px;background:#262526;box-shadow:inset 0 0 0 2px var(--cy);color:var(--cy);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.preview{left:105px;top:214px;width:300px;height:166px;box-shadow:0 0 0 3px var(--cy);overflow:hidden;background:#2b292b}
.preview canvas{width:100%;height:100%;display:block}
#pv-top{position:absolute;left:8px;top:2px;font-size:20px;font-weight:800}
#pv-lock{position:absolute;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:800;background:rgba(30,30,30,.72);line-height:1.35}
#pv-lock b{color:#ffe14a}
.hints{left:112px;top:392px;width:330px}
.hrow{display:flex;align-items:center;gap:12px;height:56px}
.hrow .t{font-size:25px;font-weight:800}
.anti{font-size:19px;font-weight:800;display:flex;align-items:center;gap:5px;margin-left:10px}
.shippanel{left:448px;top:165px;width:312px;height:192px;background:#a3a3a3;padding:8px 4px 8px 8px}
.shipgrid{width:100%;height:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(4,66px);grid-auto-rows:66px;gap:6px;align-content:start}
.shipgrid::-webkit-scrollbar{width:10px}.shipgrid::-webkit-scrollbar-track{background:#8e8e8e}.shipgrid::-webkit-scrollbar-thumb{background:#d6d6d6}
.stile{width:66px;height:66px;background:#5f5f5f;position:relative;cursor:pointer}
.stile:hover{background:#6c6c6c}
.stile.sel{box-shadow:inset 0 0 0 3px var(--cy)}
.stile canvas,.ptile canvas,#si-tile canvas,#shop-ship canvas{width:100%;height:100%;display:block}
.sinfo{left:448px;top:366px;width:312px;height:80px}
#si-tile{position:absolute;left:0;top:0;width:76px;height:76px;background:#5f5f5f}
#si-name{position:absolute;left:90px;top:2px;font-size:29px;font-weight:800}
#si-top{position:absolute;left:90px;top:42px;font-size:23px;font-weight:800}
#si-eq{position:absolute;right:0;top:10px;width:56px;height:56px;border-radius:9px;background:#56d3ec;display:none}
#si-eq canvas{width:100%;height:100%}
#btn-play{left:500px;top:462px;width:200px;height:48px;font-size:32px}
#btn-weap{left:418px;top:524px;width:176px;height:42px;font-size:21px}
#btn-mix{left:606px;top:524px;width:176px;height:42px;font-size:21px}
.setrow{left:448px;top:580px;width:312px;height:46px;background:#a3a3a3;display:flex;align-items:center;gap:10px;padding:0 12px 0 4px}
#btn-gear,#btn-spk{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#btn-gear{background:#7c7c7c}#btn-gear:hover{background:#8a8a8a}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;background:#6d6d6d;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;background:#fff;border:2px solid #666}
input[type=range]::-moz-range-thumb{width:15px;height:23px;background:#fff;border:2px solid #666;border-radius:0}
.ver{left:8px;bottom:6px;font-size:20px;font-weight:500}
.pik{right:112px;bottom:12px;color:#fff23b;font-size:18px;font-weight:800;text-shadow:0 2px 0 #555,2px 0 0 #555,-2px 0 0 #555,0 -2px 0 #555}
#btn-credits{right:10px;bottom:8px;width:92px;height:32px;font-size:18px}
#coinbox{position:absolute;right:12px;top:6px;display:none;align-items:center;gap:7px;pointer-events:none}
#coinbox.on{display:flex}
#coin-num{font-size:32px;font-weight:800;color:#f7eba6;text-shadow:2px 0 0 #4b4630,-2px 0 0 #4b4630,0 2px 0 #4b4630,0 -2px 0 #4b4630,1.5px 1.5px 0 #4b4630,-1.5px 1.5px 0 #4b4630,1.5px -1.5px 0 #4b4630,-1.5px -1.5px 0 #4b4630}
/* shop */
#scr-shop{background:#bdbdbd}
.wgrid{left:250px;top:40px;width:720px;display:grid;grid-template-columns:repeat(5,112px);column-gap:34px;row-gap:26px}
.wcell{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.wtile{width:104px;height:104px;background:#56d3ec;border-radius:13px;position:relative;transition:transform .08s}
.wcell:hover .wtile{transform:translateY(-2px)}
.wcell.sel .wtile{box-shadow:0 0 0 4px #fff,0 0 0 7px #1f9fb6}
.wtile canvas{width:100%;height:100%;display:block}
.price{height:30px;min-width:104px;padding:0 8px;background:#707070;display:flex;align-items:center;justify-content:center;gap:8px;font:700 20px var(--sans)}
.price.own{background:#4c9a57}.price.eq{background:#1597dd}
.shopbot{left:250px;top:376px;width:720px;height:172px}
#shop-ship{position:absolute;left:0;top:0;width:164px;height:164px;background:#686868}
#shop-desc{position:absolute;left:180px;top:0;width:404px;height:164px;background:#8e8e8e;padding:12px 16px}
#sd-name{font-size:28px;font-weight:800}
#sd-text{margin-top:6px;font-size:17px;font-weight:500;line-height:1.4;color:#fff;width:370px}
#sd-act{left:16px;bottom:12px;min-width:150px;height:38px;font-size:20px;padding:0 14px}
#sd-note{position:absolute;right:14px;bottom:20px;font-size:15px;font-weight:800;color:#f1f1f1}
.backbtn{position:absolute;width:110px;height:110px;background:#8e8e8e;display:flex;align-items:center;justify-content:center}
.backbtn:hover{background:#9b9b9b}.backbtn:active{transform:scale(.95)}
#shop-back{left:604px;top:26px}
/* panels */
.dimbg{position:absolute;left:0;top:0;width:100%;height:100%}
.panel{position:absolute;left:162px;top:118px;width:876px;height:440px;background:#bfbfbf}
.ptitle{position:absolute;left:0;right:0;top:16px;text-align:center;font:700 60px var(--sans)}
.ptile{position:absolute;background:#686868}
#pause-ship{left:46px;top:112px;width:136px;height:136px}
#pause-ups{position:absolute;left:204px;top:112px;width:630px;height:200px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;overflow:hidden}
.upchip{display:flex;align-items:center;gap:7px;background:#8e8e8e;padding:4px 12px 4px 4px;height:44px;font-size:16px;font-weight:800}
.upchip canvas{width:36px;height:36px;background:#56d3ec;border-radius:6px;display:block}
.upchip .lvp{color:#dffaff;font-size:14px}
#btn-resume{left:128px;top:356px;width:250px;height:52px;font-size:32px}
#btn-quit{left:498px;top:356px;width:250px;height:52px;font-size:32px}
.cards{position:absolute;left:38px;top:104px;width:800px;height:312px;display:flex;gap:25px}
.card{position:relative;width:250px;height:312px;background:#6c6c6c;display:flex;flex-direction:column;align-items:center;padding:20px 14px 10px;cursor:pointer;transition:transform .1s,background .1s}
.card:hover{background:#767676;box-shadow:inset 0 0 0 4px var(--cy);transform:translateY(-4px)}
.card .ic{width:112px;height:112px;border-radius:14px;background:#56d3ec}
.card .ic canvas{width:100%;height:100%;display:block}
.card .nm{margin-top:14px;font-size:25px;font-weight:800;text-align:center;line-height:1.1}
.card .lv{margin-top:4px;font-size:16px;font-weight:800;color:#bff4fa}
.card .ds{margin-top:10px;font-size:16px;font-weight:500;text-align:center;line-height:1.35;color:#f2f2f2}
.card .key{position:absolute;left:10px;top:6px;font-size:16px;font-weight:800;color:#d8d8d8}
.card .tag{position:absolute;right:8px;top:8px;font:700 13px var(--sans);background:#2fae43;padding:3px 7px;letter-spacing:1px}
.card .tag.up{background:#1597dd}
/* game over */
#btn-cont{left:282px;top:437px;width:285px;height:43px;font-size:25px;justify-content:space-between;padding:0 5px 0 12px}
.cprice{display:flex;align-items:center;gap:5px;background:#0a9c0a;padding:3px 6px;font-size:22px;height:33px}
#btn-go{left:631px;top:437px;width:287px;height:43px;font-size:25px}
/* result */
#res-new{position:absolute;left:0;right:0;top:66px;text-align:center;font:700 40px var(--sans)}
#res-score{position:absolute;left:0;right:0;top:112px;text-align:center;font:700 64px var(--sans)}
.badge{position:absolute;height:34px;display:flex;align-items:center;justify-content:center;color:#6fe3ea;background:rgba(18,70,74,.45);box-shadow:inset 0 0 0 2px #6fe3ea;font-size:21px;font-weight:800;letter-spacing:1px}
#res-mode{left:525px;top:196px;width:150px}
#res-panel{position:absolute;left:320px;top:244px;width:560px;height:200px;background:#c6c6c6}
#res-ship{left:24px;top:32px;width:136px;height:136px}
#res-prog{position:absolute;left:184px;top:30px;width:262px;height:140px}
#res-bar{position:absolute;left:0;top:58px;width:262px;height:24px;background:repeating-linear-gradient(90deg,#8d8d8d 0 9px,#f4f4f4 9px 12px);box-shadow:inset 0 0 0 2px #7a7a7a}
#res-fill{position:absolute;left:0;top:0;height:100%;background:repeating-linear-gradient(90deg,#4fd2e2 0 9px,#f4f4f4 9px 12px);box-shadow:inset 0 0 0 2px #2fa9b8;width:0}
#res-cur{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font:700 22px var(--sans);color:#fff;text-shadow:0 2px 0 #555,2px 0 0 #555,-2px 0 0 #555,0 -2px 0 #555}
#res-tgt{position:absolute;right:0;top:86px;transform:translateX(50%);display:flex;flex-direction:column;align-items:center;font:700 22px var(--sans);color:#fff;text-shadow:0 2px 0 #555,2px 0 0 #555,-2px 0 0 #555,0 -2px 0 #555}
#res-next{position:absolute;left:466px;top:56px;width:76px;height:76px;background:#8a8a8a;display:flex;align-items:center;justify-content:center;font:700 46px var(--sans)}
#res-next canvas{width:100%;height:100%}
#res-newship{position:absolute;left:446px;top:24px;width:116px;text-align:center;font-size:17px;font-weight:800;color:#fff36b;display:none}
#btn-retry{left:520px;top:472px;width:160px;height:46px;font-size:27px;display:none}
/* modal */
#scr-modal{background:rgba(35,35,35,.55)}
.mpanel{left:300px;top:118px;width:600px;height:440px}
#m-body{position:absolute;left:40px;top:110px;width:520px;height:300px;font-size:19px;font-weight:500;line-height:1.5}
#m-close{right:22px;bottom:22px;width:84px;height:84px}
.mrow{display:flex;align-items:center;gap:16px;height:58px}
.mrow .lab{width:170px;font-size:23px;font-weight:800}
.mrow input[type=range]{max-width:250px}
.mbtn{position:relative;height:40px;padding:0 18px;font-size:19px}
#touch-hint{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:18px;font-weight:800;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="stage">
  <section id="scr-title" class="screen">
    <div id="logo"><span class="m">Shape Shooter</span><span class="n">3</span></div>
    <div class="abs modesel">
      <button class="arrow l" id="mode-prev" aria-label="previous mode"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M15 2 L3 10 L15 18 Z" fill="#fff"/></svg></button>
      <div class="modename" id="mode-name">NORMAL</div>
      <button class="arrow rr" id="mode-next" aria-label="next mode"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M3 2 L15 10 L3 18 Z" fill="#fff"/></svg></button>
    </div>
    <div class="abs preview"><canvas id="demo" width="600" height="332"></canvas><div id="pv-top" class="cytxt">TOP 0</div><div id="pv-lock" class="otxt"><div>score <b>10000</b> in NORMAL<br>to unlock this mode</div></div></div>
    <div class="abs hints">
      <div class="hrow"><svg width="34" height="48" viewBox="0 0 34 48"><rect x="2" y="2" width="30" height="44" rx="15" fill="#f2f2f2" stroke="#555" stroke-width="3"/><path d="M17 3.5 A13.5 13.5 0 0 0 3.5 17 V20 H17 Z" fill="#f7941d"/><line x1="17" y1="2" x2="17" y2="20" stroke="#555" stroke-width="3"/><line x1="2" y1="20" x2="32" y2="20" stroke="#555" stroke-width="3"/></svg><span class="t otxt">bomb</span><span class="anti otxt">anti <svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 3 L19 11 L4 19 Z" fill="#9c2774" stroke="#f23fc0" stroke-width="2.5" stroke-linejoin="round"/></svg> &amp; <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="#a86a00" stroke="#f7a400" stroke-width="2.5"/></svg></span></div>
      <div class="hrow"><svg width="34" height="48" viewBox="0 0 34 48"><rect x="2" y="2" width="30" height="44" rx="15" fill="#f2f2f2" stroke="#555" stroke-width="3"/><path d="M17 3.5 A13.5 13.5 0 0 1 30.5 17 V20 H17 Z" fill="#f7941d"/><line x1="17" y1="2" x2="17" y2="20" stroke="#555" stroke-width="3"/><line x1="2" y1="20" x2="32" y2="20" stroke="#555" stroke-width="3"/></svg><span class="t otxt">pause</span></div>
    </div>
    <div class="abs shippanel"><div class="shipgrid" id="ship-grid"></div></div>
    <div class="abs sinfo"><div id="si-tile"></div><div id="si-name" class="otxt">basic</div><div id="si-top" class="otxt">top : 0</div><div id="si-eq" title="equipped weapon"></div></div>
    <button class="btn g" id="btn-play">PLAY</button>
    <button class="btn b" id="btn-weap">WEAPONS <svg width="26" height="26" viewBox="0 0 26 26"><rect x="6" y="13" width="4" height="11" fill="#fff"/><rect x="16" y="13" width="4" height="11" fill="#fff"/><circle cx="8" cy="9" r="5" fill="#fff"/><circle cx="18" cy="9" r="5" fill="#fff"/></svg></button>
    <button class="btn b" id="btn-mix">MIX <svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 8 A8 8 0 1 0 20 14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M13 2.5 L21.5 7.5 L13.5 11.5 Z" fill="#fff"/></svg></button>
    <div class="abs setrow"><button id="btn-gear" aria-label="settings"><svg width="28" height="28" viewBox="0 0 28 28"><g fill="#fff"><circle cx="14" cy="14" r="8.5"/><rect x="11.5" y="1" width="5" height="26" rx="1"/><rect x="1" y="11.5" width="26" height="5" rx="1"/><rect x="11.5" y="1" width="5" height="26" rx="1" transform="rotate(45 14 14)"/><rect x="11.5" y="1" width="5" height="26" rx="1" transform="rotate(-45 14 14)"/></g><circle cx="14" cy="14" r="3.6" fill="#7c7c7c"/></svg></button><button id="btn-spk" aria-label="mute"><svg id="spk-svg" width="30" height="26" viewBox="0 0 30 26"><path d="M3 9 H9 L16 3 V23 L9 17 H3 Z" fill="#fff"/><path id="spk-w" d="M20 8 Q24 13 20 18 M23.5 4.5 Q30 13 23.5 21.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><path id="spk-x" d="M20 8 L28 18 M28 8 L20 18" stroke="#fff" stroke-width="2.8" stroke-linecap="round" style="display:none"/></svg></button><input id="vol" type="range" min="0" max="100" value="70" aria-label="volume" /></div>
    <div class="abs ver otxt">version 1.2</div>
    <div class="abs pik">pikmer.com</div>
    <button class="btn gr" id="btn-credits">credits</button>
  </section>

  <section id="scr-shop" class="screen">
    <div class="abs wgrid" id="wgrid"></div>
    <div class="abs shopbot">
      <div id="shop-ship"></div>
      <div id="shop-desc"><div id="sd-name" class="otxt">twin</div><div id="sd-text"></div><button class="btn g" id="sd-act">BUY</button><div id="sd-note"></div></div>
      <button class="backbtn" id="shop-back" aria-label="back"><svg width="62" height="62" viewBox="0 0 60 60"><path d="M40 47 H25 A14.5 14.5 0 0 1 25 18 H42" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M35 7 L49 18 L35 29 Z" fill="#fff"/></svg></button>
    </div>
  </section>

  <section id="scr-pause" class="screen">
    <div class="panel">
      <div class="ptitle otxt3">Pause</div>
      <div id="pause-ship" class="ptile"></div>
      <div id="pause-ups"></div>
      <button class="btn g" id="btn-resume">RESUME</button>
      <button class="btn o" id="btn-quit">QUIT</button>
    </div>
  </section>

  <section id="scr-lv" class="screen">
    <div class="panel">
      <div class="ptitle otxt3">Power Up</div>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  }
  const ss = $('shop-ship'); ss.innerHTML = ''; ss.appendChild(shipCanvas(sh, 328, eqOf(sh)));
  const w = WEAPONS[shopSel], act = $('sd-act'), note = $('sd-note');
  $('sd-name').textContent = shopSel; $('sd-text').textContent = w.desc;
  if (sh.start.includes(shopSel)) { act.textContent = 'BUILT-IN'; act.className = 'btn gr dis'; note.textContent = sh.id + ' already has it'; }
  else if (!S.owned[shopSel]) { act.innerHTML = 'BUY <i class="coin s">C</i> ' + w.cost; act.className = 'btn g' + (S.coins < w.cost ? ' dis' : ''); note.textContent = S.coins < w.cost ? 'not enough coins' : 'equips on ' + sh.id; }
  else if (S.equip[sh.id] === shopSel) { act.textContent = 'REMOVE'; act.className = 'btn r'; note.textContent = 'equipped on ' + sh.id; }
  else { act.textContent = 'EQUIP'; act.className = 'btn b'; note.textContent = 'equip on ' + sh.id; }
  updCoins();
}
$('sd-act').addEventListener('click', () => {
  const sh = shipById(S.sel), id = shopSel, w = WEAPONS[id];
  if (sh.start.includes(id)) { AU.play('deny'); return; }
  if (!S.owned[id]) { if (S.coins < w.cost) { AU.play('deny'); return; } S.coins -= w.cost; S.owned[id] = true; S.equip[sh.id] = id; AU.play('buy'); }
  else if (S.equip[sh.id] === id) { delete S.equip[sh.id]; AU.play('ui'); }
  else { S.equip[sh.id] = id; AU.play('ui'); }
  persist(); buildShop();
});
$('shop-back').addEventListener('click', () => { AU.play('ui'); goTitle(); });

/* ---------------- settings / credits ---------------- */
let resetArm = 0;
function openModal(kind) {
  AU.init(); AU.play('ui');
  showScreen('scr-modal'); $('scr-title').classList.add('on');
  const body = $('m-body');
  if (kind === 'settings') {
    $('m-title').textContent = 'Settings';
    body.innerHTML = '<div class="mrow"><div class="lab otxt">sound</div><input type="range" id="m-vol" min="0" max="100" aria-label="volume"></div>' +
      '<div class="mrow"><div class="lab otxt">screen shake</div><button class="btn mbtn" id="m-shake"></button></div>' +
      '<div class="mrow"><div class="lab otxt">save data</div><button class="btn mbtn r" id="m-reset">RESET</button></div>' +
      '<div class="otxt" style="font-size:16px;margin-top:14px;font-weight:500">Move: mouse (or drag on touch) · Bomb: left click / tap / Space · Pause: right click / Esc</div>';
    const mv = $('m-vol'); mv.value = Math.round(S.vol * 100);
    mv.addEventListener('input', () => { const v = mv.value / 100; AU.setVol(v); if (v > 0) S.lastVol = v; persist(); updSpk(); });
    const sb = $('m-shake'); const upd = () => { sb.textContent = S.shake ? 'ON' : 'OFF'; sb.className = 'btn mbtn ' + (S.shake ? 'g' : 'gr'); };
    upd(); sb.addEventListener('click', () => { S.shake = !S.shake; persist(); upd(); AU.play('ui'); });
    const rb = $('m-reset'); resetArm = 0;
    rb.addEventListener('click', () => {
      if (performance.now() - resetArm < 3000) { const v = S.vol; S = defSave(); S.vol = v; persist(); rb.textContent = 'DONE'; AU.play('deny'); resetArm = 0; updCoins(); return; }
      resetArm = performance.now(); rb.textContent = 'SURE?'; AU.play('ui');
    });
  } else {
    $('m-title').textContent = 'Credits';
    body.innerHTML = '<div class="otxt" style="font-size:22px;font-weight:800">Shape Shooter 3</div>' +
      '<div class="otxt" style="margin-top:6px">Original game designed and developed by <span style="color:#fff23b">pikmer</span> (pikmer.com).</div>' +
      '<div class="otxt" style="margin-top:10px">This tribute recreation is a single HTML file: graphics are drawn with code and all sound effects and music are synthesized in real time.</div>' +
      '<div class="otxt" style="margin-top:10px">Fonts: M PLUS Rounded 1c, Saira (Google Fonts).</div>';
  }
}
$('m-close').addEventListener('click', () => { AU.play('ui'); goTitle(); });

/* ---------------- title wiring ---------------- */
function updSpk() { $('spk-w').style.display = S.vol > 0 ? '' : 'none'; $('spk-x').style.display = S.vol > 0 ? 'none' : ''; }
$('btn-play').addEventListener('click', startGame);
$('btn-weap').addEventListener('click', openShop);
$('btn-mix').addEventListener('click', () => {
  AU.init();
  const ships = SHIPS.filter(s => S.unlocked.includes(s.id)), owned = WEAPON_IDS.filter(w => S.owned[w]);
  let sh = pick(ships);
  for (let n = 0; ships.length > 1 && sh.id === S.sel && n < 12; n++) sh = pick(ships);
  const cand = owned.filter(w => !sh.start.includes(w));
  if (ships.length < 2 && !cand.length) { AU.play('deny'); return; }
  S.sel = sh.id; if (cand.length) S.equip[sh.id] = pick(cand);
  persist(); AU.play('buy'); refreshTitle();
});
const toggleMode = () => { AU.init(); S.mode = S.mode === 'normal' ? 'hard' : 'normal'; persist(); AU.play('ui'); refreshTitle(); };
$('mode-prev').addEventListener('click', toggleMode);
$('mode-next').addEventListener('click', toggleMode);
$('btn-gear').addEventListener('click', () => openModal('settings'));
$('btn-credits').addEventListener('click', () => openModal('credits'));
$('vol').addEventListener('input', e => { AU.init(); const v = e.target.value / 100; AU.setVol(v); if (v > 0) S.lastVol = v; updSpk(); persist(); });
$('btn-spk').addEventListener('click', () => { AU.init(); if (S.vol > 0) { S.lastVol = S.vol; AU.setVol(0); } else AU.setVol(S.lastVol || 0.7); $('vol').value = Math.round(S.vol * 100); updSpk(); persist(); AU.play('ui'); });
$('btn-resume').addEventListener('click', resumeGame);
$('btn-quit').addEventListener('click', () => { if (state !== 'pause') return; AU.play('ui'); AU.stopMusic(); showResult(endRun()); });
$('btn-cont').addEventListener('click', () => { if (state === 'over') doContinue(); });
$('btn-go').addEventListener('click', () => { if (state !== 'over') return; AU.play('ui'); showResult(endRun()); });
$('btn-retry').addEventListener('click', () => { AU.play('ui'); goTitle(); });
document.addEventListener('pointerdown', e => { AU.init(); if (e.pointerType === 'touch') touchMode = true; else if (e.pointerType === 'mouse') touchMode = false; }, { capture: true });

/* ---------------- gameplay input ---------------- */
cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; if (e.pointerType !== 'touch') touchMode = false; });
cv.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (e.pointerType === 'touch') {
    touchMode = true;
    if (state !== 'play') return;
    const pg = pauseGeom(), bg = bombGeom();
    if (Math.hypot(e.clientX - pg.x, e.clientY - pg.y) < pg.R + 10) { pauseGame(); return; }
    if (Math.hypot(e.clientX - bg.x, e.clientY - bg.y) < bg.R + 10) { useBomb(); return; }
    touchActive = true; touchStart = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
    return;
  }
  touchMode = false;
  if (state !== 'play') return;
  if (e.button === 0) useBomb(); else if (e.button === 2) pauseGame();
});
const endTouch = e => {
  if (e.pointerType !== 'touch') return;
  if (touchStart && e.pointerId === touchStart.id) {
    const dt = performance.now() - touchStart.t, mv = Math.hypot(e.clientX - touchStart.x, e.clientY - touchStart.y);
    if (state === 'play' && dt < 200 && mv < 14) useBomb();
    touchStart = null;
  }
  touchActive = false;
};
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { if (state === 'play') useBomb(); e.preventDefault(); }
  else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); }
  else if (state === 'levelup' && /^Digit[123]$/.test(e.code)) chooseOpt(+e.code.slice(5) - 1);
  else if (state === 'title' && e.code === 'Enter') startGame();
});
window.addEventListener('blur', () => { if (state === 'play') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pauseGame(); });

/* ---------------- title preview (live demo) ---------------- */
const demo = {
  c: $('demo'), g: null, t: 0, s: { x: 0, y: 0, a: 0 }, en: [], bl: [], pt: [], spawnT: 0, fireT: 0,
  tick(dt) {
    if (!this.g) this.g = this.c.getContext('2d');
    dt = Math.min(dt, 0.05);
    const g = this.g, Wd = this.c.width, Hd = this.c.height, sc = 0.74, vw = Wd / sc, vh = Hd / sc, s = this.s;
    this.t += dt;
    const tx = Math.cos(this.t * 0.45) * vw * 0.2, ty = Math.sin(this.t * 0.75) * vh * 0.16;
    s.x += (tx - s.x) * Math.min(1, dt * 2); s.y += (ty - s.y) * Math.min(1, dt * 2);
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = 0.5; const a = rnd(0, TAU), R = Math.hypot(vw, vh) / 2 + 30, type = pick(['tri', 'tri', 'square', 'orb', 'square']);
      const e = { x: s.x + Math.cos(a) * R, y: s.y + Math.sin(a) * R, type, r: type === 'tri' ? 18 : type === 'square' ? 24 : 10, hp: type === 'square' ? 3 : 1, f: 0 };
      e.a = Math.atan2(s.y - e.y, s.x - e.x); e.sp = type === 'tri' ? 170 : type === 'orb' ? 120 : 65;
      this.en.push(e);
    }
    let best = null, bd = 1e9;
    for (const e of this.en) { const d = Math.hypot(e.x - s.x, e.y - s.y); if (e.type !== 'orb' && d < bd) { bd = d; best = e; } }
    if (best) s.a = turnTo(s.a, Math.atan2(best.y - s.y, best.x - s.x), 7 * dt);
    this.fireT -= dt;
    if (this.fireT <= 0) { this.fireT = 0.14; this.bl.push({ x: s.x + Math.cos(s.a) * 37, y: s.y + Math.sin(s.a) * 37, vx: Math.cos(s.a) * 540, vy: Math.sin(s.a) * 540, l: 0.9 }); }
    for (const e of this.en) {
      if (e.type === 'square') e.a = turnTo(e.a, Math.atan2(s.y - e.y, s.x - e.x), 2 * dt);
      e.x += Math.cos(e.a) * e.sp * dt; e.y += Math.sin(e.a) * e.sp * dt; if (e.f > 0) e.f -= dt;
      if (Math.hypot(e.x - s.x, e.y - s.y) < SHIELD_R + e.r * 0.6) { e.dead = true; this.burst(e.x, e.y, e.type === 'orb'); }
    }
    for (const b of this.bl) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt;
      for (const e of this.en) { if (!e.dead && e.type !== 'orb' && Math.hypot(e.x - b.x, e.y - b.y) < e.r + 8) { b.l = 0; e.f = 0.07; if (--e.hp <= 0) { e.dead = true; this.burst(e.x, e.y, false); } break; } }
    }
    this.en = this.en.filter(e => !e.dead && Math.hypot(e.x - s.x, e.y - s.y) < 1000);
    this.bl = this.bl.filter(b => b.l > 0);
    for (const q of this.pt) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.94; q.vy *= 0.94; q.rot += q.vr * dt; }
    this.pt = this.pt.filter(q => q.t < q.life);
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = COL.bg; g.fillRect(0, 0, Wd, Hd);
    g.setTransform(sc, 0, 0, sc, Wd / 2 - s.x * sc * 0.3, Hd / 2 - s.y * sc * 0.3);
    const cxw = s.x * 0.3, cyw = s.y * 0.3, hw = vw / 2 + 60, hh = vh / 2 + 60;
    g.fillStyle = COL.grid;
    for (let x = Math.floor((cxw - hw) / 60) * 60; x < cxw + hw; x += 60) g.fillRect(x - 3.5, cyw - hh, 7, hh * 2);
    for (let y = Math.floor((cyw - hh) / 60) * 60; y < cyw + hh; y += 60) g.fillRect(cxw - hw, y - 3.5, hw * 2, 7);
    g.lineJoin = 'round'; g.lineCap = 'round';
    for (const q of this.pt) { g.globalAlpha = Math.max(0, 1 - q.t / q.life); g.save(); g.translate(q.x, q.y); g.rotate(q.rot); g.lineWidth = 2; g.beginPath(); g.rect(-q.s / 2, -q.s / 2, q.s, q.s); fs(g, q.orb ? COL.oFill : COL.eFill, q.orb ? COL.oLine : COL.eLine); g.restore(); }
    g.globalAlpha = 1;
    for (const e of this.en) {
      g.save(); g.translate(e.x, e.y); g.lineWidth = e.type === 'orb' ? 3.5 : 4.5;
      if (e.type === 'orb') { g.beginPath(); g.arc(0, 0, e.r, 0, TAU); fs(g, COL.oFill, COL.oLine); }
      else { g.rotate(e.a); enemyBody(g, e.type, e.r, e.f > 0 ? '#fff' : COL.eFill, e.f > 0 ? '#fff' : COL.eLine); }
      g.restore();
    }
    g.lineWidth = 3;
    for (const b of this.bl) { g.beginPath(); g.arc(b.x, b.y, 8, 0, TAU); fs(g, COL.bFill, COL.bLine); }
    g.save(); g.translate(s.x, s.y); drawShip(g, [B0], {}, s.a, 0);
    g.beginPath(); g.arc(0, 0, SHIELD_R, 0, TAU); g.fillStyle = COL.shield; g.fill(); g.lineWidth = 3; g.strokeStyle = COL.shieldLine; g.stroke();
    g.restore();
  },
  burst(x, y, orb) { for (let i = 0; i < 7; i++) { const a = rnd(0, TAU), v = rnd(60, 220); this.pt.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: rnd(0, TAU), vr: rnd(-7, 7), t: 0, life: rnd(0.4, 0.7), s: rnd(5, 10), orb }); } }
};

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  if (G && (state === 'play' || state === 'dying')) {
    const n = Math.max(1, Math.ceil(dt / (1 / 60))), h = dt / n;
    for (let i = 0; i < n && (state === 'play' || state === 'dying'); i++) update(h);
  }
  if (state === 'title' || state === 'shop') { titleCam.a += dt * 0.05; titleCam.x += Math.cos(titleCam.a) * 22 * dt; titleCam.y += Math.sin(titleCam.a * 0.7) * 16 * dt; }
  render();
  if (state === 'title') demo.tick(dt);
  AU.tickMusic();
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);
})();
</script>
