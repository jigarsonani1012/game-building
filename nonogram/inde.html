<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#dcecf8" />
<meta name="description" content="NONOGRAM SQUARE — The Art of Number Logic. Fill cells by number clues to reveal hidden pixel art masterpieces!" />
<title>NONOGRAM SQUARE — The Art of Number Logic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ============ THEME TOKENS ============ */
:root{
  color-scheme: light;
  scrollbar-color: #9cb0c5 transparent;
  scrollbar-width: thin;
  --bg-grad: linear-gradient(160deg,#f0f8fe 0%,#e3f0fa 45%,#d7e8f6 100%);
  --card:#ffffff;
  --card-2:#f4f8fc;
  --text:#2f333b;
  --heading:#262b33;
  --muted:#8b98a8;
  --muted-2:#b6c1cd;
  --brand:#2d86c7;
  --brand-2:#1370b4;
  --brand-tint:#e2f0fa;
  --hair:#d4dde7;
  --sep:#93a4b8;
  --clue-bg:#eef4f9;
  --clue:#475569;
  --clue-done:#c2ccd8;
  --fill:#2f333b;
  --xmark:#94a3b8;
  --cell:#ffffff;
  --lit:rgba(45,134,199,.08);
  --border:#d7e0e9;
  --shadow:rgba(30,60,90,.16);
  --track:#cfdae5;
}
html.dark{
  color-scheme: dark;
  scrollbar-color: #2b394e transparent;
  scrollbar-width: thin;
  --bg-grad: linear-gradient(160deg,#141c2e 0%,#101827 50%,#0c1320 100%);
  --card:#1f2a3d;
  --card-2:#172235;
  --text:#e9eff8;
  --heading:#f1f5fb;
  --muted:#7d8ca3;
  --muted-2:#48576e;
  --brand:#4ea3d6;
  --brand-2:#2d86c7;
  --brand-tint:#16314a;
  --hair:#29364b;
  --sep:#41506a;
  --clue-bg:#101827;
  --clue:#cbd5e1;
  --clue-done:#3a4a60;
  --fill:#e9eff8;
  --xmark:#64748b;
  --cell:#141d2e;
  --lit:rgba(78,163,214,.16);
  --border:#334155;
  --shadow:rgba(0,0,0,.45);
  --track:#2c3a50;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Baloo 2",ui-rounded,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:#e3f0fa;color:var(--text);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
html.dark body{background:#0c1320}
#app{width:100%;height:100%;height:100dvh;overflow:hidden;position:relative}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.mono{font-family:"Roboto Mono",ui-monospace,Consolas,monospace}
.ic{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic-fill{fill:currentColor;stroke:none}
.no-select{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.press{transition:transform .08s ease,filter .15s ease}
.press:active{transform:scale(.92)}
.screen{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg-grad);animation:screen-in .28s ease-out both}
@keyframes screen-in{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============ FLOATING SQUARES / CONFETTI ============ */
.floats{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaty{
  position:absolute;border-radius:6px;
  animation:floaty var(--dur,14s) ease-in-out var(--delay,0s) infinite alternate;
  pointer-events:none;
  filter:blur(0.5px);
  will-change:transform;
}
@keyframes floaty{
  0%{transform:translate(0, 0) rotate(var(--rot,0deg))}
  50%{transform:translate(var(--drift-x, 8px), -12px) rotate(calc(var(--rot,0deg) + 6deg))}
  100%{transform:translate(calc(var(--drift-x, 8px) * -0.5), 6px) rotate(calc(var(--rot,0deg) - 4deg))}
}
@media(max-width: 600px), (max-height: 560px){
  .floaty:nth-child(n+9){display:none}
  .floaty{opacity:0.65 !important}
}
@media(max-height: 420px), (max-width: 360px){
  .floaty:nth-child(n+6){display:none}
}
.screen > *:not(.floats){position:relative;z-index:1}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti-piece{position:absolute;top:-12px;animation:confetti-fall var(--dur,3.2s) linear var(--delay,0s) forwards}
@keyframes confetti-fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(var(--spin,720deg));opacity:.95}}

/* ============ GENERIC BUTTONS ============ */
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--muted);
  transition:background .18s ease,color .18s ease,transform .12s ease;
}
.icon-btn:hover{
  background:rgba(45,134,199,.12);
  color:var(--brand-2);
}
html.dark .icon-btn:hover{
  background:rgba(78,163,214,.18);
  color:var(--brand);
}
.icon-btn:active{transform:scale(.92)}
.btn-primary{
  width:100%;border-radius:14px;padding:13px 16px;color:#fff;font-weight:800;font-size:17px;
  letter-spacing:.08em;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(to bottom,#2a91d4,#1370b4);
  box-shadow:0 4px 0 #0c5283, 0 10px 22px rgba(19,99,156,.35);
  transition:filter .15s ease,transform .1s ease;
}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{
  flex:1;border-radius:12px;padding:10px;border:2px solid var(--border);
  color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.btn-ghost:hover{
  background:var(--card-2);
  color:var(--heading);
  border-color:var(--brand);
}

/* ============ MAIN MENU ============ */
.menu-top{display:flex;justify-content:flex-end;gap:4px;padding:clamp(6px, 1.5vh, 14px) clamp(12px, 2vw, 20px);position:relative;z-index:2;flex:0 0 auto}
.menu-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(4px, 1.5vh, 16px) clamp(12px, 2vw, 20px);position:relative;z-index:2;overflow:auto}
.menu-col{width:100%;max-width:min(450px, 94vw);margin:auto;display:flex;flex-direction:column;gap:clamp(8px, 1.8vh, 16px)}
.menu-brand{text-align:center;margin-bottom:clamp(0px, 0.6vh, 4px);animation:slide-up .32s ease-out both}
.brand-title{
  font-size:clamp(19px, 3.6vh, 27px);font-weight:900;letter-spacing:0.14em;line-height:1.1;text-transform:uppercase;
  background:linear-gradient(135deg,#1370b4,#2a91d4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 8px rgba(19,112,180,.18));
}
html.dark .brand-title{
  background:linear-gradient(135deg,#38bdf8,#818cf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(56,189,248,.35));
}
.brand-sub{
  font-family:"Roboto Mono",monospace;font-size:clamp(9.5px, 1.3vh, 11px);font-weight:700;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-top:clamp(2px, 0.4vh, 4px);
}
.mode-card{
  display:flex;align-items:center;gap:clamp(12px, 2vw, 16px);width:100%;text-align:left;
  border-radius:clamp(14px, 2vh, 18px);border:2px solid var(--card);
  background:var(--card);padding:clamp(10px, 1.6vh, 16px) clamp(12px, 2vw, 18px);
  animation:slide-up .32s ease-out both;
  transition:transform .15s ease,box-shadow .15s ease;
}
.mode-card:hover{transform:translateY(-2px)}
@keyframes slide-up{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.mode-ic{width:clamp(48px, 6.8vh, 60px);height:clamp(48px, 6.8vh, 60px);flex:0 0 auto;border-radius:clamp(10px, 1.4vh, 14px);display:flex;align-items:center;justify-content:center;font-size:clamp(24px, 3.4vh, 30px)}
.mode-main{flex:1;min-width:0}
.mode-title{font-size:clamp(14.5px, 2vh, 17.5px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--heading);display:flex;align-items:center;gap:8px}
.mode-sub{font-family:"Roboto Mono",monospace;font-size:clamp(11px, 1.3vh, 12.5px);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-top:clamp(4px, 0.8vh, 7px);height:clamp(4px, 0.7vh, 6px);border-radius:99px;background:var(--track);overflow:hidden;display:flex;align-items:center;gap:8px}
.prog > i{display:block;height:100%;border-radius:99px;background:var(--pc,#2d86c7);transition:width .5s ease}
.prog-count{font-family:"Roboto Mono",monospace;font-size:11px;font-weight:600;color:var(--muted);margin-left:6px;white-space:nowrap}
.mode-foot{display:flex;align-items:center;gap:8px}
.streak-badge{display:inline-flex;align-items:center;gap:4px;background:#ffe9d6;color:#e8801c;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:800}
html.dark .streak-badge{background:rgba(245,146,40,.16)}
.quick{
  margin-top:2px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  border-radius:clamp(14px, 2vh, 18px);padding:clamp(12px, 1.8vh, 16px);
  font-size:clamp(15px, 2.2vh, 19px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;
  background:linear-gradient(to bottom,#2a91d4,#1370b4);
  box-shadow:0 5px 0 #0c5283,0 14px 26px rgba(19,99,156,.35);
  animation:slide-up .32s ease-out .22s both;
}
.quick .ic{width:clamp(22px, 3vh, 26px);height:clamp(22px, 3vh, 26px);fill:#fff;stroke:#fff}

@media(max-height: 560px){
  .menu-top{padding:4px 10px}
  .menu-brand{margin-bottom:0}
  .brand-title{font-size:18px;letter-spacing:0.14em}
  .brand-sub{font-size:8.5px;letter-spacing:0.18em}
  .menu-col{gap:5px;max-width:420px}
  .mode-card{padding:5px 12px;gap:10px}
  .mode-ic{width:36px;height:36px;font-size:18px;border-radius:8px}
  .quick{padding:7px 12px;font-size:13px}
}

.ls-head{display:flex;align-items:center;justify-content:space-between;padding:clamp(4px, 1.2vh, 10px) clamp(8px, 2vw, 14px);flex:0 0 auto}
@media (max-height: 560px){
  .ls-head{padding:3px 10px 0}
  .ls-head .back-link{padding:4px 8px;font-size:12px}
  .ls-head .back-link .ic{font-size:22px}
  .ls-head .icon-btn{width:32px;height:32px;font-size:18px}
  .ls-head span{font-size:14.5px !important}
}
.back-link{
  display:flex;align-items:center;gap:6px;border-radius:99px;padding:8px 12px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text);
  transition:background .18s ease,color .18s ease,transform .12s ease;
}
.back-link:hover{background:rgba(45,134,199,.12);color:var(--brand-2)}
html.dark .back-link:hover{background:rgba(78,163,214,.18);color:var(--brand)}
.back-link:active{transform:scale(.96)}
.back-link .ic{font-size:28px}
.head-tools{display:flex;gap:2px}
.tabs{display:flex;justify-content:center;gap:clamp(24px,8vw,52px);padding:8px 0 4px}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:8px;
  color:var(--muted);font-size:clamp(12px,1.6vw,15px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  transition:color .18s ease;
}
.tab:hover{color:var(--heading)}
.tab .ic{font-size:20px}
.tab .uline{height:2px;width:100%;border-radius:2px;background:transparent}
.tab.active{color:var(--brand)}
.tab.active .uline{background:var(--brand)}
.levels-wrap{flex:1;overflow:auto;padding:14px 16px 30px;scrollbar-width:thin}
.levels{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,16px)}
.tile{
  position:relative;aspect-ratio:1/1;border-radius:12px;border:2px solid var(--border);background:var(--card);overflow:hidden;
  box-shadow:0 3px 0 rgba(70,90,110,.12);animation:slide-up .3s ease-out both;transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;
}
.tile:hover:not(.locked):not(:disabled){transform:translateY(-2px);border-color:var(--brand);box-shadow:0 6px 14px var(--shadow)}
.tile.next{border-color:var(--brand);box-shadow:0 0 0 2px rgba(45,134,199,.35),0 8px 18px rgba(45,134,199,.28)}
.tile.next .q{color:var(--brand);font-weight:900}
.tile.solved{border-color:#9fc3dd}
html.dark .tile.solved{border-color:#3f5d78}
.tile.locked{
  background:var(--card-2);
  cursor:not-allowed;
  border-color:var(--hair);
  box-shadow:none;
}
html.dark .tile.locked{
  background:#111a29;
  border-color:#1e293b;
}
.tile .q{
  position:absolute;inset:0 0 10px 0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(32px,7.5vw,48px);font-weight:800;color:var(--clue);line-height:1;
}
.tile.locked .q{
  color:var(--muted);
  opacity:.65;
}
.tile.locked .lock-ic{
  position:absolute;top:6px;right:6px;
  width:22px;height:22px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);z-index:2;
}
html.dark .tile.locked .lock-ic{background:#1f2a3d;border-color:#334155;box-shadow:0 1px 6px rgba(0,0,0,.4);color:var(--muted)}
.tile.locked .lock-ic .ic{width:13px;height:13px}
.tile .q-num,.tile .q-locked{font-family:"Roboto Mono",monospace;font-size:11px;font-weight:700;color:var(--muted);position:absolute;bottom:6px;left:0;right:0;text-align:center;z-index:2}
.tile.next .q-num{color:var(--brand);font-weight:800}
.tile .thumb{width:100%;height:100%;padding:10%}
.starbadge{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:#12a880;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tile-progress{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:34px;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.tile-progress > i{display:block;height:100%;background:var(--brand)}

/* ============ DAILY CHALLENGE SCREEN ============ */
.daily-wrap{flex:1;overflow:auto;padding:14px 18px 36px;scrollbar-width:thin}
.daily-col{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column}
.day-hero{
  border:3px solid #33c79f;border-radius:18px;background:var(--card);
  padding:18px 20px;box-shadow:0 8px 24px var(--shadow);margin-bottom:20px;
  animation:slide-up .3s ease-out both;
}
html.dark .day-hero{border-color:#12a880}
.day-hero .dh-k{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#12a880;font-weight:800}
html.dark .day-hero .dh-k{color:#3cd4aa}
.day-hero .dh-t{font-size:24px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--heading);margin:6px 0 14px}
.day-hero .dh-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh-tag{
  display:inline-flex;align-items:center;gap:7px;background:var(--card-2);border-radius:10px;
  padding:8px 12px;font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--text);
  border:1px solid var(--border);
}
.btn-play-daily{
  margin-left:auto;min-height:42px;padding:0 22px;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;
  background:linear-gradient(180deg,#29be97,#12a880);
  box-shadow:0 3px 0 #0c7559,0 8px 18px rgba(18,168,128,.35);
  transition:transform .1s ease,filter .15s ease;
}
.btn-play-daily:hover{filter:brightness(1.06)}
.btn-play-daily:active{transform:translateY(2px);box-shadow:0 1px 0 #0c7559,0 4px 10px rgba(18,168,128,.3)}

.sect-k{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:6px 2px 14px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(5px,1.4vw,8px);position:relative;z-index:2}
.cal .dow{text-align:center;font-size:11px;letter-spacing:1px;font-weight:800;color:var(--muted);padding-bottom:4px}
.cal .d{
  aspect-ratio:1;border-radius:10px;background:var(--card-2);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-size:13px;font-weight:700;
  color:var(--text);position:relative;overflow:hidden;cursor:pointer;
  transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;
  touch-action:manipulation;
}
html.dark .cal .d{background:#172235;border-color:#29364b;color:#e9eff8}
.cal .d:hover:not(.future):not(:disabled){transform:translateY(-2px);border-color:var(--brand)}
.cal .d:active:not(.future):not(:disabled){transform:scale(.94)}

.cal .d.today{border-color:var(--brand);box-shadow:0 0 0 2px rgba(45,134,199,.25)}
html.dark .cal .d.today{border-color:#4ea3d6;box-shadow:0 0 0 2px rgba(78,163,214,.35)}

.cal .d.done{
  background:var(--card);border-color:#12a880;
  box-shadow:0 2px 8px rgba(18,168,128,.2);
}
html.dark .cal .d.done{
  background:#1f2a3d;border-color:#3cd4aa;
  box-shadow:0 2px 10px rgba(0,0,0,.45);
}
.cal .d.done .cal-thumb{
  position:absolute;inset:0;padding:10%;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.cal .d.done .thumb{width:100%;height:100%}
.cal .d.done .thumb > span.b{background:var(--fill)}
.cal .d.done span.day-num{display:none}

.cal .d.future{opacity:.3;cursor:default;pointer-events:none}
html.dark .cal .d.future{opacity:.22;background:#101726;border-color:#1b2536}

.daily-subtext{font-size:11.5px;letter-spacing:.6px;color:var(--muted);text-align:center;line-height:1.7;margin:18px 6px 0}

@media (max-height: 560px){
  .daily-wrap{padding:6px 14px 20px}
  .day-hero{padding:10px 14px;margin-bottom:10px;border-radius:14px}
  .day-hero .dh-t{font-size:18px;margin:2px 0 8px}
  .day-hero .dh-r{gap:6px}
  .dh-tag{padding:4px 8px;font-size:11px}
  .btn-play-daily{min-height:34px;padding:0 14px;font-size:12px}
  .sect-k{margin:4px 2px 8px;font-size:10.5px}
  .cal .d{border-radius:7px}
  .daily-subtext{margin:10px 4px 0;font-size:10px}
}

.mosaic-link{
  display:flex;align-items:center;gap:clamp(10px, 1.5vw, 14px);width:100%;text-align:left;
  border-radius:clamp(14px, 2vh, 18px);border:2px dashed var(--brand);background:#e4f1fb;
  padding:clamp(10px, 1.4vh, 14px) clamp(12px, 2vw, 18px);color:var(--text);animation:slide-up .32s ease-out .15s both;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
html.dark .mosaic-link{background:#16253b}
.mosaic-link:hover{transform:translateY(-2px);background:#d5e9f8}
html.dark .mosaic-link:hover{background:#1c314f}
.mosaic-link-ic{
  width:clamp(38px, 5.2vh, 46px);height:clamp(38px, 5.2vh, 46px);flex:0 0 auto;border-radius:clamp(9px, 1.2vh, 12px);
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(18px, 2.5vh, 22px);
}
.mosaic-link-text{flex:1;min-width:0}
.mosaic-link-text b{display:block;font-size:clamp(13px, 1.8vh, 15px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--heading)}
.mosaic-link-text small{display:block;font-family:"Roboto Mono",monospace;font-size:clamp(10.5px, 1.3vh, 11.5px);color:var(--muted);margin-top:2px}
.mosaic-link-arrow{color:var(--brand);font-size:clamp(16px, 2.2vh, 20px)}

.mosaic-wrap{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(4px, 1.2vh, 12px) clamp(10px, 2vw, 16px);
  scrollbar-width:thin;
}
.mosaic-col{
  width:100%;max-width:min(380px, 94vw);margin:auto;display:flex;flex-direction:column;
  gap:clamp(5px, 1.2vh, 10px);align-items:stretch;
}

.mosaic-seg{display:flex;gap:4px;background:var(--card-2);border:2px solid var(--border);border-radius:12px;padding:3px}
.mosaic-seg button{flex:1;height:clamp(26px, 3.8vh, 32px);border-radius:8px;font-size:clamp(11px, 1.4vh, 12px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:all .15s ease}
.mosaic-seg button.on{background:var(--brand);color:#fff;box-shadow:0 3px 8px rgba(45,134,199,.35)}

.mosaic-tabs{display:flex;gap:clamp(5px, 1vw, 8px);overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;justify-content:center;max-width:100%}
.mosaic-tabs::-webkit-scrollbar{display:none}
.mosaic-tab{
  flex:0 0 auto;width:clamp(36px, 5.2vh, 48px);height:clamp(36px, 5.2vh, 48px);
  border-radius:10px;background:var(--card);
  border:2px solid var(--border);position:relative;overflow:hidden;padding:3px;cursor:pointer;
  transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;
}
.mosaic-tab:hover{transform:translateY(-2px)}
.mosaic-tab.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(45,134,199,.3)}
.mosaic-tab.fin::after{content:'';position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:#12a880;box-shadow:0 0 0 2px var(--card)}
.mosaic-tab .thumb{width:100%;height:100%;opacity:.35}
.mosaic-tab.on .thumb{opacity:1}

.mosaic-meta{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.mosaic-meta b{font-size:clamp(12px, 1.6vh, 13.5px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--heading)}
.mosaic-meta-right{display:flex;align-items:center;gap:6px}
.mosaic-mini-prog{width:36px;height:5px;border-radius:99px;background:var(--track);overflow:hidden;display:inline-block}
.mosaic-mini-prog > i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s ease}
.mosaic-meta span{font-family:"Roboto Mono",monospace;font-size:clamp(10.5px, 1.4vh, 11.5px);font-weight:700;color:var(--muted)}

.mosaic-board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px, 0.8vh, 6px);background:var(--card);
  border:2px solid var(--border);border-radius:16px;padding:clamp(5px, 1vh, 8px);box-shadow:0 8px 24px var(--shadow);
  width:100%;max-width:min(280px, 34vh);aspect-ratio:1/1;margin:0 auto;
}
.mosaic-board.all-fin{
  border-color:#12a880;
  box-shadow:0 0 0 2px rgba(18,168,128,.25), 0 8px 24px var(--shadow);
}
.mcell{
  position:relative;aspect-ratio:1/1;border-radius:clamp(7px, 1.2vh, 11px);overflow:hidden;
  background:var(--card-2);border:2px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease,border-color .18s ease,box-shadow .18s ease;
  touch-action:manipulation;padding:0;
}
.mcell:hover:not(:disabled){transform:translateY(-2px);border-color:var(--brand)}
.mcell:active:not(:disabled){transform:scale(.94)}

.mcell.cur{
  border-color:var(--brand);
  background:linear-gradient(135deg, var(--card-2), var(--brand-tint));
  box-shadow:0 0 0 2px rgba(45,134,199,.4), 0 4px 12px rgba(45,134,199,.25);
  animation:cur-pulse 2s infinite alternate ease-in-out;
}
@keyframes cur-pulse{
  0%{box-shadow:0 0 0 2px rgba(45,134,199,.3), 0 2px 6px rgba(45,134,199,.15)}
  100%{box-shadow:0 0 0 3px rgba(45,134,199,.6), 0 4px 14px rgba(45,134,199,.35)}
}
.mcell.cur .q{color:var(--brand);font-weight:900}
.mcell-play-badge{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  background:var(--brand);color:#fff;
  font-family:"Roboto Mono",monospace;font-size:clamp(6.5px, 0.9vh, 8px);font-weight:800;
  padding:1px 4px;border-radius:99px;letter-spacing:.06em;
  pointer-events:none;line-height:1;
}

.mcell.done{
  background:var(--card);border-color:#12a880;
  box-shadow:0 2px 6px rgba(18,168,128,.15);
}
html.dark .mcell.done{background:var(--card);border-color:#3cd4aa;box-shadow:0 2px 8px rgba(60,212,170,.2)}
.mcell-check{
  position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;
  background:#12a880;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:7px;box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none;
}
.mcell-check .ic{width:7px;height:7px;stroke-width:3}

.mcell.locked{opacity:.45;cursor:not-allowed}
html.dark .mcell.locked{opacity:.35}
.mcell.locked .q{color:var(--muted-2)}

.mcell .cal-thumb{
  position:absolute;inset:0;padding:6%;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.mcell .thumb{width:100%;height:100%}
.mcell .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-size:clamp(13px, 2vh, 16px);font-weight:800;color:var(--muted)}
.mcell:disabled{pointer-events:none}

.mosaic-actions{display:flex;gap:clamp(4px, 1vw, 8px);align-items:stretch;width:100%}
.mosaic-actions .btn-primary{padding:clamp(6px, 1.1vh, 9px) clamp(8px, 1.2vw, 12px);font-size:clamp(12px, 1.5vh, 14px);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mosaic-actions .btn-ghost{padding:clamp(6px, 1.1vh, 9px) clamp(8px, 1.2vw, 12px);font-size:clamp(11.5px, 1.4vh, 13px);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.mosaic-subtext{font-size:clamp(10px, 1.3vh, 11px);letter-spacing:.4px;color:var(--muted);text-align:center;line-height:1.3;margin:2px 0 0}

/* Compact rules for short screens / landscape viewports (e.g. 768x329) */
@media (max-height: 560px){
  .mosaic-wrap{padding:2px 10px 2px;scrollbar-width:none}
  .mosaic-wrap::-webkit-scrollbar{display:none}
  .mosaic-col{gap:clamp(2px, 0.7vh, 4px);max-width:min(330px, 92vw)}
  .mosaic-board{max-width:min(145px, 32vh);padding:3px;gap:3px;border-radius:12px}
  .mosaic-tab{width:clamp(28px, 5.5vh, 32px);height:clamp(28px, 5.5vh, 32px);border-radius:7px;padding:2px}
  .mosaic-seg button{height:22px;font-size:10px}
  .mosaic-meta b{font-size:11px}
  .mosaic-meta span{font-size:9.5px}
  .mosaic-mini-prog{width:28px;height:4px}
  .mosaic-actions .btn-primary,.mosaic-actions .btn-ghost{padding:4px 7px;font-size:11px}
  .mcell-play-badge{display:none}
  .mosaic-subtext{display:none}
}

/* Narrow mobile devices (width <= 360px) */
@media (max-width: 360px){
  .mosaic-wrap{padding:2px 6px 6px}
  .mosaic-col{gap:4px;max-width:100%}
  .mosaic-tab{width:34px;height:34px}
  .mosaic-board{max-width:230px;padding:5px;gap:3px}
  .mosaic-actions{gap:4px}
  .mosaic-actions .btn-primary,.mosaic-actions .btn-ghost{padding:6px 6px;font-size:11px}
  .mosaic-actions button span{font-size:10.5px}
  .mosaic-subtext{font-size:9.5px}
}

.full-reveal-art{width:min(260px,65vw);aspect-ratio:1/1;margin:12px auto;border-radius:16px;border:2px solid var(--border);background:var(--card);padding:8px;display:flex;align-items:center;justify-content:center}
.full-reveal-art .thumb{width:100%;height:100%}

/* ============ THUMBNAIL ============ */
.thumb{display:grid;gap:0;width:100%;height:100%}
.thumb > span{position:relative;width:100%;height:100%}
.thumb > span.b{background:var(--fill)}

/* ============ GAME ============ */
.g-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:clamp(6px, 1.5vw, 12px);padding:clamp(3px, 0.8vh, 6px) clamp(6px, 1.5vw, 12px) 2px;
  flex:0 0 auto;width:100%;box-sizing:border-box;
}
.g-head .back-link{
  padding:clamp(4px, 0.7vh, 7px) clamp(6px, 1vw, 10px);
  font-size:clamp(11.5px, 1.4vw, 13px);gap:4px;flex:0 0 auto;white-space:nowrap;
}
.g-head-right{
  display:flex;align-items:center;justify-content:flex-end;gap:clamp(3px, 0.7vw, 6px);flex:0 0 auto;
}
.chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:99px;
  padding:clamp(2px, 0.5vh, 5px) clamp(5px, 1vw, 9px);font-family:"Roboto Mono",monospace;
  font-size:clamp(10px, 1.3vw, 12.5px);font-weight:700;color:var(--clue);box-shadow:0 1px 3px rgba(30,60,90,.12);
  white-space:nowrap;flex:0 0 auto;
}
.chip .ic{font-size:clamp(12px, 1.6vw, 14px);color:var(--muted)}
.lives-chip{
  display:inline-flex;align-items:center;gap:clamp(2px, 0.45vw, 5px);
  padding:clamp(2px, 0.5vh, 5px) clamp(5px, 0.8vw, 9px);
}
.heart-slot{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:clamp(12px, 1.6vw, 15.5px);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  will-change:transform,opacity,filter;
}
.heart-slot .ic,
.chip.lives-chip .heart-slot .ic,
.chip.lives-chip .heart-slot.on .ic{
  color:#e11d48;
  fill:#e11d48;
}
html.dark .heart-slot .ic,
html.dark .chip.lives-chip .heart-slot .ic,
html.dark .chip.lives-chip .heart-slot.on .ic{
  color:#fb7185;
  fill:#fb7185;
}
.heart-slot.on{
  opacity:1;
  transform:scale(1);
  filter:drop-shadow(0 2px 5px rgba(225,29,72,.45));
}
.heart-slot.lost{
  opacity:0.9;
  transform:scale(0.94);
  filter:none;
}
.heart-slot.lost .ic path,
.chip.lives-chip .heart-slot.lost .ic path{
  stroke:#94a3b8 !important;
  stroke-width:2.2px !important;
  fill:rgba(148,163,184,.14) !important;
}
html.dark .heart-slot.lost .ic path,
html.dark .chip.lives-chip .heart-slot.lost .ic path{
  stroke:#64748b !important;
  stroke-width:2.2px !important;
  fill:rgba(100,116,139,.2) !important;
}
.heart-slot.flash{
  animation:heart-hit .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes heart-hit{
  0%{transform:scale(1.45);filter:drop-shadow(0 0 10px #be123c)}
  45%{transform:rotate(14deg) scale(0.9)}
  100%{transform:scale(0.94);opacity:0.9;filter:none}
}
.test-chip{
  background:linear-gradient(135deg,#0284c7,#0369a1);
  color:#ffffff !important;
  font-weight:800;
  cursor:pointer;
  border:none;
  padding:clamp(2px, 0.5vh, 5px) clamp(6px, 1.2vw, 10px);
  font-size:clamp(9.5px, 1.2vw, 11.5px);
  box-shadow:0 2px 8px rgba(2,132,199,.35);
  transition:transform .12s ease, filter .15s ease, box-shadow .15s ease;
  white-space:nowrap;flex:0 0 auto;
}
.test-chip:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 4px 12px rgba(2,132,199,.45)}
.test-chip:active{transform:scale(.94)}
html.dark .test-chip{
  background:linear-gradient(135deg,#38bdf8,#0284c7);
  color:#0b1329 !important;
  box-shadow:0 0 12px rgba(56,189,248,.35);
}
.g-title{
  text-align:center;font-family:"Roboto Mono",monospace;
  font-size:clamp(10.5px, 1.5vh, 12.5px);font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  padding:1px 10px 3px;flex:0 0 auto;width:100%;box-sizing:border-box;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media(max-width: 480px){
  .g-head .back-link span{display:none}
  .g-head .back-link{padding:4px 6px}
  .test-chip span{display:none}
  .test-chip{padding:3px 7px;font-size:12px}
}
@media(max-width: 360px){
  .chip{padding:2px 5px;font-size:9.5px}
  .lives-chip{padding:2px 4px;gap:2px}
  .heart-slot{font-size:11px}
}
.board-wrap{flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:clamp(2px, 0.8vh, 8px) clamp(4px, 1.2vw, 12px);box-sizing:border-box}
.board{margin:auto;position:relative;touch-action:none;border:2px solid var(--sep);border-radius:2px;overflow:hidden;background:var(--card);box-shadow:none;display:grid;box-sizing:border-box;max-width:100%;max-height:100%}
.corner{
  background:var(--clue-bg);
  border-right:2px solid var(--sep);
  border-bottom:2px solid var(--sep);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2px;
  overflow:hidden;
  box-sizing:border-box;
}
.corner-canvas{
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  border-radius:2px;
  background:var(--cell);
  border:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  box-sizing:border-box;
  transition:border-color .15s ease, background .15s ease;
}
html.dark .corner-canvas{
  background:var(--cell);
  border-color:var(--border);
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.cc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:clamp(1px, 0.3vh, 2px);padding:2px 1px;background:var(--clue-bg);border-bottom:2px solid var(--sep);overflow:hidden;box-sizing:border-box}
.rc{display:flex;align-items:center;justify-content:flex-end;gap:clamp(2px, 0.5vw, 4px);padding:1px clamp(3px, 0.8vw, 6px);background:var(--clue-bg);border-right:2px solid var(--sep);overflow:hidden;box-sizing:border-box}
.cc span,.rc span{font-family:"Roboto Mono",monospace;font-weight:600;color:var(--clue);line-height:1;white-space:nowrap}
.cc span.done,.rc span.done{color:var(--clue-done);text-decoration:line-through}
.cell{position:relative;background:var(--cell);cursor:pointer;touch-action:none}
.cell.lit{background:var(--lit)}
.cell .blk{position:absolute;inset:1px;background:var(--fill);border-radius:1px;animation:pop-in .13s ease-out;pointer-events:none}
@keyframes pop-in{0%{transform:scale(.3);opacity:.4}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.cell.err .blk{background:#ef4444;animation:shake-cell .3s ease-in-out}
@keyframes shake-cell{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}50%{transform:translateX(2px)}75%{transform:translateX(-1px)}}
.cell .xmark{position:absolute;inset:18%;width:64%;height:64%;pointer-events:none}
.cell .xmark path{stroke:var(--xmark);stroke-width:1.6;stroke-linecap:round;animation:x-pop .12s ease-out}
@keyframes x-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.cell.hinted{position:relative;z-index:4}
.cell.hinted::before{
  content:"";position:absolute;inset:0;z-index:2;
  border:2px solid #0ea5e9;background:rgba(14,165,233,.3);
  box-shadow:0 0 10px rgba(14,165,233,.85), inset 0 0 6px rgba(14,165,233,.5);
  border-radius:1px;pointer-events:none;
  animation:hint-glow .7s ease-in-out infinite alternate;
}
html.dark .cell.hinted::before{
  border-color:#38bdf8;background:rgba(56,189,248,.35);
  box-shadow:0 0 12px rgba(56,189,248,.9), inset 0 0 7px rgba(56,189,248,.6);
}
@keyframes hint-glow{
  0%{transform:scale(1);opacity:.85;box-shadow:0 0 5px rgba(14,165,233,.6), inset 0 0 3px rgba(14,165,233,.35)}
  100%{transform:scale(1.08);opacity:1;box-shadow:0 0 14px rgba(14,165,233,1), inset 0 0 8px rgba(14,165,233,.65)}
}
html.dark @keyframes hint-glow{
  0%{transform:scale(1);opacity:.85;box-shadow:0 0 6px rgba(56,189,248,.6), inset 0 0 4px rgba(56,189,248,.4)}
  100%{transform:scale(1.08);opacity:1;box-shadow:0 0 16px rgba(56,189,248,1), inset 0 0 9px rgba(56,189,248,.7)}
}
.won .cell .blk{animation:none}

/* ============ LEVEL 1 TUTORIAL BANNER ============ */
.tutorial-banner{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(135deg, rgba(14,165,233,.12), rgba(56,189,248,.06));
  border:1.5px solid rgba(14,165,233,.3);border-radius:12px;
  padding:5px 10px;margin:2px 10px 4px;
  box-shadow:0 2px 10px rgba(14,165,233,.1);
  animation:fade-in .3s ease-out;
  flex:0 0 auto;
}
html.dark .tutorial-banner{
  background:linear-gradient(135deg, rgba(14,165,233,.18), rgba(2,132,199,.1));
  border-color:rgba(56,189,248,.35);
  box-shadow:0 0 14px rgba(56,189,248,.12);
}
.tut-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--brand);color:#ffffff;
  font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;white-space:nowrap;flex:0 0 auto;
}
.tut-msg{
  font-size:clamp(10.5px, 1.5vh, 12px);color:var(--heading);
  line-height:1.3;flex:1;min-width:0;
}
.tut-msg b{color:var(--brand)}
.tut-close{
  background:transparent;border:none;color:var(--muted);
  cursor:pointer;padding:2px 5px;font-size:13px;display:flex;align-items:center;
  border-radius:6px;transition:all .15s ease;
}
.tut-close:hover{color:var(--heading);background:rgba(0,0,0,.08)}
html.dark .tut-close:hover{background:rgba(255,255,255,.1)}

/* Pulsing highlight for tutorial recommended cells */
.cell.tut-guide::after{
  content:"";position:absolute;inset:0;
  border:2px dashed #0ea5e9;background:rgba(14,165,233,.18);
  border-radius:1px;pointer-events:none;z-index:3;
  animation:tut-pulse 1.2s ease-in-out infinite alternate;
}
html.dark .cell.tut-guide::after{
  border-color:#38bdf8;background:rgba(56,189,248,.22);
}
@keyframes tut-pulse{
  0%{opacity:.35;transform:scale(.94)}
  100%{opacity:1;transform:scale(1.02)}
}

.toolbar-outer{display:flex;justify-content:center;padding:clamp(2px, 0.8vh, 6px) 10px clamp(4px, 1.4vh, 14px);flex:0 0 auto}
.toolbar{display:flex;align-items:center;gap:clamp(3px, 0.8vw, 6px);max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:clamp(10px, 1.8vh, 16px);border:2px solid var(--border);background:var(--card);padding:clamp(3px, 0.6vh, 6px) clamp(6px, 1vw, 10px);box-shadow:0 8px 24px var(--shadow)}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{position:relative;flex:0 0 auto;width:clamp(32px, min(5.4vh, 5.4vw), 42px);height:clamp(32px, min(5.4vh, 5.4vw), 42px);border-radius:clamp(7px, 1.2vh, 11px);display:flex;align-items:center;justify-content:center;font-size:clamp(16px, min(2.7vh, 2.7vw), 22px);color:var(--muted)}
.tbtn:hover{background:var(--card-2)}
html.dark .tbtn:hover{background:rgba(255,255,255,.06)}
.tbtn.active{background:var(--brand);color:#fff;box-shadow:0 3px 8px rgba(45,134,199,.4)}
.tbtn:disabled{opacity:.3;pointer-events:none}
.tbtn.shake{animation:shake-cell .3s ease-in-out}
.tbtn .n{position:absolute;right:-3px;top:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--brand);color:#fff;font-family:"Roboto Mono",monospace;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tdiv{width:1px;height:clamp(16px, 2.6vh, 24px);background:var(--border);margin:0 clamp(1px, 0.4vw, 3px);flex:0 0 auto}

@media(max-height: 520px){
  .g-head{padding:2px 8px 0}
  .chip{padding:2px 7px;font-size:11px}
  .icon-btn{width:32px;height:32px;font-size:18px}
  .back-link{padding:4px 8px;font-size:12px}
  .back-link .ic{font-size:20px}
  .board-wrap{padding:2px 6px}
  .toolbar-outer{padding:2px 8px 4px}
  .toolbar{padding:2px 5px}
  .tbtn{width:30px;height:30px;font-size:15px;border-radius:7px}
  .tdiv{height:16px;margin:0 1px}
}

/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:clamp(8px, 2.5vh, 16px);background:rgba(30,41,59,.45);backdrop-filter:blur(2px);animation:fade-in .25s ease-out;box-sizing:border-box}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:440px;border-radius:24px;border:2px solid var(--border);background:var(--card);padding:clamp(16px, 3vh, 24px);box-shadow:0 30px 60px rgba(0,0,0,.3);animation:modal-pop .3s cubic-bezier(.34,1.56,.64,1);max-height:min(92vh, 92dvh);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;box-sizing:border-box}
@keyframes modal-pop{0%{transform:scale(.85) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.modal h2{margin:0 0 16px;text-align:center;font-size:clamp(18px, 3vh, 24px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--heading)}
.help-modal{max-width:500px;padding:clamp(14px, 2.5vh, 24px) clamp(12px, 3vw, 22px);position:relative}
.help-header{text-align:center;margin-bottom:clamp(8px, 1.8vh, 14px);position:relative}
.help-close-btn{
  position:absolute;top:-4px;right:-4px;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  border:1.5px solid var(--border);background:var(--card);cursor:pointer;
  transition:all .15s ease;
}
.help-close-btn:hover{color:var(--heading);border-color:var(--brand);background:var(--card-2)}
.help-header .hh-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--brand-tint);color:var(--brand);
  border-radius:99px;padding:3px 12px;font-size:clamp(10px, 1.4vh, 11px);
  font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:clamp(3px, 0.8vh, 6px);
}
.help-header h2{margin:0;font-size:clamp(18px, 2.8vh, 24px);font-weight:900;letter-spacing:.08em;color:var(--heading)}
.help-card{
  background:var(--card-2);border:1.5px solid var(--border);border-radius:clamp(10px, 1.8vh, 14px);
  padding:clamp(8px, 1.5vh, 12px) clamp(10px, 2vw, 14px);margin-bottom:clamp(6px, 1.2vh, 10px);display:flex;gap:clamp(8px, 1.6vw, 12px);align-items:flex-start;
  transition:border-color .15s ease, transform .12s ease;box-sizing:border-box;
}
.help-card:hover{border-color:var(--brand)}
.help-card-ic{
  flex:0 0 auto;width:clamp(28px, 4.2vh, 34px);height:clamp(28px, 4.2vh, 34px);border-radius:clamp(7px, 1.2vh, 10px);
  background:var(--card);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(13px, 2vh, 16px);color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.06);font-weight:900;
}
.help-card-body{flex:1;min-width:0}
.help-card-title{font-size:clamp(12.5px, 1.8vh, 13.5px);font-weight:800;color:var(--heading);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between}
.help-card-desc{font-size:clamp(11px, 1.5vh, 12px);color:var(--text);line-height:1.42;margin:0}
.help-demo-wrap{
  background:var(--card);border:1.5px solid var(--border);border-radius:clamp(8px, 1.4vh, 12px);
  padding:clamp(6px, 1.2vh, 10px) clamp(8px, 1.6vw, 12px);margin:clamp(4px, 1vh, 8px) 0 clamp(2px, 0.6vh, 4px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(4px, 0.8vh, 6px);box-sizing:border-box;
}
.help-demo-row{display:flex;align-items:center;gap:clamp(3px, 0.8vw, 5px);max-width:100%;flex-wrap:nowrap}
.help-demo-clue{
  font-family:"Roboto Mono",monospace;font-size:clamp(11px, 1.7vh, 13px);font-weight:800;color:var(--brand);
  background:var(--brand-tint);padding:clamp(2px, 0.5vh, 3px) clamp(5px, 1vw, 8px);border-radius:6px;margin-right:clamp(3px, 0.8vw, 6px);
  transition:all .2s ease;white-space:nowrap;
}
.help-demo-clue.solved{
  background:rgba(18,168,128,.16);color:#12a880;
}
.help-demo-cell{
  width:clamp(22px, min(3.6vh, 6.5vw), 27px);height:clamp(22px, min(3.6vh, 6.5vw), 27px);border-radius:clamp(4px, 0.8vh, 5px);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;background:var(--cell);position:relative;
  cursor:pointer;user-select:none;transition:transform .12s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease;
  flex:0 0 auto;
}
.help-demo-cell:hover{transform:scale(1.08);border-color:var(--brand)}
.help-demo-cell:active{transform:scale(.92)}
.help-demo-cell.fill{background:var(--fill);border-color:var(--fill)}
.help-demo-cell .ic{font-size:clamp(11px, 1.8vh, 13px);color:var(--xmark);stroke-width:2.4}
.help-demo-feedback{
  font-size:clamp(10px, 1.4vh, 11px);font-weight:700;color:var(--muted);font-family:"Roboto Mono",monospace;
  transition:color .2s ease;text-align:center;line-height:1.3;
}
.help-demo-feedback.success{color:#12a880}
.help-tools-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:clamp(5px, 1vh, 8px);margin-top:clamp(5px, 1vh, 8px);
}
.help-tool-pill{
  background:var(--card);border:1.5px solid var(--border);border-radius:clamp(8px, 1.2vh, 10px);
  padding:clamp(5px, 1vh, 8px) clamp(6px, 1.2vw, 10px);display:flex;align-items:center;gap:clamp(5px, 1vw, 8px);
}
.help-tool-pill .ic{font-size:clamp(13px, 2vh, 16px);color:var(--brand);flex:0 0 auto}
.help-tool-pill b{font-size:clamp(11px, 1.6vh, 12px);color:var(--heading);display:block}
.help-tool-pill small{font-size:clamp(9.5px, 1.4vh, 10.5px);color:var(--muted);display:block}
.help-keys{
  display:flex;flex-wrap:wrap;gap:clamp(4px, 0.8vh, 6px);justify-content:center;
  background:var(--card-2);border-radius:clamp(8px, 1.4vh, 12px);padding:clamp(6px, 1vh, 8px) clamp(6px, 1.2vw, 10px);margin-top:clamp(6px, 1.2vh, 10px);
}
.help-key{
  display:inline-flex;align-items:center;gap:3px;font-size:clamp(9.5px, 1.4vh, 11px);color:var(--muted);
  font-family:"Roboto Mono",monospace;font-weight:600;white-space:nowrap;
}
.help-key kbd{
  background:var(--card);border:1px solid var(--border);border-radius:4px;
  padding:1px clamp(3px, 0.6vw, 5px);font-weight:800;color:var(--heading);box-shadow:0 1px 2px rgba(0,0,0,.1);
}

@media(max-height: 620px){
  .overlay{padding:6px}
  .modal{max-height:min(96vh, 96dvh);padding:12px 14px;border-radius:16px}
  .help-modal{padding:12px 14px}
  .help-close-btn{width:26px;height:26px;top:-2px;right:-2px;font-size:12px}
  .modal h2{margin-bottom:8px}
  .help-card{padding:7px 9px;margin-bottom:5px;gap:8px}
  .help-demo-wrap{padding:5px 8px;margin:3px 0}
  .help-tools-grid{margin-top:4px}
  .help-keys{margin-top:6px;padding:5px 7px}
  #helpOk{margin-top:8px!important;padding:8px!important}
}

@media(max-width: 360px){
  .help-tools-grid{grid-template-columns:1fr}
  .help-card{padding:9px;gap:8px}
  .help-demo-wrap{padding:6px 6px}
}
.set-row{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.set-row b{display:block;color:var(--heading)}
.switch{
  position:relative;width:48px;height:28px;border-radius:99px;
  background:#cbd5e1;border:2px solid #94a3b8;flex:0 0 auto;
  transition:all .2s ease;
}
.switch i{
  position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);
  transition:all .2s ease;
}
.switch.on{
  background:#0ea5e9;border-color:#0284c7;
  box-shadow:0 2px 10px rgba(14,165,233,.35);
}
.switch.on i{
  left:22px;background:#fff;
}

html.dark .switch{
  background:#1e293b;border-color:#334155;
}
html.dark .switch i{
  background:#64748b;
}
html.dark .switch.on{
  background:#0284c7;border-color:#38bdf8;
  box-shadow:0 0 12px rgba(56,189,248,.45);
}
html.dark .switch.on i{
  background:#ffffff;box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.btn-danger{width:100%;border-radius:12px;padding:10px;border:2px solid rgba(239,68,68,.35);color:#ef4444;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-top:8px}
.btn-danger:hover{background:rgba(239,68,68,.08)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.square-btn{
  width:48px;height:48px;flex:0 0 auto;border-radius:12px;
  border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--muted);
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.square-btn:hover{
  background:rgba(45,134,199,.12);
  color:var(--brand-2);
  border-color:var(--brand);
}
html.dark .square-btn:hover{
  background:rgba(78,163,214,.18);
  color:var(--brand);
  border-color:var(--brand);
}
.confirm-text{text-align:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.btn-red{flex:1;border-radius:12px;padding:10px;background:#ef4444;color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 3px 0 #b91c1c}

/* ============ RESPONSIVE CONFIRMATION MODALS ============ */
.confirm-modal{
  max-width:min(400px, 92vw);text-align:center;
  padding:clamp(14px, 2.5vh, 22px) clamp(12px, 3vw, 20px);box-sizing:border-box;
}
.confirm-icon-wrap{
  width:clamp(40px, 5.5vh, 50px);height:clamp(40px, 5.5vh, 50px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto clamp(8px, 1.4vh, 12px);font-size:clamp(18px, 2.5vh, 24px);
  flex:0 0 auto;
}
.confirm-icon-wrap .ic{
  font-size:clamp(18px, 2.5vh, 24px);stroke-width:2.2;
}
.confirm-icon-wrap.danger{
  background:rgba(239,68,68,.12);border:2px solid rgba(239,68,68,.3);color:#ef4444;
}
.confirm-icon-wrap.warn{
  background:rgba(245,158,11,.12);border:2px solid rgba(245,158,11,.3);color:#f59e0b;
}
.confirm-icon-wrap.info{
  background:rgba(14,165,233,.12);border:2px solid rgba(14,165,233,.3);color:#0ea5e9;
}
.confirm-title{
  margin:0 0 clamp(6px, 1vh, 8px)!important;font-size:clamp(17px, 2.4vh, 21px)!important;
  font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--heading);
}
.confirm-desc{
  margin:0 0 clamp(10px, 1.6vh, 14px);font-size:clamp(12px, 1.6vh, 13.5px);
  color:var(--muted);line-height:1.45;
}
.confirm-card{
  background:var(--card-2);border:1.5px solid var(--border);border-radius:12px;
  padding:clamp(8px, 1.3vh, 12px) clamp(10px, 1.8vw, 14px);text-align:left;
  font-size:clamp(11.5px, 1.5vh, 12.5px);color:var(--muted);line-height:1.6;
  margin-bottom:clamp(10px, 1.6vh, 14px);
}
.confirm-card .row{
  display:flex;align-items:center;gap:8px;
}
.confirm-card .row:not(:last-child){
  margin-bottom:4px;
}
.confirm-warning{
  font-size:clamp(10px, 1.3vh, 11px);color:#ef4444;font-weight:700;
  margin:0 0 clamp(12px, 1.8vh, 16px);text-transform:uppercase;letter-spacing:.05em;line-height:1.3;
}
.confirm-actions{
  display:flex;gap:clamp(6px, 1.5vw, 10px);margin-top:0;width:100%;
}
.confirm-actions button{
  flex:1;padding:clamp(8px, 1.4vh, 11px) clamp(10px, 1.5vw, 14px);
  font-size:clamp(12px, 1.6vh, 13.5px);font-weight:800;
}
@media(max-width:320px){
  .confirm-actions{flex-direction:column;gap:6px}
}
@media(max-height:620px){
  .confirm-modal{padding:10px 12px}
  .confirm-icon-wrap{width:32px;height:32px;font-size:16px;margin-bottom:4px}
  .confirm-icon-wrap .ic{font-size:16px}
  .confirm-title{font-size:15px!important;margin-bottom:3px!important}
  .confirm-desc{font-size:11px;margin-bottom:6px}
  .confirm-card{padding:5px 8px;margin-bottom:6px;font-size:11px}
  .confirm-card .row:not(:last-child){margin-bottom:2px}
  .confirm-warning{font-size:9.5px;margin-bottom:8px}
}

/* gameover modal */
.gameover-modal{max-width:380px;text-align:center}
.gameover-icon{
  width:64px;height:64px;margin:0 auto 12px;border-radius:50%;
  background:rgba(239,68,68,.12);color:#ef4444;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  border:2px solid rgba(239,68,68,.25);
  animation:gameover-icon-pulse 1.8s ease-in-out infinite alternate;
}
html.dark .gameover-icon{
  background:rgba(248,113,113,.15);color:#f87171;border-color:rgba(248,113,113,.3);
}
@keyframes gameover-icon-pulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.3)}
  100%{transform:scale(1.06);box-shadow:0 0 16px 4px rgba(239,68,68,.2)}
}
.gameover-title{
  color:#ef4444;font-size:clamp(20px, 3.2vh, 25px);font-weight:800;margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase;
}
html.dark .gameover-title{
  color:#f87171;
}
.gameover-desc{
  font-size:clamp(12.5px, 1.8vh, 14.5px);color:var(--text);margin:0 0 14px;line-height:1.45;
}
.gameover-tip{
  background:var(--card-2);border:1.5px solid var(--border);border-radius:14px;
  padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.4;text-align:left;
}
.gameover-tip b{color:var(--heading)}

/* win */
.win-modal{max-width:380px;text-align:center}
.win-art{
  width:min(180px,48vw);aspect-ratio:1/1;margin:10px auto 0;
  border-radius:18px;border:2px solid var(--border);background:var(--card);
  padding:10px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 25px rgba(45,90,130,.12);
  animation:win-bounce .5s cubic-bezier(.34,1.56,.64,1) both;
}
.win-art .thumb{width:100%;height:100%;border-radius:4px;overflow:hidden}
@keyframes win-bounce{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.stars{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.star-ic{font-size:36px;color:var(--track)}
.star-ic.on{color:#f5b840;filter:drop-shadow(0 2px 4px rgba(245,184,64,.5));animation:star-pop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes star-pop{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.win-streak{display:inline-flex;align-items:center;gap:6px;background:#ffe9d6;color:#e8801c;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px;margin-top:8px}
.win-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px, 1.5vw, 10px);
  margin-top:clamp(10px, 1.8vh, 16px);width:100%;box-sizing:border-box;
}
.win-stat{
  background:var(--card-2);border:1.5px solid var(--border);border-radius:clamp(10px, 1.6vh, 14px);
  padding:clamp(8px, 1.5vh, 12px) 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-sizing:border-box;
  transition:border-color .15s ease, transform .12s ease;
}
.win-stat:hover{
  border-color:var(--brand);
}
.win-stat .ic{
  display:block;margin:0 auto clamp(3px, 0.6vh, 6px);font-size:clamp(16px, 2.2vh, 20px);
  color:var(--muted);flex:0 0 auto;
}
.win-stat.heart-stat .ic{
  color:#e11d48 !important;
  fill:#e11d48 !important;
}
html.dark .win-stat.heart-stat .ic{
  color:#fb7185 !important;
  fill:#fb7185 !important;
}
.win-stat p{
  margin:0;font-family:"Roboto Mono",monospace;font-weight:800;
  font-size:clamp(12px, 1.7vh, 14px);color:var(--heading);
  text-align:center;width:100%;line-height:1.2;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function newGrid(n) { return { n, c: new Uint8Array(n * n) }; }
function painter(g) {
  const n = g.n, last = n - 1;
  const X = t => clamp(Math.round(t * last), 0, last);
  const px = i => i / last;
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < n && y < n) g.c[y * n + x] = v; };
  const P = {
    n, g, set,
    rect(x0, y0, x1, y1, v) {
      const a = X(Math.min(x0, x1)), b = X(Math.max(x0, x1));
      const c = X(Math.min(y0, y1)), d = X(Math.max(y0, y1));
      for (let y = c; y <= d; y++) for (let x = a; x <= b; x++) set(x, y, v === undefined ? 1 : v);
    },
    disc(cx, cy, r, v) {
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const dx = px(x) - cx, dy = px(y) - cy;
        if (dx * dx + dy * dy <= r * r) set(x, y, v === undefined ? 1 : v);
      }
    },
    ellipse(cx, cy, rx, ry, v) {
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const dx = (px(x) - cx) / rx, dy = (px(y) - cy) / ry;
        if (dx * dx + dy * dy <= 1) set(x, y, v === undefined ? 1 : v);
      }
    },
    ring(cx, cy, r, th, v) { P.arc(cx, cy, r, 0, Math.PI * 2, th, v); },
    arc(cx, cy, r, a0, a1, th, v) {
      const t = (th || 1) / last / 2;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const dx = px(x) - cx, dy = px(y) - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > r + t || d < r - t) continue;
        let a = Math.atan2(dy, dx);
        while (a < a0) a += Math.PI * 2;
        if (a <= a1 + 1e-9) set(x, y, v === undefined ? 1 : v);
      }
    },
    line(x0, y0, x1, y1, th, v) {
      const ax = X(x0), ay = X(y0), bx = X(x1), by = X(y1);
      const t = Math.max(1, th || 1);
      const minx = Math.min(ax, bx) - t, maxx = Math.max(ax, bx) + t;
      const miny = Math.min(ay, by) - t, maxy = Math.max(ay, by) + t;
      const vx = bx - ax, vy = by - ay;
      const len2 = vx * vx + vy * vy || 1;
      for (let y = Math.max(0, miny); y <= Math.min(last, maxy); y++) {
        for (let x = Math.max(0, minx); x <= Math.min(last, maxx); x++) {
          let tp = ((x - ax) * vx + (y - ay) * vy) / len2;
          tp = clamp(tp, 0, 1);
          const cxp = ax + vx * tp, cyp = ay + vy * tp;

      const miny = Math.max(0, Math.min.apply(null, ys) - 1), maxy = Math.min(last, Math.max.apply(null, ys) + 1);
      for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {

        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {

        }
        if (inside) set(x, y, v === undefined ? 1 : v);
      }
    },
    fn(test, v) {
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        if (test(px(x), px(y))) set(x, y, v === undefined ? 1 : v);
      }
    },
    clear() { g.c.fill(0); }
  };
  return P;
}

function stampSym(P, x, y, r, fold) {
  const pts = [[x, y], [1 - x, y], [x, 1 - y], [1 - x, 1 - y]];
  if (fold >= 8) pts.push([y, x], [1 - y, x], [y, 1 - x], [1 - y, 1 - x]);
  const seen = new Set();
  pts.forEach(p => {
    const k = p[0].toFixed(3) + ',' + p[1].toFixed(3);
    if (seen.has(k)) return; seen.add(k);
    P.disc(p[0], p[1], r);
  });
}

  { label: "Mandala", n: 30, blocks: 3, sub: 10 },
  { label: "Snowflake", n: 30, blocks: 3, sub: 10 },
  { label: "Sunburst", n: 45, blocks: 3, sub: 15 },
  { label: "Garden", n: 45, blocks: 3, sub: 15 },
  { label: "Butterfly", n: 45, blocks: 3, sub: 15 }
];

function generateBigArt(idx, n) {
  const g = new Uint8Array(n * n);
  const cx = (n - 1) / 2, cy = (n - 1) / 2;
  const setP = (x, y, v) => {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && x < n && y >= 0 && y < n) g[y * n + x] = (v !== undefined ? v : 1);
  };
  const sym8 = (x, y, v) => {
    setP(cx + x, cy + y, v); setP(cx - x, cy + y, v);
    setP(cx + x, cy - y, v); setP(cx - x, cy - y, v);
    setP(cx + y, cy + x, v); setP(cx - y, cy + x, v);
    setP(cx + y, cy - x, v); setP(cx - y, cy - x, v);
  };
  const sym4 = (x, y, v) => {
    setP(cx + x, cy + y, v); setP(cx - x, cy + y, v);
    setP(cx + x, cy - y, v); setP(cx - x, cy - y, v);
  };
  const symH = (x, y, v) => {
    setP(cx + x, y, v); setP(cx - x, y, v);
  };

  if (idx === 0) {
    // Kaleidoscope (30x30)
    for (let r = 2; r < 14; r += 3) {
      for (let a = 0; a < Math.PI * 2; a += 0.04) {
        if (Math.sin(a * 8) > 0.1) sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
      }
    }
    for (let d = 0; d < 14; d++) {
      sym8(d, d, 1);
      sym8(d, 0, 1);
      if (d > 4) sym8(d, d - 3, 1);
    }
    for (let x = 0; x < 14; x++) {
      for (let y = 0; y < 14; y++) {
        if ((x + y) % 4 === 0 && Math.hypot(x, y) < 13 && Math.hypot(x, y) > 5) sym4(x, y, 1);
      }
    }
    for (let x = 0; x < n; x++) { setP(x, 0, 1); setP(x, n - 1, 1); setP(0, x, 1); setP(n - 1, x, 1); }
  } else if (idx === 1) {
    // Mandala (30x30)
    for (let r = 1; r <= 13; r++) {
      const petals = r % 2 === 0 ? 8 : 12;
      for (let a = 0; a < Math.PI * 2; a += 0.03) {
        if (Math.cos(a * petals) > 0.28) sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
      }
    }
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      for (let d = 2; d < 14; d++) sym4(Math.cos(a) * d, Math.sin(a) * d, 1);
    }
    for (let d = 8; d < 14; d++) {
      sym4(d, 13 - d, 1);
      sym4(d - 1, 13 - d, 1);
    }
  } else if (idx === 2) {
    // Snowflake (30x30)
    for (let d = 0; d < 14; d++) {
      sym8(d, 0, 1);
      sym8(d, d, 1);
      if (d >= 4 && d <= 12 && d % 3 === 0) {
        for (let b = 1; b <= 3; b++) { sym8(d - b, b, 1); sym8(d + b, b, 1); }
      }
      if (d >= 6 && d <= 12 && d % 2 === 0) {
        for (let b = 1; b <= 2; b++) { sym8(d, d - b, 1); sym8(d - b, d, 1); }
      }
    }
    for (let a = 0; a < Math.PI * 2; a += 0.05) {
      const r = 12 + Math.sin(a * 8) * 1.5;
      sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
    }
  } else if (idx === 3) {
    // Sunburst (45x45)
    for (let r = 0; r < 7; r++) {
      for (let a = 0; a < Math.PI * 2; a += 0.05) sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
    }
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 16) {
      for (let d = 8; d < 20; d++) {
        const wave = Math.sin(d * 0.8) * 1.2;
        sym4(Math.cos(a) * d + Math.sin(a) * wave, Math.sin(a) * d - Math.cos(a) * wave, 1);
      }
    }
    for (let a = Math.PI / 32; a < Math.PI * 2; a += Math.PI / 16) {
      for (let d = 9; d < 16; d++) sym4(Math.cos(a) * d, Math.sin(a) * d, 1);
    }
    for (let x = 2; x < n - 2; x++) {
      if (x % 2 === 0) { setP(x, 2, 1); setP(x, n - 3, 1); setP(2, x, 1); setP(n - 3, x, 1); }
    }
  } else if (idx === 4) {
    // Garden (45x45)
    for (let a = 0; a < Math.PI * 2; a += 0.02) {
      const r = 9 + Math.sin(a * 6) * 5;
      for (let d = 0; d < r; d++) {
        if (d > 3 && d < r - 1 && (Math.round(d) % 2 === 0)) continue;
        sym4(Math.cos(a) * d, Math.sin(a) * d, 1);
      }
    }
    for (let corner = 0; corner < 4; corner++) {
      const cx2 = corner % 2 === 0 ? 8 : n - 9;
      const cy2 = corner < 2 ? 8 : n - 9;
      for (let a = 0; a < Math.PI * 2; a += 0.04) {
        const r = 4 + Math.sin(a * 4) * 2.5;
        for (let d = 1; d < r; d++) setP(cx2 + Math.cos(a) * d, cy2 + Math.sin(a) * d, 1);
      }
    }
    for (let x = 4; x < n - 4; x++) {
      if (x % 3 !== 0) { setP(x, 1, 1); setP(x, n - 2, 1); setP(1, x, 1); setP(n - 2, x, 1); }
    }
  } else {
    // Butterfly (45x45)
    for (let y = 8; y <= 36; y++) {
      setP(cx, y, 1);
      if (y > 14 && y < 30) { setP(cx - 1, y, 1); setP(cx + 1, y, 1); }
    }
    setP(cx - 2, 7, 1); setP(cx - 4, 6, 1); setP(cx - 5, 4, 1);
    setP(cx + 2, 7, 1); setP(cx + 4, 6, 1); setP(cx + 5, 4, 1);
    for (let t = 0; t < Math.PI; t += 0.02) {
      const r1 = 16 * Math.sin(t);
      const wx1 = Math.cos(t) * r1 * 1.1;
      const wy1 = 18 - Math.sin(t) * r1 * 0.8;
      symH(wx1, wy1, 1);
      if (t > 0.4 && t < 2.7) {
        const innerR = r1 * 0.65;
        symH(Math.cos(t) * innerR * 1.1, 18 - Math.sin(t) * innerR * 0.8, 1);
      }
      const r2 = 13 * Math.sin(t);
      const wx2 = Math.cos(t) * r2 * 0.9;
      const wy2 = 28 + Math.sin(t) * r2 * 0.7;
      symH(wx2, wy2, 1);
      if (t > 0.5 && t < 2.6) {
        const innerR2 = r2 * 0.6;
        symH(Math.cos(t) * innerR2 * 0.9, 28 + Math.sin(t) * innerR2 * 0.7, 1);
      }
    }
    for (let x = 3; x < 14; x++) {
      symH(x, 16 + (x % 3), 1);
      symH(x, 26 + (x % 3), 1);
    }
  }
  return g;
}

const BIG_CACHE = new Map();
function getBig(idx) {
  if (BIG_CACHE.has(idx)) return BIG_CACHE.get(idx);
  const spec = BIG_SPECS[idx], n = spec.n, sub = spec.sub, b = spec.blocks;
  const g = generateBigArt(idx, n);
  const blocks = [];
  for (let by = 0; by < b; by++) {
    for (let bx = 0; bx < b; bx++) {
      const sg = new Uint8Array(sub * sub);
      for (let y = 0; y < sub; y++) {
        for (let x = 0; x < sub; x++) {
          sg[y * sub + x] = g[(by * sub + y) * n + (bx * sub + x)];
        }
      }
      const clues = computeClues(sg, sub);
      blocks.push({ grid: sg, clues });
    }
  }
  const res = { grid: g, blocks, name: spec.label };
  BIG_CACHE.set(idx, res);
  return res;
}

/* ---------------- Storage Controller (Human-Readable Level Names) ---------------- */
const Storage = {
  KEY: "ns_data",
  defaults: {
    settings: { dark: false, sound: true, autoCross: true, highlight: true },
    daily: { date: "", streak: 0, bestStreak: 0 },
    completed: {
      classic: { "5x5": 0, "10x10": 0, "15x15": 0 },
      expert: { "5x5": 0, "10x10": 0, "15x15": 0 },
      mosaic: {
        classic: {},
        expert: {}
      },
      daily: []
    }
  },

  getAll() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const data = {
          settings: Object.assign({}, this.defaults.settings, parsed.settings),
          daily: Object.assign({}, this.defaults.daily, parsed.daily),
          completed: this.migrateCompleted(parsed)
        };
        // If data was in old array format or has legacy keys, persist clean integer structure
        this.saveAll(data);
        return data;
      }
    } catch (e) {}

    const legacyRaw = this.readLegacy("nonogram_data", null) || this.readLegacy("ns-data-v1", null);
    if (legacyRaw) {
      const data = {
        settings: Object.assign({}, this.defaults.settings, legacyRaw.settings),
        daily: Object.assign({}, this.defaults.daily, legacyRaw.daily),
        completed: this.migrateCompleted(legacyRaw)
      };
      this.saveAll(data);
      return data;
    }

    const initData = {
      settings: Object.assign({}, this.defaults.settings),
      daily: Object.assign({}, this.defaults.daily),
      completed: {
        classic: { "5x5": 0, "10x10": 0, "15x15": 0 },
        expert: { "5x5": 0, "10x10": 0, "15x15": 0 },
        mosaic: { classic: {}, expert: {} },
        daily: []
      }
    };
    this.saveAll(initData);
    return initData;
  },

  migrateCompleted(rawObj) {
    const comp = {
      classic: { "5x5": 0, "10x10": 0, "15x15": 0 },
      expert: { "5x5": 0, "10x10": 0, "15x15": 0 },
      mosaic: { classic: {}, expert: {} },
      daily: []
    };

    const toLastNum = (val) => {
      if (typeof val === "number" && isFinite(val)) return Math.max(0, Math.floor(val));
      if (Array.isArray(val)) {
        if (val.length === 0) return 0;
        const nums = val.map(v => {
          if (typeof v === "number" && isFinite(v)) return v;
          if (typeof v === "string") {
            const m = v.match(/\d+/);
            return m ? Number(m[0]) : 0;
          }
          return 0;
        }).filter(v => isFinite(v) && v > 0);
        return nums.length ? Math.max(...nums) : 0;
      }
      if (typeof val === "string") {
        const m = val.match(/\d+/);
        return m ? Number(m[0]) : 0;
      }
      return 0;
    };

    if (rawObj && rawObj.completed) {
      if (rawObj.completed.classic) {
        comp.classic["5x5"] = toLastNum(rawObj.completed.classic["5x5"]);
        comp.classic["10x10"] = toLastNum(rawObj.completed.classic["10x10"]);
        comp.classic["15x15"] = toLastNum(rawObj.completed.classic["15x15"]);
      }
      if (rawObj.completed.expert) {
        comp.expert["5x5"] = toLastNum(rawObj.completed.expert["5x5"]);
        comp.expert["10x10"] = toLastNum(rawObj.completed.expert["10x10"]);
        comp.expert["15x15"] = toLastNum(rawObj.completed.expert["15x15"]);
      }
      if (rawObj.completed.mosaic) {
        ["classic", "expert"].forEach(m => {
          if (rawObj.completed.mosaic[m]) {
            Object.keys(rawObj.completed.mosaic[m]).forEach(label => {
              comp.mosaic[m][label] = toLastNum(rawObj.completed.mosaic[m][label]);
            });
          }
        });
      }
      if (Array.isArray(rawObj.completed.daily)) {
        comp.daily = Array.from(new Set(rawObj.completed.daily));
      }
    }

    // Migrate old flat solved keys if present
    if (rawObj && rawObj.solved && typeof rawObj.solved === "object") {
      Object.keys(rawObj.solved).forEach(key => {
        if (!rawObj.solved[key]) return;
        if (key.startsWith("classic-") || key.startsWith("expert-")) {
          const parts = key.split("-");
          const mode = parts[0], size = parts[1] + "x" + parts[1], id = Number(parts[2]);
          const num = id + 1;
          if (comp[mode] && typeof comp[mode][size] === "number") {
            comp[mode][size] = Math.max(comp[mode][size], num);
          }
        } else if (key.startsWith("mosaic-")) {
          const parts = key.split("-");
          const subMode = parts[1], bigIdx = Number(parts[2]), blockId = Number(parts[3]);
          const spec = BIG_SPECS[bigIdx];
          const label = spec ? spec.label : ("Mosaic " + (bigIdx + 1));
          const num = blockId + 1;
          if (!comp.mosaic[subMode]) comp.mosaic[subMode] = {};
          comp.mosaic[subMode][label] = Math.max(comp.mosaic[subMode][label] || 0, num);
        } else if (key.startsWith("daily-")) {
          const parts = key.split("-");
          if (parts.length >= 3) {
            const dayNum = Number(parts[2]);
            if (isFinite(dayNum)) {
              const d = new Date(Date.UTC(2024, 0, 1) + dayNum * 86400000);
              const dateStr = todayKey(d);
              if (!comp.daily.includes(dateStr)) comp.daily.push(dateStr);
            }
          }
        }
      });
    }

    return comp;
  },

  readLegacy(k, fallback) {
    try {
      const r = localStorage.getItem(k);
      return r ? Object.assign({}, fallback, JSON.parse(r)) : fallback;
    } catch(e) { return fallback; }
  },

  saveAll(data) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(data));
    } catch (e) {}
  },

  getSettings() { return this.getAll().settings; },
  saveSettings(s) {
    const all = this.getAll();
    all.settings = s;
    this.saveAll(all);
  },

  getCompleted() { return this.getAll().completed; },
  saveCompleted(c) {
    const all = this.getAll();
    all.completed = c;
    this.saveAll(all);
  },

  getDaily() { return this.getAll().daily; },
  saveDaily(d) {
    const all = this.getAll();
    all.daily = d;
    this.saveAll(all);
  },

  // Level queries & mutations (stores last completed number directly)
  isLevelCompleted(mode, size, id) {
    const comp = this.getCompleted();
    const sizeKey = size + "x" + size;
    const num = id + 1;
    const last = comp[mode] && comp[mode][sizeKey];
    if (typeof last === "number") return num <= last;
    if (Array.isArray(last)) return last.includes(num);
    return false;
  },
  isLevelUnlocked(mode, size, id) {
    if (id === 0) return true;
    return this.isLevelCompleted(mode, size, id - 1);
  },
  markLevelCompleted(mode, size, id) {
    const all = this.getAll();
    const sizeKey = size + "x" + size;
    const num = id + 1;
    if (!all.completed[mode]) all.completed[mode] = {};
    const val = all.completed[mode][sizeKey];
    const current = typeof val === "number" ? val : (Array.isArray(val) ? (val.length ? Math.max(...val) : 0) : 0);
    all.completed[mode][sizeKey] = Math.max(current, num);
    this.saveAll(all);
  },

  // Mosaic queries & mutations
  bigDone(subMode, bigIdx) {
    const comp = this.getCompleted();
    const spec = BIG_SPECS[bigIdx];
    const label = spec ? spec.label : ("Mosaic " + (bigIdx + 1));
    const val = comp.mosaic && comp.mosaic[subMode] && comp.mosaic[subMode][label];
    const last = typeof val === "number" ? val : (Array.isArray(val) ? (val.length ? Math.max(...val) : 0) : 0);
    const out = {};
    for (let b = 0; b < 9; b++) {
      if (b + 1 <= last) {
        out[b] = 1;
      }
    }
    return out;
  },
  saveMosaicSection(subMode, bigIdx, blockId) {
    const all = this.getAll();
    const spec = BIG_SPECS[bigIdx];
    const label = spec ? spec.label : ("Mosaic " + (bigIdx + 1));
    const num = blockId + 1;
    if (!all.completed.mosaic) all.completed.mosaic = { classic: {}, expert: {} };
    if (!all.completed.mosaic[subMode]) all.completed.mosaic[subMode] = {};
    const val = all.completed.mosaic[subMode][label];
    const current = typeof val === "number" ? val : (Array.isArray(val) ? (val.length ? Math.max(...val) : 0) : 0);
    all.completed.mosaic[subMode][label] = Math.max(current, num);
    this.saveAll(all);
  },
  removeMosaicSection(subMode, bigIdx, blockId) {
    const all = this.getAll();
    const spec = BIG_SPECS[bigIdx];
    const label = spec ? spec.label : ("Mosaic " + (bigIdx + 1));
    if (all.completed.mosaic && all.completed.mosaic[subMode] && all.completed.mosaic[subMode][label] !== undefined) {
      all.completed.mosaic[subMode][label] = Math.max(0, blockId);
    }
    this.saveAll(all);
  },

  // Daily challenge queries & mutations
  isDailyCompleted(dateKey) {
    const comp = this.getCompleted();
    return Array.isArray(comp.daily) && comp.daily.includes(dateKey);
  },
  markDailyCompleted(dateKey) {
    const all = this.getAll();
    if (!Array.isArray(all.completed.daily)) all.completed.daily = [];
    if (!all.completed.daily.includes(dateKey)) {
      all.completed.daily.push(dateKey);
    }
    this.saveAll(all);
  },

  // Count total solved
  getSolvedCount(mode, size) {
    const comp = this.getCompleted();
    if (!comp[mode]) return 0;
    if (size) {
      const sizeKey = size + "x" + size;
      const val = comp[mode][sizeKey];
      return typeof val === "number" ? val : (Array.isArray(val) ? val.length : 0);
    }
    let sum = 0;
    Object.values(comp[mode]).forEach(v => {
      sum += typeof v === "number" ? v : (Array.isArray(v) ? v.length : 0);
    });
    return sum;
  },

  isPuzzleCompleted(puzzle, customOpts, dateObj) {
    if (!puzzle) return false;
    if (customOpts && customOpts.subMode) {
      const done = this.bigDone(customOpts.subMode, customOpts.bigIdx);
      return !!done[customOpts.blockId];
    }
    if (dateObj) {
      return this.isDailyCompleted(todayKey(dateObj));
    }
    const parts = puzzle.key.split("-");
    if (parts.length >= 3) {
      return this.isLevelCompleted(parts[0], Number(parts[1]), Number(parts[2]));
    }
    return false;
  },

  markPuzzleCompleted(puzzle, customOpts, dateObj) {
    if (!puzzle) return;
    if (customOpts && customOpts.subMode) {
      this.saveMosaicSection(customOpts.subMode, customOpts.bigIdx, customOpts.blockId);
      return;
    }
    if (dateObj) {
      this.markDailyCompleted(todayKey(dateObj));
      return;
    }
    const parts = puzzle.key.split("-");
    if (parts.length >= 3) {
      this.markLevelCompleted(parts[0], Number(parts[1]), Number(parts[2]));
    }
  },

  hasAnyProgress() {
    const comp = this.getCompleted();
    return this.getSolvedCount("classic") > 0 || this.getSolvedCount("expert") > 0 || (comp.daily && comp.daily.length > 0);
  },

  resetAll() {
    localStorage.removeItem(this.KEY);
    this.saveAll(this.defaults);
    seenTutorialLevel1 = false;
    seenHelpSession = false;
  }
};

/* ---------------- Spatial Ambient FM & Pentatonic Audio Engine ---------------- */
const sound = {
  ctx: null,
  master: null,
  reverb: null,
  enabled: true,
  comboIndex: 0,
  lastFillTime: 0,

  // Warm, deeply relaxing C Major Pentatonic scale across 2 octaves
  SCALE: [
    392.00,  // G4
    440.00,  // A4
    523.25,  // C5
    587.33,  // D5
    659.25,  // E5
    783.99,  // G5
    880.00,  // A5
    1046.50, // C6
    1174.66, // D6
    1318.51  // E6
  ],

  ensure() {
    if (!this.enabled) return null;
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();

        // Master dynamics compressor to keep sound punchy, smooth, and warm
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-18, this.ctx.currentTime);
        comp.knee.setValueAtTime(14, this.ctx.currentTime);
        comp.ratio.setValueAtTime(4.5, this.ctx.currentTime);
        comp.attack.setValueAtTime(0.002, this.ctx.currentTime);
        comp.release.setValueAtTime(0.16, this.ctx.currentTime);

        this.master = this.ctx.createGain();
        this.master.gain.setValueAtTime(0.8, this.ctx.currentTime);

        // Ambient Acoustic Spatial Delay / Reverb bus

        delay.delayTime.setValueAtTime(0.18, this.ctx.currentTime);
        const delayFeedback = this.ctx.createGain();

        const delayFilter = this.ctx.createBiquadFilter();
        delayFilter.type = "lowpass";
        delayFilter.frequency.setValueAtTime(1900, this.ctx.currentTime);

        this.reverb = this.ctx.createGain();
        this.reverb.gain.setValueAtTime(0.28, this.ctx.currentTime);

        this.reverb.connect(delayFilter);
        delayFilter.connect(delay);
        delay.connect(delayFeedback);
        delayFeedback.connect(delayFilter);
        delay.connect(comp);

        this.master.connect(comp);
        comp.connect(this.ctx.destination);

  // Organic FM Marimba / Kalimba Pluck with spatial stereo panning
  playMarimba(freq, dur = 0.18, vol = 0.22, when = 0, harmonicRatio = 2.76, modIndex = 1.8, pan = 0, sendReverb = true) {
    const ctx = this.ensure();
    if (!ctx) return;
    const now = ctx.currentTime + when;

    const carrier = ctx.createOscillator();
    const modulator = ctx.createOscillator();
    const modGain = ctx.createGain();
    const gain = ctx.createGain();

    carrier.type = "sine";
    modulator.type = "sine";

    carrier.frequency.setValueAtTime(freq, now);
    modulator.frequency.setValueAtTime(freq * harmonicRatio, now);

    // FM transient attack envelope (physical wooden mallet strike)
    modGain.gain.setValueAtTime(freq * modIndex, now);
    modGain.gain.exponentialRampToValueAtTime(0.01, now + dur * 0.45);

    // Warm exponential decay envelope
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    modulator.connect(modGain);
    modGain.connect(carrier.frequency);
    carrier.connect(gain);

    // Stereo Spatial Panning Node (supported in all modern browsers)
    let outputNode = gain;
    if (typeof ctx.createStereoPanner === "function") {
      const panner = ctx.createStereoPanner();
      panner.pan.setValueAtTime(Math.max(-0.85, Math.min(0.85, pan)), now);
      gain.connect(panner);
      outputNode = panner;
    }

    outputNode.connect(this.master);
    if (sendReverb && this.reverb) {
      outputNode.connect(this.reverb);
    }

    modulator.start(now);
    carrier.start(now);
    modulator.stop(now + dur + 0.06);
    carrier.stop(now + dur + 0.06);
  },

  click() {
    // Tactile wooden bead snap
    const ctx = this.ensure();
    if (!ctx) return;
    this.playMarimba(960, 0.04, 0.14, 0, 3.2, 0.8, 0, false);
  },

  fill(pan = 0) {
    // Mesmerizing Pentatonic Kalimba Melody on consecutive fills!
    const now = performance.now();
    if (now - this.lastFillTime > 950) {
      this.comboIndex = 0;
    } else {
      this.comboIndex = (this.comboIndex + 1) % this.SCALE.length;
    }
    this.lastFillTime = now;

    const note = this.SCALE[this.comboIndex];
    // Main warm marimba note with spatial panning
    this.playMarimba(note, 0.20, 0.26, 0, 2.76, 1.7, pan, true);
    // Subtle crystalline chime sparkle
    this.playMarimba(note * 2, 0.10, 0.09, 0, 1.0, 0.25, pan * 0.7, true);
  },

  cross(pan = 0) {
    // Crisp tactile wooden pencil tick with spatial pan
    const ctx = this.ensure();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(1020, now);
    osc.frequency.exponentialRampToValueAtTime(360, now + 0.032);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.032);

    let output = gain;
    if (typeof ctx.createStereoPanner === "function") {
      const panner = ctx.createStereoPanner();
      panner.pan.setValueAtTime(Math.max(-0.85, Math.min(0.85, pan)), now);
      gain.connect(panner);
      output = panner;
    }
    output.connect(this.master);

    osc.start(now);
    osc.stop(now + 0.04);
  },

  undo(pan = 0) {
    // Soothing gentle waterdrop swoop
    this.playMarimba(440, 0.11, 0.18, 0, 1.5, 0.6, pan, true);
  },

  lineDone() {
    // Celestial 3-bell chord chime blooming into ambient reverb (G5 -> C6 -> E6)
    this.playMarimba(783.99, 0.42, 0.24, 0, 2.0, 0.6, -0.3, true);
    this.playMarimba(1046.50, 0.50, 0.28, 0.05, 2.0, 0.6, 0.0, true);
    this.playMarimba(1318.51, 0.60, 0.24, 0.11, 1.5, 0.4, 0.3, true);
  },

  error(pan = 0) {
    // Warm, friendly wooden double-bonk (clear & zero harshness)
    this.playMarimba(170, 0.14, 0.25, 0, 1.5, 0.8, pan, false);
    this.playMarimba(130, 0.16, 0.28, 0.04, 1.5, 0.8, pan, false);
  },

  hint() {
    // Sparkling ethereal dream harp ripple (C5 -> E5 -> G5 -> C6 -> E6)
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
      const pan = (i / 4) * 0.8 - 0.4;
      this.playMarimba(f, 0.35, 0.20, i * 0.055, 2.0, 0.5, pan, true);
    });
  },

  denied() {
    // Soft double wooden knock
    this.playMarimba(180, 0.045, 0.16, 0, 1.2, 0.5, 0, false);
    this.playMarimba(140, 0.045, 0.14, 0.055, 1.2, 0.5, 0, false);
  },

  gameOver() {
    // Somber, gentle low marimba descent
    this.playMarimba(392.00, 0.35, 0.22, 0, 1.5, 0.7, -0.2, true);
    this.playMarimba(329.63, 0.38, 0.22, 0.16, 1.5, 0.7, 0.0, true);
    this.playMarimba(261.63, 0.60, 0.26, 0.34, 1.8, 0.8, 0.2, true);
  },

  win() {
    // Heartwarming orchestral music box victory melody + ambient major 9th bloom
    const melody = [
      { f: 523.25, t: 0, d: 0.22, p: -0.3 },    // C5
      { f: 659.25, t: 0.11, d: 0.22, p: -0.1 }, // E5
      { f: 783.99, t: 0.22, d: 0.26, p: 0.1 },  // G5
      { f: 1046.50, t: 0.34, d: 0.45, p: 0.3 }, // C6
      { f: 1174.66, t: 0.45, d: 0.40, p: 0.0 }, // D6
      { f: 1318.51, t: 0.56, d: 0.65, p: 0.2 }  // E6
    ];
    melody.forEach(n => {
      this.playMarimba(n.f, n.d, 0.26, n.t, 2.0, 0.5, n.p, true);
      this.playMarimba(n.f * 2, n.d * 0.6, 0.09, n.t + 0.01, 1.0, 0.1, n.p * 0.5, true);
    });
    // Ambient grand chord bloom
    [261.63, 392.00, 523.25, 659.25, 987.77, 1046.50].forEach((f, idx) => {
      const p = (idx % 2 === 0 ? -1 : 1) * 0.25;
      this.playMarimba(f, 1.4, 0.18, 0.58, 1.5, 0.3, p, true);
    });
  }
};
