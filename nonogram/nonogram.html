<script>
(()=>{'use strict';
const U=0,F=1,X=2,KEY='nonogram-single-html-v1',DEF={theme:'light',sound:true,timer:true,auto:true,check:true,highlight:true};let app=document.getElementById('app'),D=load(),R={n:'home'},G=null,tick=null,audio=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');return{done:x.done||{},saves:x.saves||{},daily:x.daily||{last:'',streak:0},big:x.big||{},last:x.last||null,set:{...DEF,...x.set}}}catch{return{done:{},saves:{},daily:{last:'',streak:0},big:{},last:null,set:{...DEF}}}}function save(){localStorage.setItem(KEY,JSON.stringify(D))}document.documentElement.dataset.theme=D.set.theme;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{let d=new Date;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},fmt=n=>String(n/60|0).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rng(s){return()=>{s|=0;s=s+0x6d2b79f5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function size(mode,i){return mode==='expert'?(i<8?10:i<18?15:i<28?20:25):(i<10?5:i<24?10:i<38?15:i<50?20:25)}

function puzzle(mode,i,id){id=id||mode+'-'+(i+1);let w=mode==='big'?5:size(mode,i),seed=hash('nono-'+id),sol=pattern(seed,w),c=clues(sol,w),r=rng(seed+7);return{id,mode,i,w,sol,rows:c.rows,cols:c.cols,hr:c.rows.map(a=>a.map(()=>mode==='expert'&&r()<.12)),hc:c.cols.map(a=>a.map(()=>mode==='expert'&&r()<.12)),title:mode==='daily'?'Daily Challenge':mode==='big'?'Mosaic '+(R.pic+1)+' - Tile '+(R.tile+1):mode[0].toUpperCase()+mode.slice(1)+' #'+(i+1)}}
const count=m=>Object.keys(D.done).filter(k=>k.startsWith(m+'-')).length,bar=(t,s,b)=>'<header class="bar"><button class="ib" data-go="'+b+'" aria-label="Back">&#8249;</button><div class="title"><b>'+esc(t)+'</b><small>'+esc(s)+'</small></div></header>',mode=(go,n,s,b,c,l)=>'<button class="mode" data-go="'+go+'"><span class="mi '+c+'">'+l+'</span><span class="mc"><b>'+n+'</b><small>'+s+'</small></span><span class="badge">'+b+'</span></button>';
function render(){clearInterval(tick);if(R.n==='home')home();if(R.n==='levels')levels();if(R.n==='play')start();if(R.n==='settings')settings();if(R.n==='guide')guide();if(R.n==='big')big();bindNav()}
function home(){let bd=Object.values(D.big).filter(a=>a.filter(Boolean).length===9).length;app.innerHTML='<section class="screen scroll"><div class="hero"><div class="pix">'+Array(25).fill('<i></i>').join('')+'</div><div class="brand"><span class="logo">#</span>Picture logic</div><h1>Nonogram<br><span>Square</span></h1><p>Fill cells using number clues to reveal hidden pixel art. Every puzzle rewards clear, focused logic.</p></div><div class="home">'+(D.last?'<button class="mode" data-go="continue" style="margin-bottom:11px"><span class="mi blue">&#9654;</span><span class="mc"><small>CONTINUE</small><b>'+esc(D.last.label)+'</b></span><span class="badge">Resume</span></button>':'')+'<div class="modes">'+mode('classic','Classic','Puzzles from 5x5 to 25x25',count('classic')+'/60','blue','#')+mode('expert','Expert','Some clues are hidden with question marks',count('expert')+'/40','purple','?')+mode('daily','Daily Challenge',D.done['daily-'+today()]?'Solved today. Return tomorrow.':'A fresh puzzle every day',D.daily.streak?D.daily.streak+' day':today().slice(5),'orange','D')+mode('big','Big Picture','Solve nine tiles per mosaic',bd+'/6','green','B')+'</div><div class="home-actions"><button class="btn alt" data-go="guide">How to play</button><button class="btn alt" data-go="settings">Settings</button></div><p class="fine">Click to fill. Right click to mark. Drag to paint.<br>Z/Y undo and redo. Plus/minus zoom.</p></div></section>'}
function levels(){let max=R.mode==='classic'?60:40,groups={};for(let i=0;i<max;i++){let s=size(R.mode,i);(groups[s]||=[]).push(i)}let h=bar(R.mode==='classic'?'Classic Puzzles':'Expert Puzzles',count(R.mode)+' / '+max+' solved','home')+'<div class="scroll"><div class="section">';for(let [s,a] of Object.entries(groups))h+='<div class="gt">'+s+' x '+s+'</div><div class="levels">'+a.map(i=>'<button class="level '+(D.done[R.mode+'-'+(i+1)]?'done':'')+'" data-level="'+i+'"><span>'+(i+1)+'</span><small>'+s+' x '+s+'</small></button>').join('')+'</div>';app.innerHTML='<section class="screen">'+h+'</div></div></section>';app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{R={n:'play',mode:R.mode,i:+b.dataset.level};render()})}
function start(){let id=R.mode==='daily'?'daily-'+today():R.mode==='big'?'big-'+R.pic+'-'+R.tile:null,p=puzzle(R.mode,R.i||0,id),old=D.saves[p.id];G={p,c:old&&old.c.length===p.w*p.w?Uint8Array.from(old.c.split('').map(Number)):new Uint8Array(p.w*p.w),sec:old?.sec||0,miss:old?.miss||0,hints:old?.hints??3,pen:F,zoom:0,undo:[],redo:[],pause:false,status:'play',hover:null,stroke:null};gameHTML();tick=setInterval(()=>{if(G&&!G.pause&&G.status==='play'){G.sec++;let e=document.getElementById('time');if(e)e.textContent=fmt(G.sec);persist()}},1000)}
function gameHTML(){let p=G.p,back=p.mode==='daily'?'home':p.mode==='big'?'big':'levels';app.innerHTML='<section class="screen game"><header class="bar"><button class="ib" data-go="'+back+'">&#8249;</button><div class="title"><b>'+esc(p.title)+'</b><small>'+p.w+' x '+p.w+(p.mode==='expert'?' - hidden clues':'')+'</small></div><span class="pill life">&#9829; <b id="life">'+(D.set.check?3-G.miss:'--')+'</b></span>'+(D.set.timer?'<span class="pill timer" id="time">'+fmt(G.sec)+'</span>':'')+'<button class="ib" data-g="pause">II</button><button class="ib" data-g="restart">R</button></header><div class="progress"><i id="prog"></i></div><div class="bw"><div class="bp"><div class="board" id="board"></div></div></div><footer class="tools"><div class="pen"><button class="on" data-pen="1">Fill</button><button data-pen="2">Mark X</button></div><div class="actions"><button class="ib" data-g="undo">&#8630;</button><button class="ib" data-g="redo">&#8631;</button><button class="ib hint" data-g="hint">? <small id="hints">'+G.hints+'</small></button><button class="ib" data-g="out">-</button><button class="ib" data-g="in">+</button></div></footer></section>';drawBoard();bindGame();bindNav()}
function metric(){let p=G.p,w=app.querySelector('.bw'),mr=Math.max(...p.rows.map(a=>a.length)),mc=Math.max(...p.cols.map(a=>a.length)),fit=Math.floor(Math.min((w.clientWidth-16)/(p.w+mr*.7),(w.clientHeight-16)/(p.w+mc*.7))),cell=Math.max(10,Math.min(39,Math.round(fit*Math.pow(1.12,G.zoom)))),cl=Math.max(10,Math.round(cell*.72));return{cell,cl,rw:mr*cl+7,ch:mc*cl+7}}

function drawBoard(){let b=document.getElementById('board');if(!b)return;let p=G.p,m=metric();b.style.cssText='--cell:'+m.cell+'px;--clue:'+m.cl+'px;width:'+(m.rw+p.w*m.cell)+'px;height:'+(m.ch+p.w*m.cell)+'px';let h='<div class="corner" style="width:'+m.rw+'px;height:'+m.ch+'px">'+p.w+'x'+p.w+'</div>';for(let x=0;x<p.w;x++){let l=[];for(let y=0;y<p.w;y++)l.push(G.c[y*p.w+x]);h+='<div class="clue c '+(lineDone(l,p.cols[x])?'done':'')+'" style="left:'+(m.rw+x*m.cell)+'px;width:'+m.cell+'px;height:'+m.ch+'px">'+p.cols[x].map((n,i)=>'<span class="'+(p.hc[x][i]?'q':'')+'">'+(p.hc[x][i]?'?':n)+'</span>').join('')+'</div>'}for(let y=0;y<p.w;y++)h+='<div class="clue r '+(lineDone([...G.c.slice(y*p.w,y*p.w+p.w)],p.rows[y])?'done':'')+'" style="top:'+(m.ch+y*m.cell)+'px;width:'+m.rw+'px;height:'+m.cell+'px">'+p.rows[y].map((n,i)=>'<span class="'+(p.hr[y][i]?'q':'')+'">'+(p.hr[y][i]?'?':n)+'</span>').join('')+'</div>';for(let i=0;i<G.c.length;i++){let y=i/p.w|0,x=i%p.w,s=G.c[i],bad=D.set.check&&s===F&&!p.sol[i],hi=D.set.highlight&&G.hover&&(G.hover.x===x||G.hover.y===y);h+='<div data-cell="'+i+'" class="cell '+(s===F?'f ':'')+(bad?'bad ':'')+(hi?'hi ':'')+((x+1)%5===0&&x<p.w-1?'mr ':'')+((y+1)%5===0&&y<p.w-1?'mb':'')+'" style="left:'+(m.rw+x*m.cell)+'px;top:'+(m.ch+y*m.cell)+'px;width:'+m.cell+'px;height:'+m.cell+'px">'+(s===X?'x':'')+'</div>'}h+='<div class="frame" style="left:'+m.rw+'px;top:'+m.ch+'px;width:'+(p.w*m.cell)+'px;height:'+(p.w*m.cell)+'px"></div>';b.innerHTML=h;progress();bindBoard()}
function bindGame(){app.querySelectorAll('[data-pen]').forEach(b=>b.onclick=()=>{G.pen=+b.dataset.pen;app.querySelectorAll('[data-pen]').forEach(x=>x.classList.toggle('on',x===b))});app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>action(b.dataset.g))}
function bindBoard(){let b=document.getElementById('board'),down=false,pts=new Map,pinch=0,pinching=false,changed=false;b.oncontextmenu=e=>e.preventDefault();b.onpointerdown=e=>{if(G.pause||G.status!=='play')return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size>1){if(down&&G.undo.length)G.c=G.undo.pop();down=false;G.stroke=null;pinching=true;let a=[...pts.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);return}let c=e.target.closest('[data-cell]');if(!c)return;e.preventDefault();down=true;let i=+c.dataset.cell,pen=e.button===2?(G.pen===F?X:F):G.pen,paint=G.c[i]===pen?U:pen;G.undo.push(G.c.slice());G.redo=[];G.stroke={paint,last:i};paintCell(i,paint)};b.onpointermove=e=>{if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size>1){let a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(d>pinch*1.14){G.zoom=Math.min(6,G.zoom+1);pinch=d;changed=true}else if(d<pinch*.86){G.zoom=Math.max(-5,G.zoom-1);pinch=d;changed=true}return}let c=e.target.closest('[data-cell]');if(!c)return;let i=+c.dataset.cell;G.hover={x:i%G.p.w,y:i/G.p.w|0};if(down&&G.stroke&&i!==G.stroke.last){paintCell(i,G.stroke.paint);G.stroke.last=i}else if(D.set.highlight)document.querySelectorAll('[data-cell]').forEach(el=>{let n=+el.dataset.cell;el.classList.toggle('hi',n%G.p.w===G.hover.x||(n/G.p.w|0)===G.hover.y)})};b.onpointerup=e=>{pts.delete(e.pointerId);if(pinching){if(pts.size===0){pinching=false;if(changed)drawBoard()}return}if(down){down=false;G.stroke=null;finish()}};b.onpointercancel=b.onpointerup;b.onwheel=e=>{if(e.ctrlKey){e.preventDefault();action(e.deltaY<0?'in':'out')}}}
function paintCell(i,v){if(G.c[i]===v)return;let wrong=D.set.check&&v===F&&!G.p.sol[i]&&G.c[i]!==F;G.c[i]=v;if(wrong){G.miss=Math.min(3,G.miss+1);tone(140)}else tone(v===F?520:240);let el=document.querySelector('[data-cell="'+i+'"]');if(el){el.classList.toggle('f',v===F);el.classList.toggle('bad',wrong);el.textContent=v===X?'x':''}progress();let life=document.getElementById('life');if(life)life.textContent=D.set.check?3-G.miss:'--';if(G.miss>=3){G.status='lost';delete D.saves[G.p.id];save();lost()}}
function finish(){if(G.status!=='play')return;if(D.set.auto)cross();else drawBoard();persist();if(solved())win()}function cross(){let p=G.p;for(let y=0;y<p.w;y++){let need=p.rows[y].reduce((a,b)=>a+b),have=0;for(let x=0;x<p.w;x++)if(G.c[y*p.w+x]===F)have++;if(have===need)for(let x=0;x<p.w;x++)if(G.c[y*p.w+x]===U)G.c[y*p.w+x]=X}for(let x=0;x<p.w;x++){let need=p.cols[x].reduce((a,b)=>a+b),have=0;for(let y=0;y<p.w;y++)if(G.c[y*p.w+x]===F)have++;if(have===need)for(let y=0;y<p.w;y++)if(G.c[y*p.w+x]===U)G.c[y*p.w+x]=X}drawBoard()}
function solved(){return [...G.c].every((v,i)=>(v===F)===!!G.p.sol[i])}function progress(){let all=0,got=0;G.p.sol.forEach((v,i)=>{if(v){all++;if(G.c[i]===F)got++}});let e=document.getElementById('prog');if(e)e.style.width=got/all*100+'%'}function persist(){if(G.status!=='play')return;D.saves[G.p.id]={c:[...G.c].join(''),sec:G.sec,miss:G.miss,hints:G.hints};if(G.c.some(v=>v))D.last={id:G.p.id,label:G.p.title,mode:G.p.mode,i:G.p.i,pic:R.pic,tile:R.tile};save()}
function action(a){if(a==='pause'){G.pause=true;dialog('Puzzle paused','Your progress is saved and the timer is stopped.','Resume',()=>{G.pause=false;close()})}else if(a==='restart')dialog('Restart puzzle?','The grid, timer and used hints will reset.','Restart',()=>{delete D.saves[G.p.id];save();close();start()},true);else if(a==='undo'&&G.undo.length){G.redo.push(G.c.slice());G.c=G.undo.pop();drawBoard();persist()}else if(a==='redo'&&G.redo.length){G.undo.push(G.c.slice());G.c=G.redo.pop();drawBoard();persist()}else if(a==='hint'&&G.hints){let a=[];G.c.forEach((v,i)=>{if(v!==(G.p.sol[i]?F:X))a.push(i)});if(a.length){G.undo.push(G.c.slice());let i=a[Math.random()*a.length|0];G.c[i]=G.p.sol[i]?F:X;G.hints--;document.getElementById('hints').textContent=G.hints;drawBoard();finish()}}else if(a==='in'||a==='out'){G.zoom=Math.max(-5,Math.min(6,G.zoom+(a==='in'?1:-1)));drawBoard()}}
function overlay(h){let o=document.createElement('div');o.id='over';o.className='overlay';o.innerHTML=h;app.appendChild(o)}function close(){document.getElementById('over')?.remove()}function dialog(t,p,b,fn,d){overlay('<div class="dialog"><h2>'+t+'</h2><p>'+p+'</p><div class="da two"><button class="btn alt" id="cancel">Cancel</button><button class="btn '+(d?'danger':'')+'" id="ok">'+b+'</button></div></div>');document.getElementById('cancel').onclick=()=>{if(t!=='Puzzle paused')close()};document.getElementById('ok').onclick=fn}
function win(){clearInterval(tick);G.status='won';let p=G.p;D.done[p.id]=Math.min(D.done[p.id]||Infinity,G.sec);delete D.saves[p.id];if(D.last?.id===p.id)D.last=null;if(p.mode==='daily'&&D.daily.last!==today()){let prev=new Date;prev.setDate(prev.getDate()-1);D.daily.streak=D.daily.last===prev.toISOString().slice(0,10)?D.daily.streak+1:1;D.daily.last=today()}if(p.mode==='big')(D.big[R.pic]||=[])[R.tile]=true;save();let s=Math.max(5,Math.floor(225/p.w)),pic=[...p.sol].map(v=>'<i class="'+(v?'on':'')+'" style="width:'+s+'px;height:'+s+'px"></i>').join('');overlay('<div class="dialog"><div class="bigicon">OK</div><h2>Puzzle solved</h2><p>'+esc(p.title)+'</p><div class="reveal" style="grid-template-columns:repeat('+p.w+','+s+'px)">'+pic+'</div><div class="stats"><div><b>'+fmt(G.sec)+'</b><small>Time</small></div><div><b>'+G.miss+'</b><small>Mistakes</small></div><div><b>'+(3-G.hints)+'</b><small>Hints</small></div></div><div class="da two"><button class="btn alt" id="again">Replay</button><button class="btn" id="next">Continue</button></div></div>');document.getElementById('again').onclick=()=>{close();start()};document.getElementById('next').onclick=()=>{R=p.mode==='daily'?{n:'home'}:p.mode==='big'?{n:'big'}:{n:'levels',mode:p.mode};render()}}
function lost(){overlay('<div class="dialog"><div class="bigicon" style="color:var(--bad)">&#9829;</div><h2>Out of lives</h2><p>Three mistakes used all your lives. Review the clues and try again.</p><div class="da two"><button class="btn alt" id="back">Back</button><button class="btn" id="retry">Try again</button></div></div>');document.getElementById('back').onclick=()=>{R=G.p.mode==='daily'?{n:'home'}:G.p.mode==='big'?{n:'big'}:{n:'levels',mode:G.p.mode};render()};document.getElementById('retry').onclick=()=>{close();start()}}
function settings(){let a=[['theme','Dark mode','A low-light color palette'],['sound','Sound effects','Audio feedback while painting'],['timer','Show timer','Display elapsed puzzle time'],['auto','Auto-mark lines','Add X marks to completed lines'],['check','Mistake checking','Wrong fills cost one of three lives'],['highlight','Highlight lines','Show the active row and column']];app.innerHTML='<section class="screen">'+bar('Settings','Appearance and gameplay','home')+'<div class="scroll"><div class="section"><div class="panel">'+a.map(([k,t,s])=>'<button class="toggle" data-set="'+k+'"><span><b>'+t+'</b><small>'+s+'</small></span><i class="sw '+(D.set[k]?'on':'')+'"></i></button>').join('')+'</div><div class="panel"><h2>Saved progress</h2><p>Puzzles and unfinished grids save automatically in this browser.</p><button class="btn danger" data-go="reset">Reset all progress</button></div></div></div></section>';app.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{let k=b.dataset.set;D.set[k]=k==='theme'?(D.set.theme==='dark'?'light':'dark'):!D.set[k];document.documentElement.dataset.theme=D.set.theme;b.querySelector('.sw').classList.toggle('on',!!D.set[k]);save()})}
function guide(){app.innerHTML='<section class="screen">'+bar('How to play','Nonogram basics and controls','home')+'<div class="scroll"><div class="section"><div class="panel"><h2>The goal</h2><p>Each cell is filled or empty. The numbers beside every row and column describe consecutive groups of filled cells.</p></div><div class="panel"><h2>Read clues</h2><p>A clue of <b>3 1</b> means three filled cells, at least one empty cell, then one filled cell. A zero means the line is empty.</p></div><div class="panel"><h2>Technique</h2><ol><li>Start with the largest clues.</li><li>Use overlap between earliest and latest positions.</li><li>Mark known empty cells with X.</li><li>Alternate between rows and columns.</li></ol></div><div class="panel"><h2>Controls</h2><p>Click or drag to paint. Right click uses the opposite tool. Space or X changes tools. Z/Y undo and redo. H gives a hint. Plus/minus changes zoom.</p></div></div></div></section>'}
function big(){let cards='';for(let p=0;p<6;p++){let a=D.big[p]||[];cards+='<button class="tile '+(a.filter(Boolean).length===9?'done':'')+'" data-pic="'+p+'">Mosaic '+(p+1)+'<small>'+a.filter(Boolean).length+' / 9</small></button>'}app.innerHTML='<section class="screen">'+bar('Big Picture','Complete nine tiles per mosaic','home')+'<div class="scroll"><div class="section"><div class="mosaic">'+cards+'</div></div></div></section>';app.querySelectorAll('[data-pic]').forEach(b=>b.onclick=()=>tiles(+b.dataset.pic))}function tiles(pic){let a=D.big[pic]||[],h='';for(let i=0;i<9;i++)h+='<button class="tile '+(a[i]?'done':'')+'" data-tile="'+i+'">'+(a[i]?'Done':i+1)+'</button>';app.innerHTML='<section class="screen">'+bar('Mosaic '+(pic+1),a.filter(Boolean).length+' / 9 solved','big')+'<div class="scroll"><div class="section"><div class="mosaic">'+h+'</div></div></div></section>';app.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{R={n:'play',mode:'big',pic,tile:+b.dataset.tile};render()});bindNav()}
function resume(){let l=D.last;if(!l)return;R={n:'play',mode:l.mode,i:l.i,pic:l.pic,tile:l.tile};render()}function bindNav(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let g=b.dataset.go;if(g==='home')R={n:'home'};else if(g==='classic'||g==='expert')R={n:'levels',mode:g};else if(g==='daily')R={n:'play',mode:'daily'};else if(g==='continue'){resume();return}else if(g==='reset'){if(confirm('Delete all saved progress and settings?')){localStorage.removeItem(KEY);D=load();document.documentElement.dataset.theme=D.set.theme;R={n:'home'}}else return}else if(g==='levels')R={n:'levels',mode:G.p.mode};else R={n:g};render()})}function tone(f){if(!D.set.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext);let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.07);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.08)}catch{}}
addEventListener('keydown',e=>{if(!G||R.n!=='play')return;let k=e.key.toLowerCase();if(k==='z')action('undo');else if(k==='y')action('redo');else if(k==='h')action('hint');else if(k==='+'||k==='=')action('in');else if(k==='-'||k==='_')action('out');else if(k==='x'||k===' '){e.preventDefault();G.pen=G.pen===F?X:F;document.querySelectorAll('[data-pen]').forEach(b=>b.classList.toggle('on',+b.dataset.pen===G.pen))}else if(k==='escape')action('pause')});addEventListener('resize',()=>{if(G&&R.n==='play')drawBoard()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.status==='play'&&!G.pause)action('pause')});render();
})();
