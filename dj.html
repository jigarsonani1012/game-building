    <style>

        /* ------------------------------ FX ------------------------------- */

      #toast svg { width: 1.5rem; height: 1.5rem; fill: var(--gold); }

      #countdown { position: absolute; left: 0; right: 0; top: 36%; z-index: 16; pointer-events: none; text-align: center; }
      .cdTxt { display: inline-block; font-size: clamp(2.6rem, 13vw, 4.6rem); font-weight: 800; letter-spacing: .24em; text-indent: .24em; text-transform: uppercase; opacity: 0; text-shadow: 0 6px 26px rgba(0,0,0,.55); }
      .cdTxt.show { animation: cdZoom 1s cubic-bezier(.22,1,.36,1) both; }
      @keyframes cdZoom { 0% { opacity: 0; transform: scale(1.9); } 18% { opacity: 1; transform: scale(1); } 72% { opacity: 1; } 100% { opacity: 0; transform: scale(.9); } }
      #fader { position: absolute; inset: 0; z-index: 70; pointer-events: none; background: #000; opacity: 0; transition: opacity .26s ease; }
      #fader.on { opacity: 1; }

      /* ---------------------------- screens ---------------------------- */
      .screen { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; }
      .dim { background: rgba(6, 9, 30, .55); animation: fade .25s ease both; }
      .panel { width: min(88vw, 360px); border-radius: 26px; padding: 1.5rem 1.4rem 1.3rem; text-align: center; background: linear-gradient(165deg, rgba(22, 28, 66, .78), rgba(9, 12, 36, .82)); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); animation: pop .4s cubic-bezier(.22,1,.36,1) both; }
      .panel h2 { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase; color: rgba(255,255,255,.85); }
      .bigpct { margin: .55rem 0 0; font-size: 4.4rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; text-shadow: 0 4px 20px rgba(0,0,0,.4); }
      .bigpct small { font-size: 1.8rem; font-weight: 700; opacity: .8; }
      .mini { position: relative; margin: 1.35rem .6rem .5rem; height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); }

      .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: .9rem; font-size: .9rem; font-weight: 700; color: rgba(255,255,255,.85); }

      .crownRow { display: flex; justify-content: center; gap: .5rem; margin-top: .9rem; }
      .crownRow svg { width: 1.7rem; height: 1.7rem; fill: rgba(255,255,255,.28); }
      .crownRow svg.got { fill: var(--gold); filter: drop-shadow(0 0 8px rgba(255,209,102,.8)); }
      .crownRow svg.used { fill: var(--gold); opacity: .35; }
      .btns { display: flex; flex-direction: column; gap: .55rem; margin-top: 1.2rem; }
      .btn { width: 100%; border: 0; border-radius: 999px; padding: .8rem 1rem; font-size: 1rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem; transition: transform .12s, filter .2s, background .2s; }
      .btn:active { transform: scale(.96); }
      .btn.primary { background: #fff; color: #17193a; box-shadow: 0 10px 26px rgba(255,255,255,.18); }
      .btn.primary:hover { filter: brightness(1.05); }
      .btn.gold { background: linear-gradient(90deg, #ffd166, #ff9f43); color: #2b1d00; box-shadow: 0 10px 26px rgba(255,180,60,.3); }
      .btn.ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); }
      .btn.ghost:hover { background: rgba(255,255,255,.18); }
      .btn:disabled { opacity: .35; cursor: default; transform: none; }
      .btn svg { width: 1.05rem; height: 1.05rem; fill: currentColor; }
      .badge { display: inline-block; margin-top: .6rem; padding: .2rem .8rem; border-radius: 999px; font-size: .72rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; background: linear-gradient(90deg, #ffd166, #ff9f43); color: #2b1d00; animation: wiggle 1.4s ease-in-out infinite; }
      .note { margin-top: .6rem; font-size: .76rem; font-weight: 700; color: rgba(255,255,255,.7); }

      /* ------------------------------ home ------------------------------ */
      #home { flex-direction: column; justify-content: flex-start; gap: .55rem; padding: calc(.7rem + var(--safe-top)) 1rem calc(1rem + var(--safe-bottom)); overflow-y: auto; touch-action: pan-y; scrollbar-width: none; background: linear-gradient(180deg, rgba(6,9,30,.6), rgba(6,9,30,.25) 34%, rgba(6,9,30,.72)); }
      #home::-webkit-scrollbar { display: none; }
      #home > * { flex: none; }
      .homeTop { width: min(92vw, 420px); display: flex; align-items: center; justify-content: space-between; }
      .wallet { display: flex; align-items: center; gap: .4rem; padding: .35rem .8rem; border-radius: 999px; background: rgba(0,0,0,.28); backdrop-filter: blur(6px); font-weight: 800; font-size: .95rem; }
      .wallet svg { width: 1rem; height: 1rem; }
      .logo { display: flex; flex-direction: column; align-items: center; gap: .15rem; margin-top: .2rem; }
      .logo svg { width: 2.6rem; height: 2.6rem; }
      .logo h1 {
        margin: 0; font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 800; letter-spacing: .38em; text-indent: .38em;
        background: linear-gradient(90deg, #fff 20%, #ffd166 40%, #fff 60%); background-size: 220% auto;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 16px rgba(0,0,0,.45)); animation: shine 5.5s linear infinite;
      }
      #lvlCount { font-size: .7rem; font-weight: 700; letter-spacing: .36em; text-indent: .36em; text-transform: uppercase; color: rgba(255,255,255,.75); margin-top: .3rem; }
      #carousel { position: relative; width: min(92vw, 400px); display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
      .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 2.6rem; height: 2.6rem; border: 0; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(6px); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
      .arrow svg { width: 1.1rem; height: 1.1rem; fill: #fff; }

      #prevBtn { left: -.35rem; } #nextBtn { right: -.35rem; }
      #card { width: 100%; max-width: 340px; border-radius: 26px; overflow: hidden; background: rgba(10, 14, 40, .84); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.5); transition: transform .25s ease; will-change: transform; }
      #card.slideL { animation: slideL .32s cubic-bezier(.22,1,.36,1) both; }
      #card.slideR { animation: slideR .32s cubic-bezier(.22,1,.36,1) both; }
      .preview { position: relative; height: 148px; overflow: hidden; }
      .preview svg.zig { position: absolute; inset: 0; width: 100%; height: 100%; }
      .preview .dash { stroke-dasharray: 10 6; animation: dashflow 1.7s linear infinite; }
      .preview .num { position: absolute; right: .9rem; top: .45rem; font-size: 3.2rem; font-weight: 800; color: rgba(255,255,255,.3); line-height: 1; }
      .preview .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem; background: rgba(6,9,30,.6); font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; padding: 0 1.2rem; line-height: 1.4; }
      .preview .lock svg { width: 2rem; height: 2rem; fill: #fff; }
      .cardBody { padding: 1rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; }
      .preview::before,
      .preview::after { content: ""; position: absolute; pointer-events: none; z-index: 0; width: 170px; height: 40px; background: rgba(255,255,255,.8); border-radius: 999px; filter: blur(12px); opacity: .65; animation: cloudDrift 15s linear infinite; }
      .preview::before { top: 12px; left: -70px; }
      .preview::after { top: 44px; left: 40px; animation-duration: 21s; animation-delay: -7s; opacity: .45; }
      @keyframes cloudDrift { to { transform: translateX(560px); } }
      .preview > * { position: relative; z-index: 1; }
      .cardName { font-size: 1.3rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      .cardStars { color: var(--gold); letter-spacing: .15em; font-size: .95rem; }
      .cardStats { display: flex; flex-wrap: wrap; align-items: center; gap: .85rem; font-size: .84rem; font-weight: 700; color: rgba(255,255,255,.85); }

      .cardStats svg { width: .95rem; height: .95rem; }
      .cardStats .c { fill: rgba(255,255,255,.3); } .cardStats .c.got { fill: var(--gold); }
      .cardStats .done { color: #7be495; }
      .cardBtns { display: flex; gap: .5rem; margin-top: .3rem; }
      .cardBtns .btn { padding: .72rem .8rem; font-size: .92rem; }
      .practiceRow { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; font-size: .72rem; font-weight: 700; color: rgba(255,255,255,.75); }
      .chip { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; border-radius: 999px; padding: .22rem .55rem; font-size: .72rem; font-weight: 700; cursor: pointer; }
      .chip:disabled { opacity: .28; cursor: default; }
      .chip:not(:disabled):hover { background: rgba(255,255,255,.22); }
      #dots { display: flex; gap: .4rem; margin-top: .2rem; }

      #dots span.on { background: #fff; transform: scale(1.3); }
      #dots span.done { background: var(--gold); }
      .homeHint { font-size: .7rem; color: rgba(255,255,255,.55); font-weight: 700; letter-spacing: .1em; }

      /* ---------------------------- settings ---------------------------- */
      .row { display: flex; align-items: center; justify-content: space-between; padding: .75rem 0; border-bottom: 1px solid rgba(255,255,255,.1); font-weight: 700; font-size: .95rem; text-align: left; }
      .row:last-of-type { border-bottom: 0; }
      .switch { position: relative; width: 2.9rem; height: 1.6rem; border-radius: 999px; background: rgba(255,255,255,.25); border: 0; cursor: pointer; transition: background .2s; flex: none; }
      .switch::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.2rem; height: 1.2rem; border-radius: 999px; background: #fff; transition: transform .2s; }
      .switch.on { background: #62c878; }
      .switch.on::after { transform: translateX(1.3rem); }

      /* --------------------------- animations --------------------------- */
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes tapnow { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.14); } }
      @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
      @keyframes crown-pop { 0% { transform: scale(1); } 40% { transform: scale(1.8) rotate(-12deg); } 100% { transform: scale(1); } }
      @keyframes ripple { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }
      @keyframes toast { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 14% { opacity: 1; transform: translateX(-50%) scale(1.12); } 26% { transform: translateX(-50%) scale(1); } 74% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-22px); } }
      @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pop { 0% { opacity: 0; transform: scale(.72) translateY(22px); } 70% { transform: scale(1.03) translateY(-2px); } 100% { opacity: 1; transform: none; } }
      @keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      @keyframes slideL { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
      @keyframes slideR { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
      @keyframes shine { to { background-position: -220% center; } }
      @keyframes dashflow { to { stroke-dashoffset: -32; } }
    </style>

        // ----------------------------------------------------- trail

        onFloor() {

            }

      el.nextBtn2.addEventListener("click", () => { const n = Math.min(LEVELS.length - 1, game.levelIdx + 1); ui.startLevel(n, null); });
      el.replayBtn.addEventListener("click", () => game.restart());
      el.dLevelsBtn.addEventListener("click", () => game.goHome());

      // level carousel
      el.prevBtn.addEventListener("click", () => { game.audio.click(); ui.focusLevel(home.idx - 1, -1); });
      el.nextBtn.addEventListener("click", () => { game.audio.click(); ui.focusLevel(home.idx + 1, 1); });
      el.carousel.addEventListener("pointerdown", (e) => { home.dragging = true; home.sx = e.clientX; home.dx = 0; el.card.style.transition = "none"; });
      window.addEventListener("pointermove", (e) => { if (!home.dragging) return; home.dx = e.clientX - home.sx; el.card.style.transform = "translateX(" + home.dx * 0.55 + "px)"; });
      window.addEventListener("pointerup", () => {
        if (!home.dragging) return; home.dragging = false; el.card.style.transition = ""; el.card.style.transform = "";
        if (Math.abs(home.dx) > 50) { home.suppress = performance.now() + 350; const dir = home.dx < 0 ? 1 : -1; if ((dir > 0 && home.idx < LEVELS.length - 1) || (dir < 0 && home.idx > 0)) { game.audio.click(); ui.focusLevel(home.idx + dir, dir); } }
      });
      window.addEventListener("pointercancel", () => { if (!home.dragging) return; home.dragging = false; el.card.style.transition = ""; el.card.style.transform = ""; });
      window.addEventListener("keydown", (e) => {
        if (game.state !== "home" || el.home.classList.contains("hidden") || !el.settingsScr.classList.contains("hidden")) return;
        if (e.code === "ArrowLeft") ui.focusLevel(home.idx - 1, -1);
        else if (e.code === "ArrowRight") ui.focusLevel(home.idx + 1, 1);
        else if ((e.code === "Enter" || e.code === "Space") && isUnlocked(game.save, home.idx)) { e.preventDefault(); ui.startLevel(home.idx, null); }
      });

      // settings
      el.settingsBtn.addEventListener("click", () => { game.audio.click(); ui.openSettings(); });
      el.settingsClose.addEventListener("click", () => el.settingsScr.classList.add("hidden"));
      el.settingsScr.addEventListener("pointerdown", (e) => { if (e.target === el.settingsScr) el.settingsScr.classList.add("hidden"); });
      const toggleSetting = (key) => { game.settings[key] = !game.settings[key]; storeSave(game.save); if (key === "music") { game.audio.setMusicOn(game.settings.music); if (game.settings.music && game.state === "home") ui.preview(home.idx); } if (key === "sfx") game.audio.setSfxOn(game.settings.sfx); ui.syncSettings(); game.audio.click(); };
      el.swMusic.addEventListener("click", () => toggleSetting("music"));
      el.swSfx.addEventListener("click", () => toggleSetting("sfx"));
      el.swShake.addEventListener("click", () => toggleSetting("shake"));
      el.resetBtn.addEventListener("click", () => { if (!confirm("Reset all progress?")) return; game.save.levels = {}; game.save.last = 0; storeSave(game.save); el.settingsScr.classList.add("hidden"); ui.focusLevel(0, -1); });

      let muted = false;
      el.muteBtn.addEventListener("pointerdown", stop);
      el.muteBtn.addEventListener("click", (e) => { stop(e); muted = !muted; game.audio.unlock(); game.audio.setMuted(muted); el.icoSound.classList.toggle("hidden", muted); el.icoMute.classList.toggle("hidden", !muted); el.muteBtn.setAttribute("aria-label", muted ? "Unmute" : "Mute"); });

      // unlock audio on the very first gesture and start the menu music preview
      document.addEventListener("pointerdown", () => { game.audio.unlock(); if (game.state === "home") ui.preview(home.idx); }, { once: true, capture: true });

      // boot: last played level becomes the menu backdrop
      game.loadLevel(clamp(game.save.last || 0, 0, LEVELS.length - 1), { backdrop: true });
      ui.showHome();

      window.addEventListener("contextmenu", (e) => e.preventDefault());
      document.addEventListener("gesturestart", (e) => e.preventDefault());
    </script>
  </body>
</html>
