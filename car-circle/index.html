<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Car Circle – Roundabout Traffic Timing Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="loading" class="ol">LOADING…</div>

<div id="hud">
  <div id="topbar">
    <div id="timer"><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="12" fill="#ffd23f" stroke="#24456b" stroke-width="3"/><rect x="13" y="1.5" width="6" height="4" rx="1.5" fill="#24456b"/><path d="M16 10v7l5 3" stroke="#24456b" stroke-width="3" fill="none" stroke-linecap="round"/></svg><span id="timeTxt">0:00</span></div>
    <div id="levelBox"><div id="levelTxt" class="ol">LEVEL 1</div><div id="themeBadge">🌱 GREENWOOD PARK</div><div id="carsRow"></div></div>
    <button id="pauseBtn" class="ibtn" aria-label="Pause"><svg viewBox="0 0 30 30"><rect x="7" y="5" width="6" height="20" rx="2" fill="#24456b"/><rect x="17" y="5" width="6" height="20" rx="2" fill="#24456b"/></svg></button>
  </div>
</div>
<div id="hint"><div class="hand"><svg viewBox="0 0 48 60" width="54" height="66"><path d="M18 30V9a4 4 0 0 1 8 0v16l2-.5a4 4 0 0 1 4 2.5l.5-.2a4 4 0 0 1 4.8 2.6 4 4 0 0 1 5.2 3.6V44c0 8-6 14-14 14h-3c-5 0-8-2.5-11-7L7 40a4 4 0 0 1 6.4-4.8L18 40z" fill="#fff" stroke="#173b63" stroke-width="3" stroke-linejoin="round"/></svg></div><span class="ol">TAP TO SEND A CAR</span></div>

<div id="menu" class="screen">
  <div id="logo">
    <svg viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="70" fill="#8fd16a" stroke="#fff" stroke-width="6"/>
      <circle cx="80" cy="80" r="50" fill="none" stroke="#5b6270" stroke-width="26"/>
      <circle cx="80" cy="80" r="50" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="7 7"/>
      <circle cx="80" cy="80" r="30" fill="#6cc04a" stroke="#e5484d" stroke-width="4" stroke-dasharray="6 6"/>
      <circle cx="80" cy="80" r="30" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="6 6" stroke-dashoffset="6"/>
      <circle cx="80" cy="80" r="12" fill="#5fc6ff" stroke="#fff" stroke-width="3"/>
      <g transform="rotate(-30 80 80)"><rect x="70" y="21" width="20" height="12" rx="4" fill="#ff4d4d" stroke="#173b63" stroke-width="2"/><rect x="74" y="23" width="7" height="8" rx="1.5" fill="#cfe9ff"/></g>
      <g transform="rotate(110 80 80)"><rect x="70" y="21" width="20" height="12" rx="4" fill="#ffd23f" stroke="#173b63" stroke-width="2"/><rect x="74" y="23" width="7" height="8" rx="1.5" fill="#cfe9ff"/></g>
      <g transform="rotate(220 80 80)"><rect x="70" y="21" width="20" height="12" rx="4" fill="#3fa9f5" stroke="#173b63" stroke-width="2"/><rect x="74" y="23" width="7" height="8" rx="1.5" fill="#cfe9ff"/></g>
    </svg>
    <div class="t1 ol">CAR</div>
    <div class="t2 ol">CIRCLE</div>
  </div>
  <div id="menuLevel" class="ol">LEVEL 1</div>
  <div id="menuTheme" class="theme-badge" style="margin-top:-14px;margin-bottom:18px">🌱 GREENWOOD PARK</div>
  <button id="playBtn" class="btn">PLAY</button>
  <div id="menuInfo" class="ol">Tap to send cars into the roundabout.<br/>Find the gap – don't crash!</div>
  <button id="soundBtn1" class="ibtn corner sndBtn" aria-label="Sound"></button>
</div>

<div id="pause" class="screen dim">
  <div class="panel">
    <div class="ribbon">PAUSED</div>
    <div id="pauseSub" class="sub" style="margin:2px 0 16px;font-size:18px;font-weight:bold;color:#5a7594">LEVEL 1</div>
    <div class="col" style="margin-top:2px">
      <button id="resumeBtn" class="btn">RESUME</button>
      <div class="row">
        <button id="restartBtn" class="ibtn" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="#24456b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button id="homeBtn1" class="ibtn" aria-label="Home"><svg viewBox="0 0 30 30"><path d="M4 15L15 5l11 10" stroke="#24456b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v12h5v-6h4v6h5V13" fill="#24456b"/></svg></button>
        <button id="soundBtn2" class="ibtn sndBtn" aria-label="Sound"></button>
      </div>
    </div>
  </div>
</div>

<div id="win" class="screen dim">
  <div class="panel">
    <div class="ribbon green" id="winTitle">LEVEL 1</div>
    <div class="win-title-txt" style="font-size:38px;color:#41b832;margin-top:-2px">COMPLETE!</div>
    <div id="winTheme" class="theme-badge" style="margin-top:6px;margin-bottom:6px">🌱 GREENWOOD PARK</div>
    <div id="stars">
      <svg viewBox="0 0 50 50"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" fill="#ffd23f" stroke="#e09a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 50 50"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" fill="#ffd23f" stroke="#e09a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 50 50"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" fill="#ffd23f" stroke="#e09a00" stroke-width="3" stroke-linejoin="round"/></svg>
    </div>
    <div class="sub" id="winSub" style="margin:4px 0 16px">Time left 0:00</div>
    <div class="row">
      <button id="homeBtn2" class="ibtn" aria-label="Home"><svg viewBox="0 0 30 30"><path d="M4 15L15 5l11 10" stroke="#24456b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v12h5v-6h4v6h5V13" fill="#24456b"/></svg></button>
      <button id="nextBtn" class="btn">NEXT</button>
    </div>
  </div>
</div>

<div id="fail" class="screen dim">
  <div class="panel">
    <div class="ribbon red" id="failTitle">CRASH!</div>
    <div class="sub" id="failSub" style="margin:8px 0 20px">Wait for a clear gap!</div>
    <div class="row">
      <button id="homeBtn3" class="ibtn" aria-label="Home"><svg viewBox="0 0 30 30"><path d="M4 15L15 5l11 10" stroke="#24456b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v12h5v-6h4v6h5V13" fill="#24456b"/></svg></button>
      <button id="retryBtn" class="btn orange">RETRY</button>
    </div>
  </div>
</div>
<div id="fade"></div>

<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
