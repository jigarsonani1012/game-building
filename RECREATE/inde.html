<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff4d6d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Stack Fall: a one-touch 3D tower smasher with endless procedural levels."
    />
    <title>Stack Fall</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
        }
      }
    </script>
    <style>
      :root {
        --accent: #ff4d6d;
        --accent-dark: #e33a58;
        --top: #ffe6ef;
        --bottom: #ffb8c6;
        --ink: #273146;
        --muted: #738094;
        --panel: rgba(255, 255, 255, 0.9);
        --safe-top: max(14px, env(safe-area-inset-top));
        --safe-bottom: max(16px, env(safe-area-inset-bottom));
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--bottom);
        font-family:
          "Arial Rounded MT Bold", "Trebuchet MS", ui-rounded, system-ui,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      body {
        position: fixed;
        inset: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        isolation: isolate;
        background: linear-gradient(180deg, var(--top), var(--bottom));
        transition: background 500ms ease;
        user-select: none;
        -webkit-user-select: none;
      }
      #app::before,
      #app::after {
        position: absolute;
        z-index: 0;
        width: 42vmax;
        height: 42vmax;
        border-radius: 50%;
        content: "";
        filter: blur(55px);
        opacity: 0.35;
        pointer-events: none;
      }
      #app::before {
        top: 18%;
        left: -24vmax;
        background: var(--accent);
      }
      #app::after {
        right: -25vmax;
        bottom: -16vmax;
        background: #fff;
      }
      #world,
      #world canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #world canvas {
        display: block;
        outline: none;
      }
      #ui {
        position: absolute;
        z-index: 2;
        inset: 0;
        pointer-events: none;
      }
      .interactive {
        pointer-events: auto;
      }
      .hidden {
        display: none !important;
      }
      .topbar {
        position: absolute;
        top: var(--safe-top);
        left: 14px;
        right: 14px;
        display: grid;
        grid-template-columns: 42px minmax(80px, 360px) 42px;
        gap: 9px;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        max-width: 495px;
      }
      .level-dot {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 3px solid rgba(255, 255, 255, 0.94);
        border-radius: 50%;
        color: #fff;
        font-size: 14px;
        font-weight: 900;
        background: var(--accent);
        box-shadow: 0 4px 10px rgba(33, 35, 48, 0.2);
      }
      .level-dot.next {
        color: #566174;
        background: rgba(255, 255, 255, 0.62);
      }
      .progress-rail {
        height: 13px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.7);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.38);
        box-shadow: inset 0 2px 4px rgba(38, 40, 52, 0.14);
      }
      #progressFill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        transition: width 130ms linear;
      }
      .statusbar {
        position: absolute;
        top: calc(var(--safe-top) + 53px);
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: auto;
        max-width: 495px;
      }
      .coin-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 30px;
        padding: 5px 10px;
        border-radius: 999px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 900;
        background: rgba(255, 255, 255, 0.66);
        box-shadow: 0 3px 10px rgba(39, 49, 70, 0.13);
        backdrop-filter: blur(8px);
      }
      .gem {
        width: 16px;
        height: 16px;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.15));
      }
      .circle-action {
        display: grid;
        width: 38px;
        height: 38px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 4px 10px rgba(39, 49, 70, 0.16);
        backdrop-filter: blur(8px);
        transition: transform 120ms ease;
      }
      .circle-action:active {
        transform: scale(0.88);
      }
      .circle-action svg {
        width: 19px;
        height: 19px;
      }
      #score {
        position: absolute;
        top: calc(var(--safe-top) + 88px);
        left: 0;
        right: 0;
        color: #fff;
        font-size: clamp(46px, 11vw, 74px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.07em;
        text-align: center;
        text-shadow:
          0 4px 0 rgba(34, 36, 47, 0.1),
          0 7px 13px rgba(34, 36, 47, 0.18);
      }
      .score-bump {
        animation: scoreBump 160ms cubic-bezier(0.2, 0.9, 0.3, 1.4);
      }
      #feverGauge {
        position: absolute;
        top: 50%;
        left: 13px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        transform: translateY(-50%);
      }
      .flame-mark {
        width: 26px;
        height: 30px;
        color: #ff8a14;
        filter: drop-shadow(0 2px 2px rgba(121, 59, 0, 0.25));
      }
      .gauge-rail {
        position: relative;
        width: 15px;
        height: clamp(130px, 24vh, 205px);
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.84);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.36);
        box-shadow:
          inset 0 2px 4px rgba(38, 40, 52, 0.15),
          0 3px 8px rgba(38, 40, 52, 0.1);
      }
      #feverFill {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 0%;
        border-radius: inherit;
        background: linear-gradient(0deg, #ff5a1e, #ffad16 65%, #fff1a3);
        box-shadow: 0 0 12px rgba(255, 126, 14, 0.8);
        transition: height 100ms linear;
      }
      #feverLabel {
        position: absolute;
        top: 38%;
        left: 50%;
        color: #fff1a3;
        font-size: clamp(24px, 7vw, 36px);
        font-weight: 900;
        letter-spacing: 0.1em;
        text-shadow:
          0 3px 0 #e55418,
          0 4px 13px rgba(229, 84, 24, 0.6);
        transform: translateX(-50%);
        animation: feverPulse 350ms ease-in-out infinite alternate;
      }
      #comboLayer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .combo {
        position: absolute;
        color: #fff;
        font-size: clamp(19px, 5.5vw, 29px);
        font-weight: 900;
        font-style: italic;
        text-shadow: 0 3px 6px rgba(28, 29, 40, 0.32);
        white-space: nowrap;
        animation: comboPop 760ms ease-out forwards;
      }
      .combo.hot {
        color: #fff3a0;
        text-shadow:
          0 3px 0 #e75514,
          0 4px 10px rgba(220, 70, 0, 0.4);
      }
      .home {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(var(--safe-top) + 44px) 22px var(--safe-bottom);
        text-align: center;
      }
      .brand {
        margin-top: 5px;
        color: #fff;
        font-size: clamp(55px, 15vw, 88px);
        font-weight: 900;
        line-height: 0.76;
        letter-spacing: -0.08em;
        text-transform: uppercase;
        text-shadow:
          0 6px 0 rgba(41, 40, 57, 0.12),
          0 11px 20px rgba(35, 33, 51, 0.13);
        animation: titleFloat 3.2s ease-in-out infinite;
      }
      .brand span {
        color: var(--accent);
        -webkit-text-stroke: 3px #fff;
        text-shadow:
          0 5px 0 rgba(255, 255, 255, 0.45),
          0 10px 18px rgba(35, 33, 51, 0.12);
      }
      .best-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 18px;
        padding: 8px 13px;
        border-radius: 999px;
        color: #566174;
        font-size: 13px;
        font-weight: 900;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 3px 10px rgba(39, 49, 70, 0.1);
        backdrop-filter: blur(8px);
      }
      .home-middle {
        margin-bottom: 4vh;
      }
      .level-tag {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        color: #566174;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 3px 12px rgba(39, 49, 70, 0.11);
      }
      .tap-title {
        margin: 16px 0 6px;
        color: #fff;
        font-size: clamp(21px, 5vw, 30px);
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-shadow: 0 3px 8px rgba(36, 37, 48, 0.3);
        animation: tapPulse 1.25s ease-in-out infinite;
      }
      .home-tip {
        margin: 0;
        color: rgba(47, 56, 76, 0.68);
        font-size: 12px;
        font-weight: 800;
      }
      .bottom-actions {
        display: flex;
        gap: 17px;
      }
      .round-menu {
        display: grid;
        width: 56px;
        height: 56px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #566174;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: 0 6px 16px rgba(39, 49, 70, 0.17);
        backdrop-filter: blur(8px);
        transition: transform 120ms ease;
      }
      .round-menu:active {
        transform: scale(0.88);
      }
      .round-menu svg {
        width: 25px;
        height: 25px;
      }
      .ready-hint {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 74px;
        text-align: center;
      }
      .ready-hint .level-tag {
        animation: panelIn 0.28s ease-out;
      }
      .ready-hint .tap-title {
        margin-top: 18px;
      }
      .modal-backdrop {
        position: absolute;
        z-index: 10;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
        background: rgba(19, 24, 35, 0.28);
        backdrop-filter: blur(2px);
      }
      .panel {
        width: min(100%, 382px);
        padding: 23px;
        border-radius: 27px;
        background: var(--panel);
        box-shadow: 0 22px 65px rgba(23, 28, 40, 0.28);
        animation: panelIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.17);
        text-align: center;
      }
      .panel-kicker {
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      .panel h2 {
        margin: 4px 0 2px;
        color: var(--ink);
        font-size: 31px;
        font-weight: 900;
        line-height: 1;
        text-transform: uppercase;
      }
      .panel p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }
      .stat-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 19px 0;
      }
      .stat {
        padding: 11px;
        border-radius: 17px;
        background: #f0f3f8;
      }
      .stat b {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .stat strong {
        color: var(--ink);
        font-size: 29px;
        font-weight: 900;
      }
      .stat.reward strong {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 25px;
      }
      .stars {
        margin: 15px 0 17px;
        font-size: 30px;
        letter-spacing: 6px;
        color: #ffc827;
        filter: drop-shadow(0 2px 1px rgba(169, 105, 0, 0.18));
      }
      .primary-btn {
        display: flex;
        width: 100%;
        min-height: 57px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 13px 18px;
        border: 0;
        border-radius: 17px;
        color: #fff;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: linear-gradient(180deg, var(--accent), var(--accent-dark));
        box-shadow:
          0 7px 0 rgba(51, 55, 69, 0.19),
          0 12px 20px rgba(47, 50, 64, 0.17);
        transition:
          transform 110ms ease,
          box-shadow 110ms ease;
      }
      .primary-btn:active {
        transform: translateY(4px);
        box-shadow:
          0 3px 0 rgba(51, 55, 69, 0.16),
          0 6px 12px rgba(47, 50, 64, 0.12);
      }
      .primary-btn svg {
        width: 20px;
        height: 20px;
      }
      .secondary-link {
        margin-top: 17px;
        padding: 2px;
        border: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: transparent;
      }
      .mini-actions {
        display: flex;
        justify-content: center;
        gap: 13px;
        margin-top: 18px;
      }
      .mini-action {
        display: grid;
        width: 45px;
        height: 45px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #5d687b;
        background: #edf1f6;
      }
      .mini-action svg {
        width: 21px;
        height: 21px;
      }
      .revive-clock {
        position: relative;
        display: grid;
        width: 92px;
        height: 92px;
        margin: 17px auto;
        place-items: center;
      }
      .revive-clock svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      #reviveArc {
        stroke: var(--accent);
        stroke-linecap: round;
        transition: stroke-dashoffset 1s linear;
      }
      #reviveNumber {
        color: var(--ink);
        font-size: 37px;
        font-weight: 900;
      }
      .sheet-layer {
        position: absolute;
        z-index: 12;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(19, 24, 35, 0.35);
        backdrop-filter: blur(2px);
      }
      .sheet {
        width: min(100%, 500px);
        max-height: min(84vh, 720px);
        overflow: auto;
        padding: 0 18px calc(var(--safe-bottom) + 13px);
        border-radius: 28px 28px 0 0;
        background: #fff;
        box-shadow: 0 -8px 45px rgba(25, 30, 44, 0.22);
        animation: sheetUp 0.26s ease-out;
      }
      .sheet-head {
        position: sticky;
        z-index: 1;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0 13px;
        border-bottom: 1px solid #edf0f4;
        background: rgba(255, 255, 255, 0.96);
      }
      .sheet-title {
        margin: 0;
        color: var(--ink);
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .sheet-close {
        display: grid;
        width: 33px;
        height: 33px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #586477;
        background: #edf1f5;
      }
      .sheet-close svg {
        width: 18px;
        height: 18px;
      }
      .wallet {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 15px 0;
        padding: 12px 14px;
        border-radius: 16px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
        background: #f1f4f8;
      }
      .wallet b {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--ink);
        font-size: 18px;
      }
      .skin-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .skin-card {
        min-height: 126px;
        padding: 10px 5px 8px;
        border: 2px solid #eef1f5;
        border-radius: 18px;
        color: var(--ink);
        background: #fff;
        transition:
          transform 120ms ease,
          border-color 120ms ease,
          background 120ms ease;
      }
      .skin-card:active {
        transform: scale(0.95);
      }
      .skin-orb {
        display: block;
        width: 52px;
        height: 52px;
        margin: 0 auto 8px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          inset -4px -5px 8px rgba(0, 0, 0, 0.32),
          inset 3px 4px 6px rgba(255, 255, 255, 0.75),
          0 5px 12px rgba(27, 31, 45, 0.18);
        position: relative;
        flex-shrink: 0;
      }
      .skin-card b {
        display: block;
        overflow: hidden;
        font-size: 11px;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .skin-cost {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        min-height: 18px;
        margin-top: 5px;
        padding: 2px 6px;
        border-radius: 999px;
        color: #69768b;
        font-size: 9px;
        font-weight: 900;
        background: #eef1f5;
      }
      .skin-card.selected .skin-cost {
        color: #fff;
        background: var(--accent);
      }
      .skin-cost .gem {
        width: 11px;
        height: 11px;
      }
      .shop-nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin: 14px 0 10px;
        padding: 4px;
        border-radius: 16px;
        background: #f1f4f8;
      }
      .shop-tab {
        padding: 8px 4px;
        border: 0;
        border-radius: 12px;
        color: #728096;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: transparent;
        transition: all 130ms ease;
      }
      .shop-tab.active {
        color: var(--ink);
        background: #fff;
        box-shadow: 0 2px 8px rgba(35, 45, 65, 0.12);
      }
      .trail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .trail-card {
        padding: 14px 10px;
        border: 2px solid #eef1f5;
        border-radius: 20px;
        color: var(--ink);
        background: #fff;
        text-align: center;
        transition: all 130ms ease;
      }
      .trail-card.selected {
        border-color: var(--accent);
        background: #f7f9fc;
      }
      .trail-icon {
        font-size: 32px;
        margin-bottom: 6px;
        display: block;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
      }
      .trail-card b {
        display: block;
        font-size: 13px;
        font-weight: 900;
      }
      .trail-card p {
        margin: 4px 0 8px;
        color: #8391a5;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.3;
      }
      .upgrade-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .upgrade-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border: 2px solid #eef1f5;
        border-radius: 20px;
        background: #fff;
      }
      .upgrade-icon {
        font-size: 32px;
        flex-shrink: 0;
      }
      .upgrade-info {
        flex: 1;
        min-width: 0;
      }
      .upgrade-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 3px;
      }
      .upgrade-head b {
        font-size: 14px;
        font-weight: 900;
        color: var(--ink);
      }
      .upgrade-desc {
        color: #8391a5;
        font-size: 11px;
        font-weight: 600;
        margin: 2px 0 6px;
        line-height: 1.25;
      }
      .upgrade-bars {
        display: flex;
        gap: 4px;
      }
      .up-bar {
        flex: 1;
        height: 6px;
        border-radius: 99px;
        background: #eef1f5;
      }
      .up-bar.filled {
        background: var(--accent);
      }
      .up-btn {
        padding: 8px 12px;
        border: 0;
        border-radius: 14px;
        color: #fff;
        font-size: 12px;
        font-weight: 900;

        save.coins += coins;
        save.smashed += fresh;
        save.level = Math.max(save.level, game.level + 1);
        store();
        persistent();
        page("won");
        winModal();
      }
      function fever() {
        dom.flash.classList.remove("fire");
        void dom.flash.offsetWidth;
        dom.flash.classList.add("fire");
      }
      function gameOver() {
        let seconds = 5;
        const render = () => {
          const len = 276.46,
            offset = len * (1 - seconds / 5);
          dom.modal.innerHTML = `<div class="modal-backdrop"><div class="panel">${!reviveUsed && seconds > 0 ? `<h2>Second chance?</h2><p>Continue from where you fell.</p><div class="revive-clock"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#e7ebf0" stroke-width="8"/><circle id="reviveArc" cx="50" cy="50" r="44" fill="none" stroke-width="8" stroke-dasharray="${len}" stroke-dashoffset="${offset}"/></svg><b id="reviveNumber">${seconds}</b></div><button id="continueBtn" class="primary-btn interactive" style="--accent:#22bb6a;--accent-dark:#149450">${icon.play} Continue</button><button id="declineBtn" class="secondary-link interactive">No thanks</button>` : `<div class="panel-kicker">Level ${game.level}</div><h2>Game over</h2><div class="stat-row"><div class="stat"><b>Score</b><strong>${result.score}</strong></div><div class="stat reward"><b>Best</b><strong style="color:var(--accent)">${save.best}</strong></div></div>${result.coins ? `<p style="display:flex;justify-content:center;align-items:center;gap:4px;margin:-5px 0 15px">${gem(16)} +${result.coins} gems</p>` : ""}<button id="retryBtn" class="primary-btn interactive">${icon.replay} Try again</button><div class="mini-actions"><button id="homeBtn" class="mini-action interactive" aria-label="Home">${icon.home}</button></div>`}</div></div>`;
          dom.modal.classList.remove("hidden");
          $("#continueBtn")?.addEventListener("click", () => {
            clearInterval(reviveInterval);
            sound.reward();
            reviveUsed = true;
            game.revive();
            closeModal();
            page("playing");
          });
          $("#declineBtn")?.addEventListener("click", () => {
            clearInterval(reviveInterval);
            seconds = 0;
            render();
          });
          $("#retryBtn")?.addEventListener("click", restart);
          $("#homeBtn")?.addEventListener("click", home);
        };
        render();
        reviveInterval = setInterval(() => {
          if (reviveUsed || seconds <= 0) {
            clearInterval(reviveInterval);
            return;
          }
          seconds--;
          render();
        }, 1000);
      }
      function winModal() {
        dom.modal.innerHTML = `<div class="modal-backdrop"><div class="panel"><div class="panel-kicker">Level ${game.level}</div><h2>Complete</h2><div class="stars">★ ★ ★</div><div class="stat-row"><div class="stat"><b>Score</b><strong>${result.score}</strong></div><div class="stat reward"><b>Reward</b><strong>${gem(20)} ${result.coins}</strong></div></div><button id="nextBtn" class="primary-btn interactive">${icon.play} Next level</button><div class="mini-actions"><button id="homeBtn" class="mini-action interactive" aria-label="Home">${icon.home}</button></div></div></div>`;
        dom.modal.classList.remove("hidden");
        $("#nextBtn").addEventListener("click", next);
        $("#homeBtn").addEventListener("click", home);
      }
      function pauseModal() {
        dom.modal.innerHTML = `<div class="modal-backdrop"><div class="panel"><h2>Paused</h2><div class="mini-actions" style="margin:18px 0"><button id="pauseSound" class="mini-action interactive" aria-label="Toggle sound">${save.sound ? "SOUND" : "MUTE"}</button><button id="pauseVibe" class="mini-action interactive" aria-label="Toggle vibration">${save.vibration ? "VIBE" : "NO VIBE"}</button></div><button id="resumeBtn" class="primary-btn interactive">${icon.play} Resume</button><div class="mini-actions"><button id="restartBtn" class="mini-action interactive" aria-label="Restart">${icon.replay}</button><button id="homeBtn" class="mini-action interactive" aria-label="Home">${icon.home}</button></div></div></div>`;
        dom.modal.classList.remove("hidden");
        $("#resumeBtn").addEventListener("click", resume);
        $("#restartBtn").addEventListener("click", restart);
        $("#homeBtn").addEventListener("click", home);
        $("#pauseSound").addEventListener("click", toggleSound);
        $("#pauseVibe").addEventListener("click", toggleVibe);
      }
      const gradient = (s) => {
        if (s.rainbow)
          return "conic-gradient(from 180deg at 50% 50%, #ff3d79, #ff8c22, #ffe447, #43ed70, #28bcff, #7c55ff, #ff3d79)";
        if (s.id === "classic")
          return "radial-gradient(circle at 35% 28%, #ffffff 0%, #edf1f7 42%, #b5c3d4 78%, #7889a0 100%)";
        if (s.id === "gold")
          return "radial-gradient(circle at 35% 28%, #fff9d6 0%, #ffd43f 40%, #d89008 75%, #6e4600 100%)";
        if (s.id === "obsidian")
          return "radial-gradient(circle at 35% 28%, #bb88ff 0%, #4f2e8c 42%, #1b122c 78%, #0a0614 100%)";
        if (s.id === "chrome")
          return "radial-gradient(circle at 35% 28%, #ffffff 0%, #d6e5fb 38%, #7597c4 75%, #253959 100%)";
        const glow = s.glow || s.color;
        return `radial-gradient(circle at 35% 28%, #ffffff 0%, ${glow} 38%, ${s.color} 72%, rgba(18,20,28,0.7) 100%)`;
      };
      function shop() {
        sound.tap();
        const cards = SKINS.map((s) => {
          const owned = save.owned.includes(s.id),
            selected = save.skin === s.id,
            afford = save.coins >= s.price;
          return `<button data-skin="${s.id}" class="skin-card interactive ${selected ? "selected" : ""}" ${!owned && !afford ? "disabled" : ""}><span class="skin-orb" style="background:${gradient(s)}"></span><b>${s.name}</b><span class="skin-cost">${owned ? (selected ? "Equipped" : "Owned") : `${gem(11)} ${s.price}`}</span></button>`;
        }).join("");
        dom.sheet.innerHTML = `<div class="sheet-layer"><section class="sheet"><div class="sheet-head"><h2 class="sheet-title">Ball skins</h2><button id="closeSheet" class="sheet-close interactive" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="wallet"><span>Your gems</span><b>${gem(18)} ${save.coins}</b></div><div class="skin-grid">${cards}</div><p class="sheet-note">Earn gems by smashing floors and completing levels.</p></section></div>`;
        dom.sheet.classList.remove("hidden");
        $("#closeSheet").addEventListener("click", closeSheet);
        dom.sheet.querySelectorAll("[data-skin]").forEach((b) =>
          b.addEventListener("click", () => {
            const s = SKINS.find((x) => x.id === b.dataset.skin);
            if (!s) return;
            if (!save.owned.includes(s.id)) {
              if (save.coins < s.price) return;
              save.coins -= s.price;
              save.owned.push(s.id);
              sound.reward();
            } else sound.tap();
            save.skin = s.id;
            game.skin(s);
            store();
            persistent();
            shop();
          }),
        );
      }
      function toggleSound() {
        save.sound = !save.sound;
        sound.enabled = save.sound;
        if (save.sound) sound.tap();
        store();
        if (active === "paused") pauseModal();
        else settings();
      }
      function toggleVibe() {
        save.vibration = !save.vibration;
        if (save.vibration) vibrate(16);
        store();
        if (active === "paused") pauseModal();
        else settings();
      }
      function settings() {
        sound.tap();
        dom.sheet.innerHTML = `<div class="sheet-layer"><section class="sheet"><div class="sheet-head"><h2 class="sheet-title">Settings</h2><button id="closeSheet" class="sheet-close interactive" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="setting-row"><span>Sound</span><button id="soundSwitch" class="switch interactive ${save.sound ? "on" : ""}" aria-label="Toggle sound"></button></div><div class="setting-row"><span>Vibration</span><button id="vibeSwitch" class="switch interactive ${save.vibration ? "on" : ""}" aria-label="Toggle vibration"></button></div><div class="stats-grid"><div class="small-stat"><b>Level</b><strong>${save.level}</strong></div><div class="small-stat"><b>Best</b><strong>${save.best}</strong></div><div class="small-stat"><b>Smashed</b><strong>${save.smashed}</strong></div></div><div class="how"><b>How to play</b>Hold to smash through coloured floors. Release before a dark section. Keep smashing to fill Fever and break everything for a short time.</div><button id="resetBtn" class="reset-btn interactive">Reset progress</button></section></div>`;
        dom.sheet.classList.remove("hidden");
        $("#closeSheet").addEventListener("click", closeSheet);
        $("#soundSwitch").addEventListener("click", toggleSound);
        $("#vibeSwitch").addEventListener("click", toggleVibe);
        $("#resetBtn").addEventListener("click", () => {
          if (!confirm("Reset all Stack Fall progress?")) return;
          save = { ...DEFAULT_SAVE };
          store();
          game.skin(SKINS[0]);
          game.load(1);
          closeSheet();
          persistent();
          page("home");
        });
      }
      try {
        game = new Engine(dom.world, {
          hud,
          combo: pop,
          dead: death,
          win: victory,
          fever,
        });
        game.skin(SKINS.find((s) => s.id === save.skin) || SKINS[0]);
      } catch (err) {
        console.error(err);
        dom.error.classList.remove("hidden");
      }
      persistent();
      page("home");
      $("#pauseBtn").addEventListener("click", pause);
      $("#shopBtn").addEventListener("click", shop);
      $("#settingsBtn").addEventListener("click", settings);
      const isUI = (t) => Boolean(t.closest("button,.sheet,.panel"));
      dom.app.addEventListener("pointerdown", (e) => {
        if (isUI(e.target) || !game) return;
        game.holdAllowed = true;
        if (active === "home" || active === "ready") {
          start();
          game.holdSet(true);
        } else if (active === "playing") {
          game.holdSet(true);
        }
      });
      const release = () => game?.holdSet(false);
      window.addEventListener("pointerup", release);
      window.addEventListener("pointercancel", release);
      window.addEventListener("blur", release);
      window.addEventListener("keydown", (e) => {
        if (e.repeat) return;
        if (["Space", "ArrowDown", "Enter"].includes(e.code)) {
          e.preventDefault();
          if (active === "home" || active === "ready") start();
          if (active === "playing") game.holdSet(true);
        }
        if ((e.code === "Escape" || e.code === "KeyP") && active === "playing")
          pause();
        else if (
          (e.code === "Escape" || e.code === "KeyP") &&
          active === "paused"
        )
          resume();
      });
      window.addEventListener("keyup", (e) => {
        if (["Space", "ArrowDown", "Enter"].includes(e.code)) release();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && active === "playing") pause();
      });
    </script>
  </body>
</html>
