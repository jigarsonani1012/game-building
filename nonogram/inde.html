<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#dcecf8" />
<meta name="description" content="Nonogram Square — classic picture cross logic puzzles. Fill cells by number clues to reveal hidden pixel art!" />
<title>Nonogram Square</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f7fc0'/%3E%3Cpath d='M7 7h8v8H7zM17 7h8v8h-8zM7 17h8v8H7zM17 17h8v8h-8z' fill='white'/%3E%3C/svg%3E" />
<style>
/* ============ THEME TOKENS ============ */
:root{
  --bg-grad: linear-gradient(160deg,#f0f8fe 0%,#e3f0fa 45%,#d7e8f6 100%);
  --card:#ffffff;
  --card-2:#f4f8fc;
  --text:#2f333b;
  --heading:#262b33;
  --muted:#8b98a8;
  --muted-2:#b6c1cd;
  --brand:#2d86c7;
  --brand-2:#1370b4;
  --brand-tint:#e2f0fa;
  --hair:#d4dde7;
  --sep:#93a4b8;
  --clue-bg:#eef4f9;
  --clue:#475569;
  --clue-done:#c2ccd8;
  --fill:#2f333b;
  --xmark:#94a3b8;
  --cell:#ffffff;
  --lit:rgba(45,134,199,.08);
  --border:#d7e0e9;
  --shadow:rgba(30,60,90,.16);
  --track:#cfdae5;
}
html.dark{
  --bg-grad: linear-gradient(160deg,#141c2e 0%,#101827 50%,#0c1320 100%);
  --card:#1f2a3d;
  --card-2:#172235;
  --text:#e9eff8;
  --heading:#f1f5fb;
  --muted:#7d8ca3;
  --muted-2:#48576e;
  --brand:#4ea3d6;
  --brand-2:#2d86c7;
  --brand-tint:#16314a;
  --hair:#29364b;
  --sep:#41506a;
  --clue-bg:#101827;
  --clue:#cbd5e1;
  --clue-done:#3a4a60;
  --fill:#e9eff8;
  --xmark:#64748b;
  --cell:#141d2e;
  --lit:rgba(78,163,214,.16);
  --border:#334155;
  --shadow:rgba(0,0,0,.45);
  --track:#2c3a50;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Baloo 2",ui-rounded,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:#e3f0fa;color:var(--text);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
html.dark body{background:#0c1320}
#app{width:100%;height:100%;height:100dvh;overflow:hidden;position:relative}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.mono{font-family:"Roboto Mono",ui-monospace,Consolas,monospace}
.ic{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic-fill{fill:currentColor;stroke:none}
.no-select{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.press{transition:transform .08s ease,filter .15s ease}
.press:active{transform:scale(.92)}
.screen{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg-grad);animation:screen-in .28s ease-out both}
@keyframes screen-in{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============ FLOATING SQUARES / CONFETTI ============ */
.floats{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaty{position:absolute;border-radius:3px;animation:floaty var(--dur,9s) ease-in-out var(--delay,0s) infinite;pointer-events:none}
.screen > *:not(.floats){position:relative;z-index:1}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti-piece{position:absolute;top:-12px;animation:confetti-fall var(--dur,3.2s) linear var(--delay,0s) forwards}
@keyframes confetti-fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(var(--spin,720deg));opacity:.95}}

/* ============ GENERIC BUTTONS ============ */
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.65)}
html.dark .icon-btn:hover{background:rgba(255,255,255,.08)}
.btn-primary{
  width:100%;border-radius:14px;padding:13px 16px;color:#fff;font-weight:800;font-size:17px;
  letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(to bottom,#2a91d4,#1370b4);
  box-shadow:0 4px 0 #0c5283, 0 10px 22px rgba(19,99,156,.35);
}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{flex:1;border-radius:12px;padding:10px;border:2px solid var(--border);color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* ============ MAIN MENU ============ */
.menu-top{display:flex;justify-content:flex-end;gap:4px;padding:14px 16px;position:relative;z-index:2}
.menu-body{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px;position:relative;z-index:2;overflow:auto}
.menu-col{width:100%;max-width:840px;display:flex;flex-direction:column;gap:18px}
.mode-card{
  display:flex;align-items:center;gap:18px;width:100%;text-align:left;border-radius:18px;border:2px solid var(--card);
  background:var(--card);padding:16px 20px;animation:slide-up .32s ease-out both;
  transition:transform .15s ease,box-shadow .15s ease;
}
.mode-card:hover{transform:translateY(-2px)}
@keyframes slide-up{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.mode-ic{width:68px;height:68px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px}
.mode-main{flex:1;min-width:0}
.mode-title{font-size:clamp(16px,2.4vw,24px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--heading);display:flex;align-items:center;gap:8px}
.mode-sub{font-family:"Roboto Mono",monospace;font-size:clamp(11px,1.4vw,14px);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-top:7px;height:6px;border-radius:99px;background:var(--track);overflow:hidden;display:flex;align-items:center;gap:8px}
.prog > i{display:block;height:100%;border-radius:99px;background:var(--pc,#2d86c7);transition:width .5s ease}
.prog-count{font-family:"Roboto Mono",monospace;font-size:11px;font-weight:600;color:var(--muted);margin-left:6px;white-space:nowrap}
.mode-foot{display:flex;align-items:center;gap:8px}
.streak-badge{display:inline-flex;align-items:center;gap:4px;background:#ffe9d6;color:#e8801c;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:800}
html.dark .streak-badge{background:rgba(245,146,40,.16)}
.quick{
  margin-top:4px;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  border-radius:18px;padding:18px;font-size:clamp(18px,2.6vw,24px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;
  background:linear-gradient(to bottom,#2a91d4,#1370b4);
  box-shadow:0 6px 0 #0c5283,0 16px 30px rgba(19,99,156,.4);
  animation:slide-up .32s ease-out .22s both;
}
.quick .ic{width:30px;height:30px;fill:#fff;stroke:#fff}

/* ============ LEVEL SELECT ============ */
.ls-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px}
.back-link{display:flex;align-items:center;gap:6px;border-radius:99px;padding:8px 10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.back-link .ic{font-size:28px}
.head-tools{display:flex;gap:2px}
.tabs{display:flex;justify-content:center;gap:clamp(24px,8vw,52px);padding:8px 0 4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:8px;color:var(--muted);font-size:clamp(12px,1.6vw,15px);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.tab .ic{font-size:20px}
.tab .uline{height:2px;width:100%;border-radius:2px;background:transparent}
.tab.active{color:var(--brand)}
.tab.active .uline{background:var(--brand)}
.levels-wrap{flex:1;overflow:auto;padding:14px 16px 30px;scrollbar-width:thin}
.levels{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,16px)}
.tile{
  position:relative;aspect-ratio:1/1;border-radius:12px;border:2px solid var(--border);background:var(--card);overflow:hidden;
  box-shadow:0 3px 0 rgba(70,90,110,.12);animation:slide-up .3s ease-out both;transition:transform .12s ease;
}
.tile:hover{transform:translateY(-2px)}
.tile.next{border-color:var(--brand);box-shadow:0 0 0 2px rgba(45,134,199,.35),0 8px 18px rgba(45,134,199,.28)}
.tile.solved{border-color:#9fc3dd}
html.dark .tile.solved{border-color:#3f5d78}
.tile .thumb{width:100%;height:100%;padding:10%}
.tile .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,7vw,52px);font-weight:800;color:var(--fill);line-height:1}
.starbadge{position:absolute;right:5px;top:5px;width:21px;height:21px;border-radius:50%;background:#f5b840;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tile-progress{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:34px;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.tile-progress > i{display:block;height:100%;background:var(--brand)}

/* ============ DAILY CHALLENGE SCREEN ============ */
.daily-wrap{flex:1;overflow:auto;padding:14px 18px 36px;scrollbar-width:thin}
.daily-col{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column}
.day-hero{
  border:3px solid #33c79f;border-radius:18px;background:var(--card);
  padding:18px 20px;box-shadow:0 8px 24px var(--shadow);margin-bottom:20px;
  animation:slide-up .3s ease-out both;
}
html.dark .day-hero{border-color:#12a880}
.day-hero .dh-k{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#12a880;font-weight:800}
html.dark .day-hero .dh-k{color:#3cd4aa}
.day-hero .dh-t{font-size:24px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--heading);margin:6px 0 14px}
.day-hero .dh-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh-tag{
  display:inline-flex;align-items:center;gap:7px;background:var(--card-2);border-radius:10px;
  padding:8px 12px;font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--text);
  border:1px solid var(--border);
}
.btn-play-daily{
  margin-left:auto;min-height:42px;padding:0 22px;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;
  background:linear-gradient(180deg,#29be97,#12a880);
  box-shadow:0 3px 0 #0c7559,0 8px 18px rgba(18,168,128,.35);
  transition:transform .1s ease,filter .15s ease;
}
.btn-play-daily:hover{filter:brightness(1.06)}
.btn-play-daily:active{transform:translateY(2px);box-shadow:0 1px 0 #0c7559,0 4px 10px rgba(18,168,128,.3)}

.sect-k{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:6px 2px 14px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(5px,1.4vw,8px);position:relative;z-index:2}
.cal .dow{text-align:center;font-size:11px;letter-spacing:1px;font-weight:800;color:var(--muted);padding-bottom:4px}
.cal .d{
  aspect-ratio:1;border-radius:10px;background:var(--card-2);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-size:13px;font-weight:700;
  color:var(--text);position:relative;overflow:hidden;cursor:pointer;
  transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;
  touch-action:manipulation;
}
html.dark .cal .d{background:#172235;border-color:#29364b;color:#e9eff8}
.cal .d:hover:not(.future):not(:disabled){transform:translateY(-2px);border-color:var(--brand)}
.cal .d:active:not(.future):not(:disabled){transform:scale(.94)}

.cal .d.today{border-color:var(--brand);box-shadow:0 0 0 2px rgba(45,134,199,.25)}
html.dark .cal .d.today{border-color:#4ea3d6;box-shadow:0 0 0 2px rgba(78,163,214,.35)}

.cal .d.done{
  background:var(--card);border-color:#12a880;
  box-shadow:0 2px 8px rgba(18,168,128,.2);
}
html.dark .cal .d.done{
  background:#1f2a3d;border-color:#3cd4aa;
  box-shadow:0 2px 10px rgba(0,0,0,.45);
}
.cal .d.done .cal-thumb{
  position:absolute;inset:0;padding:10%;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.cal .d.done .thumb{width:100%;height:100%}
.cal .d.done .thumb > span.b{background:var(--fill)}
.cal .d.done span.day-num{display:none}

.cal .d.future{opacity:.3;cursor:default;pointer-events:none}
html.dark .cal .d.future{opacity:.22;background:#101726;border-color:#1b2536}

.daily-subtext{font-size:11.5px;letter-spacing:.6px;color:var(--muted);text-align:center;line-height:1.7;margin:18px 6px 0}

.mosaic-link{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  border-radius:18px;border:2px dashed var(--brand);background:#e4f1fb;
  padding:14px 18px;color:var(--text);animation:slide-up .32s ease-out .15s both;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
html.dark .mosaic-link{background:#16253b}
.mosaic-link:hover{transform:translateY(-2px);background:#d5e9f8}
html.dark .mosaic-link:hover{background:#1c314f}
.mosaic-link-ic{
  width:48px;height:48px;flex:0 0 auto;border-radius:12px;
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;
}
.mosaic-link-text{flex:1;min-width:0}
.mosaic-link-text b{display:block;font-size:clamp(14px,2vw,17px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--heading)}
.mosaic-link-text small{display:block;font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:2px}
.mosaic-link-arrow{color:var(--brand);font-size:20px}

.mosaic-wrap{
  flex:1;min-height:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:4px 14px 12px;scrollbar-width:none;
}
.mosaic-wrap::-webkit-scrollbar{display:none}
.mosaic-col{
  width:100%;max-width:400px;margin:0 auto;display:flex;flex-direction:column;
  gap:clamp(6px, 1.3vh, 10px);
}

.mosaic-seg{display:flex;gap:4px;background:var(--card-2);border:2px solid var(--border);border-radius:12px;padding:3px}
.mosaic-seg button{flex:1;height:32px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:all .15s ease}
.mosaic-seg button.on{background:var(--brand);color:#fff;box-shadow:0 3px 8px rgba(45,134,199,.35)}

.mosaic-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;justify-content:center}
.mosaic-tabs::-webkit-scrollbar{display:none}
.mosaic-tab{
  flex:0 0 auto;width:clamp(44px, 5.8vh, 56px);height:clamp(44px, 5.8vh, 56px);
  border-radius:12px;background:var(--card);
  border:2px solid var(--border);position:relative;overflow:hidden;padding:4px;cursor:pointer;
  transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;
}
.mosaic-tab:hover{transform:translateY(-2px)}
.mosaic-tab.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(45,134,199,.3)}
.mosaic-tab.fin::after{content:'';position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:#12a880;box-shadow:0 0 0 2px var(--card)}
.mosaic-tab .thumb{width:100%;height:100%;opacity:.35}
.mosaic-tab.on .thumb{opacity:1}

.mosaic-meta{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.mosaic-meta b{font-size:13.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--heading)}
.mosaic-meta span{font-family:"Roboto Mono",monospace;font-size:11.5px;font-weight:700;color:var(--muted)}

.mosaic-board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);
  border:2px solid var(--border);border-radius:18px;padding:8px;box-shadow:0 8px 24px var(--shadow);
  width:100%;max-width:min(320px, 38vh);aspect-ratio:1/1;margin:0 auto;
}
.mosaic-board.all-fin{
  border-color:#12a880;
  box-shadow:0 0 0 2px rgba(18,168,128,.25), 0 8px 24px var(--shadow);
}
.mcell{
  position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;
  background:var(--card-2);border:2px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;
  touch-action:manipulation;padding:0;
}
.mcell:hover:not(:disabled){transform:scale(1.02);border-color:var(--brand)}
.mcell:active:not(:disabled){transform:scale(.95)}
.mcell.cur{border-color:var(--brand);box-shadow:0 0 0 2px rgba(45,134,199,.35)}
.mcell.cur .q{color:var(--brand)}
.mcell.done{background:var(--card);border-color:#12a880}
html.dark .mcell.done{background:var(--card);border-color:#3cd4aa}
.mcell .cal-thumb{
  position:absolute;inset:0;padding:6%;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.mcell .thumb{width:100%;height:100%}
.mcell .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-size:16px;font-weight:800;color:var(--muted)}
.mcell:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

.mosaic-actions{display:flex;gap:8px}
.mosaic-actions .btn-primary{padding:9px 12px;font-size:14.5px}
.mosaic-actions .btn-ghost{padding:9px 12px;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.full-reveal-art{width:min(260px,65vw);aspect-ratio:1/1;margin:12px auto;border-radius:16px;border:2px solid var(--border);background:var(--card);padding:8px;display:flex;align-items:center;justify-content:center}
.full-reveal-art .thumb{width:100%;height:100%}

/* ============ THUMBNAIL ============ */
.thumb{display:grid;gap:0;width:100%;height:100%}
.thumb > span{position:relative;width:100%;height:100%}
.thumb > span.b{background:var(--fill)}

/* ============ GAME ============ */
.g-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 8px 2px}
.g-head-right{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:99px;padding:5px 11px;font-family:"Roboto Mono",monospace;font-size:clamp(11px,1.4vw,14px);font-weight:600;color:var(--clue);box-shadow:0 1px 3px rgba(30,60,90,.12)}
.chip .ic{font-size:15px;color:var(--muted)}
.chip.bad{color:#ef4444}
.g-title{text-align:center;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 10px 0}
@media(min-width:640px){#gTitleSmall{display:none}}
.board-wrap{flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:8px}
@media(min-width:640px){.board-wrap{padding:16px}}
.board{margin:2px;position:relative;touch-action:none;border:2px solid var(--sep);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:none;display:grid}
.corner{background:var(--clue-bg);border-right:2px solid var(--sep);border-bottom:2px solid var(--sep)}
.cc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:0 3px 4px;background:var(--clue-bg);border-bottom:2px solid var(--sep)}
.rc{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:3px 7px;background:var(--clue-bg);border-right:2px solid var(--sep)}
.cc span,.rc span{font-family:"Roboto Mono",monospace;font-weight:600;color:var(--clue);line-height:1;white-space:nowrap}
.cc span.done,.rc span.done{color:var(--clue-done);text-decoration:line-through}
.cell{position:relative;background:var(--cell);cursor:pointer;touch-action:none}
.cell.lit{background:var(--lit)}
.cell .blk{position:absolute;inset:1px;background:var(--fill);border-radius:1px;animation:pop-in .13s ease-out;pointer-events:none}
@keyframes pop-in{0%{transform:scale(.3);opacity:.4}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.cell.err .blk{background:#ef4444;animation:shake-cell .3s ease-in-out}
@keyframes shake-cell{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}50%{transform:translateX(2px)}75%{transform:translateX(-1px)}}
.cell .xmark{position:absolute;inset:18%;width:64%;height:64%;pointer-events:none}
.cell .xmark path{stroke:var(--xmark);stroke-width:1.6;stroke-linecap:round;animation:x-pop .12s ease-out}
@keyframes x-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.cell.hinted{outline:2px solid #f5b840;outline-offset:-2px;animation:hint-glow .55s ease-in-out 2}
@keyframes hint-glow{0%,100%{box-shadow:0 0 0 0 rgba(245,184,64,0)}50%{box-shadow:0 0 0 3px rgba(245,184,64,.85)}}
.won .cell .blk{animation:none}

.toolbar-outer{display:flex;justify-content:center;padding:6px 12px 16px}
@media(min-width:640px){.toolbar-outer{padding-bottom:24px}}
.toolbar{display:flex;align-items:center;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;border-radius:16px;border:2px solid var(--border);background:var(--card);padding:6px 8px;box-shadow:0 10px 30px var(--shadow)}
.toolbar::-webkit-scrollbar{display:none}
@media(min-width:640px){.toolbar{gap:6px;padding:7px 12px}}
.tbtn{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
@media(min-width:640px){.tbtn{width:48px;height:48px;border-radius:12px;font-size:25px}}
.tbtn:hover{background:var(--card-2)}
html.dark .tbtn:hover{background:rgba(255,255,255,.06)}
.tbtn.active{background:var(--brand);color:#fff;box-shadow:0 3px 8px rgba(45,134,199,.4)}
.tbtn:disabled{opacity:.3;pointer-events:none}
.tbtn.shake{animation:shake-cell .3s ease-in-out}
.tbtn .n{position:absolute;right:-3px;top:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--brand);color:#fff;font-family:"Roboto Mono",monospace;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tdiv{width:1px;height:28px;background:var(--border);margin:0 3px;flex:0 0 auto}

/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(30,41,59,.45);backdrop-filter:blur(2px);animation:fade-in .25s ease-out}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:440px;border-radius:24px;border:2px solid var(--border);background:var(--card);padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.3);animation:modal-pop .3s cubic-bezier(.34,1.56,.64,1);max-height:92vh;overflow:auto;scrollbar-width:thin}
@keyframes modal-pop{0%{transform:scale(.85) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.modal h2{margin:0 0 16px;text-align:center;font-size:24px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--heading)}
.help-step{display:flex;gap:12px;margin-bottom:16px;font-size:14px;color:var(--text);line-height:1.45}
.help-ic{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--brand-tint);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.help-demo{display:flex;justify-content:center;background:var(--card-2);border-radius:12px;padding:12px;margin:0 0 16px}
.help-clue{width:40px;text-align:right;font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700;color:var(--muted);align-self:center}
.help-cell{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.help-cell.on{background:var(--fill);border-color:var(--fill)}
.help-cell .ic{font-size:12px;color:var(--muted)}
.help-note{background:var(--card-2);border-radius:12px;padding:12px;font-family:"Roboto Mono",monospace;font-size:11px;color:var(--muted);line-height:1.6}
.set-row{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.set-row b{display:block;color:var(--heading)}
.set-row small{color:var(--muted);font-size:12px}
.switch{position:relative;width:48px;height:28px;border-radius:99px;background:#c3ceda;flex:0 0 auto;transition:background .2s}
html.dark .switch{background:#3a4a60}
.switch.on{background:var(--brand)}
.switch i{position:absolute;top:3px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch.on i{left:23px}
.btn-danger{width:100%;border-radius:12px;padding:10px;border:2px solid rgba(239,68,68,.35);color:#ef4444;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-top:8px}
.btn-danger:hover{background:rgba(239,68,68,.08)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.square-btn{width:48px;height:48px;flex:0 0 auto;border-radius:12px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.confirm-text{text-align:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.btn-red{flex:1;border-radius:12px;padding:10px;background:#ef4444;color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 3px 0 #b91c1c}

/* win */
.win-modal{max-width:380px;text-align:center}
.win-art{
  width:min(180px,48vw);aspect-ratio:1/1;margin:10px auto 0;
  border-radius:18px;border:2px solid var(--border);background:var(--card);
  padding:10px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 25px rgba(45,90,130,.12);
  animation:win-bounce .5s cubic-bezier(.34,1.56,.64,1) both;
}
.win-art .thumb{width:100%;height:100%;border-radius:4px;overflow:hidden}
@keyframes win-bounce{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.stars{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.star-ic{font-size:36px;color:var(--track)}
.star-ic.on{color:#f5b840;filter:drop-shadow(0 2px 4px rgba(245,184,64,.5));animation:star-pop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes star-pop{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.win-streak{display:inline-flex;align-items:center;gap:6px;background:#ffe9d6;color:#e8801c;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px;margin-top:8px}
html.dark .win-streak{background:rgba(245,146,40,.16)}
.win-best{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.win-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.win-stat{background:var(--card-2);border-radius:12px;padding:10px 4px}
.win-stat .ic{margin:0 auto 4px;font-size:16px;color:var(--muted)}
.win-stat p{margin:0;font-family:"Roboto Mono",monospace;font-weight:700;font-size:14px;color:var(--heading)}

/* scrollbars */
.scroll-thin::-webkit-scrollbar,.levels-wrap::-webkit-scrollbar,.modal::-webkit-scrollbar{width:10px;height:10px}
.scroll-thin::-webkit-scrollbar-thumb,.levels-wrap::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:#a7b8c9;border-radius:99px;border:2px solid transparent;background-clip:content-box}
html.dark .scroll-thin::-webkit-scrollbar-thumb,html.dark .levels-wrap::-webkit-scrollbar-thumb,html.dark .modal::-webkit-scrollbar-thumb{background:#3a4a60;background-clip:content-box;border:2px solid transparent}

  const offX=Math.floor(slX/2)+(slX%2===1&&rng()<.5?1:0),offY=Math.floor(slY/2)+(slY%2===1&&rng()<.5?1:0);
  const out=new Uint8Array(n*n);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(src[(minY+y)*n+minX+x])out[(offY+y)*n+offX+x]=1;
  return out;
}
function fillRatio(g){let c=0;for(const v of g)c+=v;return c/g.length;}
function qualityOk(g,n){
  const r=fillRatio(g);if(r<.3||r>.74)return false;
  const keys=new Set();for(let y=0;y<n;y++)keys.add(Array.from(g.slice(y*n,y*n+n)).join(""));
  if(keys.size<Math.ceil(n*.55))return false;
  let runs=0;
  for(let y=0;y<n;y++){let run=0;for(let x=0;x<n;x++){if(g[y*n+x])run++;else if(run){runs++;run=0;}}if(run)runs++;}

}
function computeClues(g,n){

  for(let y=0;y<n;y++)rows.push(runs(g.slice(y*n,y*n+n)));
  for(let x=0;x<n;x++){const col=[];for(let y=0;y<n;y++)col.push(g[y*n+x]);cols.push(runs(col));}
  return{rows,cols};
}
function hiddenMasks(key,rows,cols){
  const rng=mulberry32(hashString(key+"::hidden"));

    const m=line.map(num=>{if(num===0)return false;if(line.length===1)return rng()<.3;return rng()<.42;});
    if(line.length>1&&m.every(Boolean))m[randInt(rng,0,m.length-1)]=false;

  });

}
const puzzleCache=new Map();
function getPuzzle(mode,size,id){
  const key=mode+"-"+size+"-"+id;

  if(mode!=="daily"&&size===5&&id<PATTERNS_5.length){grid=parsePattern(PATTERNS_5[id]);}
  else{
    const rng=mulberry32(hashString(key+"::art"));let attempt=0;
    do{const raw=pick(rng,GENERATORS)(rng,size);grid=cropAndCenter(raw,size,rng);attempt++;}while(!qualityOk(grid,size)&&attempt<60);

/* ---------------- Big Picture Mosaic Spec & Generators ---------------- */
const BIG_SPECS = [
  { label: "Kaleidoscope", n: 30, blocks: 3, sub: 10 },
  { label: "Mandala", n: 30, blocks: 3, sub: 10 },
  { label: "Snowflake", n: 30, blocks: 3, sub: 10 },
  { label: "Sunburst", n: 45, blocks: 3, sub: 15 },
  { label: "Garden", n: 45, blocks: 3, sub: 15 },
  { label: "Butterfly", n: 45, blocks: 3, sub: 15 }
];

function generateBigArt(idx, n) {
  const g = new Uint8Array(n * n);
  const cx = (n - 1) / 2, cy = (n - 1) / 2;
  const setP = (x, y, v) => {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && x < n && y >= 0 && y < n) g[y * n + x] = (v !== undefined ? v : 1);
  };
  const sym8 = (x, y, v) => {
    setP(cx + x, cy + y, v); setP(cx - x, cy + y, v);
    setP(cx + x, cy - y, v); setP(cx - x, cy - y, v);
    setP(cx + y, cy + x, v); setP(cx - y, cy + x, v);
    setP(cx + y, cy - x, v); setP(cx - y, cy - x, v);
  };
  const sym4 = (x, y, v) => {
    setP(cx + x, cy + y, v); setP(cx - x, cy + y, v);
    setP(cx + x, cy - y, v); setP(cx - x, cy - y, v);
  };
  const symH = (x, y, v) => {
    setP(cx + x, y, v); setP(cx - x, y, v);
  };

  if (idx === 0) {
    // Kaleidoscope (30x30)
    for (let r = 2; r < 14; r += 3) {
      for (let a = 0; a < Math.PI * 2; a += 0.04) {
        if (Math.sin(a * 8) > 0.1) sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
      }
    }
    for (let d = 0; d < 14; d++) {
      sym8(d, d, 1);
      sym8(d, 0, 1);
      if (d > 4) sym8(d, d - 3, 1);
    }
    for (let x = 0; x < 14; x++) {
      for (let y = 0; y < 14; y++) {
        if ((x + y) % 4 === 0 && Math.hypot(x, y) < 13 && Math.hypot(x, y) > 5) sym4(x, y, 1);
      }
    }
    for (let x = 0; x < n; x++) { setP(x, 0, 1); setP(x, n - 1, 1); setP(0, x, 1); setP(n - 1, x, 1); }
  } else if (idx === 1) {
    // Mandala (30x30)
    for (let r = 1; r <= 13; r++) {
      const petals = r % 2 === 0 ? 8 : 12;
      for (let a = 0; a < Math.PI * 2; a += 0.03) {
        if (Math.cos(a * petals) > 0.28) sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
      }
    }
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      for (let d = 2; d < 14; d++) sym4(Math.cos(a) * d, Math.sin(a) * d, 1);
    }
    for (let d = 8; d < 14; d++) {
      sym4(d, 13 - d, 1);
      sym4(d - 1, 13 - d, 1);
    }
  } else if (idx === 2) {
    // Snowflake (30x30)
    for (let d = 0; d < 14; d++) {
      sym8(d, 0, 1);
      sym8(d, d, 1);
      if (d >= 4 && d <= 12 && d % 3 === 0) {
        for (let b = 1; b <= 3; b++) { sym8(d - b, b, 1); sym8(d + b, b, 1); }
      }
      if (d >= 6 && d <= 12 && d % 2 === 0) {
        for (let b = 1; b <= 2; b++) { sym8(d, d - b, 1); sym8(d - b, d, 1); }
      }
    }
    for (let a = 0; a < Math.PI * 2; a += 0.05) {
      const r = 12 + Math.sin(a * 8) * 1.5;
      sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
    }
  } else if (idx === 3) {
    // Sunburst (45x45)
    for (let r = 0; r < 7; r++) {
      for (let a = 0; a < Math.PI * 2; a += 0.05) sym4(Math.cos(a) * r, Math.sin(a) * r, 1);
    }
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 16) {
      for (let d = 8; d < 20; d++) {
        const wave = Math.sin(d * 0.8) * 1.2;
        sym4(Math.cos(a) * d + Math.sin(a) * wave, Math.sin(a) * d - Math.cos(a) * wave, 1);
      }
    }
    for (let a = Math.PI / 32; a < Math.PI * 2; a += Math.PI / 16) {
      for (let d = 9; d < 16; d++) sym4(Math.cos(a) * d, Math.sin(a) * d, 1);
    }
    for (let x = 2; x < n - 2; x++) {
      if (x % 2 === 0) { setP(x, 2, 1); setP(x, n - 3, 1); setP(2, x, 1); setP(n - 3, x, 1); }
    }
  } else if (idx === 4) {
    // Garden (45x45)
    for (let a = 0; a < Math.PI * 2; a += 0.02) {
      const r = 9 + Math.sin(a * 6) * 5;
      for (let d = 0; d < r; d++) {
        if (d > 3 && d < r - 1 && (Math.round(d) % 2 === 0)) continue;
        sym4(Math.cos(a) * d, Math.sin(a) * d, 1);
      }
    }
    for (let corner = 0; corner < 4; corner++) {
      const cx2 = corner % 2 === 0 ? 8 : n - 9;
      const cy2 = corner < 2 ? 8 : n - 9;
      for (let a = 0; a < Math.PI * 2; a += 0.04) {
        const r = 4 + Math.sin(a * 4) * 2.5;
        for (let d = 1; d < r; d++) setP(cx2 + Math.cos(a) * d, cy2 + Math.sin(a) * d, 1);
      }
    }
    for (let x = 4; x < n - 4; x++) {
      if (x % 3 !== 0) { setP(x, 1, 1); setP(x, n - 2, 1); setP(1, x, 1); setP(n - 2, x, 1); }
    }
  } else {
    // Butterfly (45x45)
    for (let y = 8; y <= 36; y++) {
      setP(cx, y, 1);
      if (y > 14 && y < 30) { setP(cx - 1, y, 1); setP(cx + 1, y, 1); }
    }
    setP(cx - 2, 7, 1); setP(cx - 4, 6, 1); setP(cx - 5, 4, 1);
    setP(cx + 2, 7, 1); setP(cx + 4, 6, 1); setP(cx + 5, 4, 1);
    for (let t = 0; t < Math.PI; t += 0.02) {
      const r1 = 16 * Math.sin(t);
      const wx1 = Math.cos(t) * r1 * 1.1;
      const wy1 = 18 - Math.sin(t) * r1 * 0.8;
      symH(wx1, wy1, 1);
      if (t > 0.4 && t < 2.7) {
        const innerR = r1 * 0.65;
        symH(Math.cos(t) * innerR * 1.1, 18 - Math.sin(t) * innerR * 0.8, 1);
      }
      const r2 = 13 * Math.sin(t);
      const wx2 = Math.cos(t) * r2 * 0.9;
      const wy2 = 28 + Math.sin(t) * r2 * 0.7;
      symH(wx2, wy2, 1);
      if (t > 0.5 && t < 2.6) {
        const innerR2 = r2 * 0.6;
        symH(Math.cos(t) * innerR2 * 0.9, 28 + Math.sin(t) * innerR2 * 0.7, 1);
      }
    }
    for (let x = 3; x < 14; x++) {
      symH(x, 16 + (x % 3), 1);
      symH(x, 26 + (x % 3), 1);
    }
  }
  return g;
}

const BIG_CACHE = new Map();
function getBig(idx) {
  if (BIG_CACHE.has(idx)) return BIG_CACHE.get(idx);
  const spec = BIG_SPECS[idx], n = spec.n, sub = spec.sub, b = spec.blocks;
  const g = generateBigArt(idx, n);
  const blocks = [];
  for (let by = 0; by < b; by++) {
    for (let bx = 0; bx < b; bx++) {
      const sg = new Uint8Array(sub * sub);
      for (let y = 0; y < sub; y++) {
        for (let x = 0; x < sub; x++) {
          sg[y * sub + x] = g[(by * sub + y) * n + (bx * sub + x)];
        }
      }
      const clues = computeClues(sg, sub);
      blocks.push({ grid: sg, clues });
    }
  }
  const res = { grid: g, blocks, name: spec.label };
  BIG_CACHE.set(idx, res);
  return res;
}

    } catch (e) {
      return fallback;
    }

    } catch (e) {
      return {};
    }
  },
  write(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
  },

  getSettings() { return this.readObj(this.keys.settings, this.defaultSettings); },
  saveSettings(s) { this.write(this.keys.settings, s); },

function showMosaicPreview(bigIdx,subMode){
  const spec=BIG_SPECS[bigIdx];
  const data=getBig(bigIdx);
  const blocksDone=bigDone(subMode,bigIdx);
  const doneCount=Object.keys(blocksDone).length;
  const isFin=doneCount>=9;

  const n=spec.n,sub=spec.sub,b=spec.blocks;
  const composite=new Uint8Array(n*n);
  for(let by=0;by<b;by++){
    for(let bx=0;bx<b;bx++){
      const blk=by*b+bx;
      if(blocksDone[blk]||isFin){
        for(let y=0;y<sub;y++){
          for(let x=0;x<sub;x++){
            composite[(by*sub+y)*n+(bx*sub+x)]=data.blocks[blk].grid[y*sub+x];
          }
        }
      }
    }
  }

  showModal(
    '<div class="modal">'+
      '<h2>'+(isFin?"Masterpiece Complete!":spec.label)+'</h2>'+
      '<div class="full-reveal-art">'+
        thumbHTML(isFin?data.grid:(doneCount>0?composite:data.grid),spec.n)+
      '</div>'+
      '<div class="win-stats" style="margin:8px 0 14px">'+
        '<div class="win-stat">'+icon("classic")+'<p>'+spec.n+'×'+spec.n+'</p></div>'+

        '<div class="win-stat">'+icon("expert")+'<p>'+(subMode==="expert"?"Expert":"Classic")+'</p></div>'+
      '</div>'+
      '<div class="modal-actions">'+
        '<button class="btn-primary press" style="flex:1" id="mosaicClose">Close</button>'+
      '</div>'+
    '</div>'
  );
  document.getElementById("mosaicClose").onclick=()=>{sound.click();closeModal();};
}

function startMosaicGame(bigIdx,subMode,blockId){

/* ==================================================================

   ================================================================== */
function startGame(mode,size,id,customDate,customOpts){
  closeModal();
  const dateObj=customDate||(mode==="daily"?new Date():null);
  let puzzle;
  if(mode==="mosaic"&&customOpts){
    puzzle={
      key:"mosaic-"+customOpts.subMode+"-"+customOpts.bigIdx+"-"+customOpts.blockId,
      n:size,
      grid:customOpts.grid,
      rows:customOpts.rows,
      cols:customOpts.cols,
      hiddenRows:customOpts.hiddenRows,
      hiddenCols:customOpts.hiddenCols
    };
  }else if(mode==="daily"){
    puzzle=customDate?getDailyPuzzle(customDate):(id!=null?getPuzzle("daily",10,id):getDailyPuzzle());
  }else{
    puzzle=getPuzzle(mode,size,id);
  }
  const n=puzzle.n,total=n*n;
  G.screen={name:"game",mode,size,id,date:dateObj,customOpts};
  refreshStores();

  let cells=new Array(total).fill(0);
  let tool="pen",mistakes=0,hintsUsed=0,elapsed=0;
  let started=false,won=false,hinted=-1;
  const maxHints=n<=5?2:(n<=10?3:4);
  let hintCount=maxHints;
  let errors=new Set(),activeRow=-1,activeCol=-1,zoom=1;
  const history=[],future=[];
  let stroke=null,dead=false;
  const timeouts=[];
  let boardEl=null,cellEls=[],ccEls=[],rcEls=[],viewShadow=[],errView=[],hintView=[],doneRowShadow=[],doneColShadow=[];
  let moveHandler=null,upHandler=null,longTimer=0,timerId=0,ro=null;
  let lastSound=0;

  function later(fn,ms){const t=window.setTimeout(()=>{if(!dead)fn();},ms);timeouts.push(t);return t;}
  function cleanup(){
    dead=true;
    clearInterval(timerId);
    timeouts.forEach(t=>clearTimeout(t));
    if(longTimer)clearTimeout(longTimer);
    if(moveHandler&&boardEl){boardEl.removeEventListener("pointermove",moveHandler);boardEl.removeEventListener("pointerup",upHandler);boardEl.removeEventListener("pointercancel",upHandler);}
    document.removeEventListener("visibilitychange",onVis);
    document.removeEventListener("keydown",onKey);
    if(ro)ro.disconnect();
  }
  G.cleanup=cleanup;

  /* metrics */
  function metrics(){
    const wrap=document.getElementById("boardWrap");
    const kRow=n===5?2.4:n===10?2.9:3.5,kCol=n===5?1.9:n===10?2.7:3.7;
    const isDesktop=window.innerWidth>=640;
    const padX=isDesktop?36:20;
    const padY=isDesktop?36:20;
    const availW=Math.max(180,(wrap?wrap.clientWidth:window.innerWidth)-padX);
    const availH=Math.max(180,(wrap?wrap.clientHeight:window.innerHeight)-padY);
    const base=Math.min(availW/(n+kRow),availH/(n+kCol));
    const cell=Math.max(14,Math.floor(base*zoom));
    const rowW=Math.floor(cell*kRow),colH=Math.floor(cell*kCol);
    const maxRowRuns=Math.max.apply(null,puzzle.rows.map(l=>l.length));
    const maxColRuns=Math.max.apply(null,puzzle.cols.map(l=>l.length));
    const fontRow=Math.max(8,Math.min(cell*.38,rowW/(maxRowRuns*1.05+.2)));
    const fontCol=Math.max(7,Math.min(cell*.36,colH/(maxColRuns*1.12)));
    return{cell,rowW,colH,boardW:rowW+n*cell,boardH:colH+n*cell,fontRow,fontCol};
  }

  let title="";
  if(mode==="daily"){
    title="DAILY · "+dateObj.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  }else if(mode==="mosaic"&&customOpts){
    const spec=BIG_SPECS[customOpts.bigIdx];
    title=spec.label.toUpperCase()+" · PART "+(customOpts.blockId+1)+"/9";
  }else{
    title=mode.toUpperCase()+" · "+size+"×"+size+" · #"+(id+1);
  }

  app.innerHTML=
    '<div class="screen no-select">'+
      '<div class="g-head">'+
        '<button class="back-link press" id="gBack">'+icon("back")+'<span class="g-head-title" style="display:none" id="gTitleLong">'+title+"</span></button>"+
        '<div class="g-head-right">'+
          '<span class="chip">'+icon("clock")+'<span id="gTime">0:00</span></span>'+
          '<span class="chip" id="gMissChip">'+icon("x")+'<span id="gMiss">0</span></span>'+
          '<button class="icon-btn press" id="gHelp" style="width:36px;height:36px;font-size:20px">'+icon("help")+'</button>'+
          '<button class="icon-btn press" id="gSet" style="width:36px;height:36px;font-size:20px">'+icon("gear")+'</button>'+
        "</div></div>"+
      '<div class="g-title" id="gTitleSmall">'+title+"</div>"+
      '<div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>'+
      '<div class="toolbar-outer"><div class="toolbar">'+
        '<button class="tbtn press active" id="tPen" title="Pen (P)">'+icon("pen")+'</button>'+
        '<button class="tbtn press" id="tX" title="X mark (X)">'+icon("x")+'</button>'+
        '<span class="tdiv"></span>'+
        '<button class="tbtn press" id="tUndo" title="Undo (Z)" disabled>'+icon("undo")+'</button>'+
        '<button class="tbtn press" id="tRedo" title="Redo (Y)" disabled>'+icon("redo")+'</button>'+
        '<button class="tbtn press" id="tHint" title="Hint" style="color:#f5b840">'+icon("bulb")+'<span class="n" id="hintN">'+hintCount+'</span></button>'+
        '<span class="tdiv"></span>'+
        '<button class="tbtn press" id="tRestart" title="Restart">'+icon("restart")+'</button>'+
        /* '<button class="tbtn press" id="tOut" title="Zoom out" disabled>'+icon("zoomout")+'</button>'+
        '<button class="tbtn press" id="tIn" title="Zoom in">'+icon("zoomin")+'</button>'+ */
      "</div></div>"+
    "</div>";
  const gTitleLong=document.getElementById("gTitleLong");
  if(window.matchMedia("(min-width:640px)").matches)gTitleLong.style.display="inline";
  else document.getElementById("gTitleSmall").style.display="block";

  /* build board */
  function hair(v){return (v!==0&&v%5===0)?("2px solid var(--sep)"):("1px solid var(--hair)");}
  function buildBoard(){
    const m=metrics();
    boardEl=document.getElementById("board");
    boardEl.style.gridTemplateColumns=m.rowW+"px repeat("+n+","+m.cell+"px)";
    boardEl.style.gridTemplateRows=m.colH+"px repeat("+n+","+m.cell+"px)";
    boardEl.style.width=m.boardW+"px";boardEl.style.height=m.boardH+"px";
    let html='<div class="corner" style="grid-column:1;grid-row:1"></div>';
    ccEls=[];rcEls=[];
    // column clues
    puzzle.cols.forEach((line,x)=>{
      let nums="";
      line.forEach((num,k)=>{const hid=puzzle.hiddenCols&&puzzle.hiddenCols[x][k];nums+='<span class="'+(hid?"hid":"")+'" style="font-size:'+m.fontCol+'px">'+(hid?"?":num)+"</span>";});
      html+='<div class="cc" data-cc="'+x+'" style="grid-column:'+(x+2)+';grid-row:1;border-left:'+hair(x)+'">'+nums+"</div>";
    });
    // row clues
    puzzle.rows.forEach((line,y)=>{
      let nums="";
      line.forEach((num,k)=>{const hid=puzzle.hiddenRows&&puzzle.hiddenRows[y][k];nums+='<span class="'+(hid?"hid":"")+'" style="font-size:'+m.fontRow+'px">'+(hid?"?":num)+"</span>";});
      html+='<div class="rc" data-rc="'+y+'" style="grid-column:1;grid-row:'+(y+2)+';border-top:'+hair(y)+'">'+nums+"</div>";
    });
    cellEls=[];
    for(let i=0;i<total;i++){
      const r=Math.floor(i/n),c=i%n;
      html+='<div class="cell" data-cell="'+i+'" style="grid-column:'+(c+2)+';grid-row:'+(r+2)+';border-top:'+hair(r)+';border-left:'+hair(c)+'"></div>';
    }
    boardEl.innerHTML=html;
    for(let i=0;i<total;i++)cellEls.push(boardEl.querySelector('[data-cell="'+i+'"]'));
    for(let y=0;y<n;y++)rcEls.push(boardEl.querySelector('[data-rc="'+y+'"]'));
    for(let x=0;x<n;x++)ccEls.push(boardEl.querySelector('[data-cc="'+x+'"]'));
    viewShadow=new Array(total).fill(-1);errView=new Array(total).fill(false);hintView=new Array(total).fill(false);
    doneRowShadow=[];doneColShadow=[];
    boardEl.classList.toggle("won",won);
    renderAll();
  }

  function renderCellContent(i){
    const el=cellEls[i],s=cells[i],isErr=errors.has(i);
    let inner="";
    if(s===1)inner='<div class="blk"></div>';
    else if(s===2&&!won)inner='<svg class="xmark" viewBox="0 0 10 10"><path d="M1 1 L9 9 M9 1 L1 9"/></svg>';
    el.innerHTML=inner;
    el.classList.toggle("err",isErr);
    el.classList.toggle("hinted",hinted===i&&s!==2);
    viewShadow[i]=s;errView[i]=isErr;hintView[i]=hinted===i&&s!==2;
  }
  function renderCells(){
    for(let i=0;i<total;i++){
      const isErr=errors.has(i),isHint=hinted===i&&cells[i]!==2;
      if(cells[i]!==viewShadow[i]||isErr!==errView[i]||isHint!==hintView[i])renderCellContent(i);
    }
  }
  function renderHighlight(){
    if(!G.settings.highlight||won){cellEls.forEach(c=>c.classList.remove("lit"));return;}
    for(let i=0;i<total;i++){
      const r=Math.floor(i/n),c=i%n;
      const lit=r===activeRow||c===activeCol;
      cellEls[i].classList.toggle("lit",lit);
    }
  }
  function renderClues(){
    for(let y=0;y<n;y++){
      const solved=lineSolved(cells,puzzle.grid,n,"row",y);
      if(doneRowShadow[y]!==solved){
        doneRowShadow[y]=solved;
        const spans=rcEls[y].querySelectorAll("span:not(.hid)");
        spans.forEach(s=>s.classList.toggle("done",solved));
      }
    }
    for(let x=0;x<n;x++){
      const solved=lineSolved(cells,puzzle.grid,n,"col",x);
      if(doneColShadow[x]!==solved){
        doneColShadow[x]=solved;
        const spans=ccEls[x].querySelectorAll("span:not(.hid)");
        spans.forEach(s=>s.classList.toggle("done",solved));
      }
    }
  }
  function renderAll(){renderCells();renderHighlight();renderClues();
    document.getElementById("gTime").textContent=fmtTime(elapsed);
    const mc=document.getElementById("gMissChip");mc.classList.toggle("bad",mistakes>0);
    document.getElementById("gMiss").textContent=mistakes;
    document.getElementById("tUndo").disabled=history.length===0;
    document.getElementById("tRedo").disabled=future.length===0;
    document.getElementById("hintN").textContent=hintCount;
    /* document.getElementById("tOut").disabled=zoom<=1.001;
    document.getElementById("tIn").disabled=zoom>=maxZoom-.001; */
    document.getElementById("tPen").classList.toggle("active",tool==="pen");
    document.getElementById("tX").classList.toggle("active",tool==="x");
  }
  const maxZoom=n===5?1.4:n===10?1.7:2.1;

  function autoCross(draft){
    if(!G.settings.autoCross)return;
    for(let y=0;y<n;y++){let ok=true;for(let x=0;x<n;x++){const i=y*n+x;if((draft[i]===1)!==(puzzle.grid[i]===1)){ok=false;break;}}if(ok)for(let x=0;x<n;x++)if(draft[y*n+x]===0)draft[y*n+x]=2;}
    for(let x=0;x<n;x++){let ok=true;for(let y=0;y<n;y++){const i=y*n+x;if((draft[i]===1)!==(puzzle.grid[i]===1)){ok=false;break;}}if(ok)for(let y=0;y<n;y++)if(draft[y*n+x]===0)draft[y*n+x]=2;}
  }
  function checkWin(draft){
    for(let i=0;i<total;i++){if(puzzle.grid[i]===1&&draft[i]!==1)return false;if(puzzle.grid[i]===0&&draft[i]===1)return false;}
    handleWin(draft);return true;
  }
  function handleWin(draftArg){
    const draft=draftArg?draftArg.slice():cells.slice();
    for(let i=0;i<total;i++)if(draft[i]===0)draft[i]=2;
    cells=draft;won=true;started=false;
    viewShadow=new Array(total).fill(-1);
    if(boardEl)boardEl.classList.add("won");
    sound.win();
    const stars=mistakes===0&&hintsUsed===0?3:(mistakes<=3&&hintsUsed<=1?2:1);
    const rec={time:elapsed,mistakes,hints:hintsUsed,stars};
    const solved=loadSolved();
    const isFirstTime=!solved[puzzle.key];
    solved[puzzle.key]=1;
    saveSolved(solved);

    if(mode==="mosaic"&&customOpts){
      saveMosaicSection(customOpts.subMode,customOpts.bigIdx,customOpts.blockId,1);
    }
    let streakVal;
    if(mode==="daily"){
      const d=loadDaily(),t=todayKey(dateObj),nowKey=todayKey();
      if(t===nowKey){
        if(d.date!==t){
          const yest=new Date();yest.setDate(yest.getDate()-1);
          const streak=d.date===todayKey(yest)?d.streak+1:1;
          const next={date:t,streak,bestStreak:Math.max(d.bestStreak,streak)};
          saveDaily(next);streakVal=next.streak;
        }else streakVal=d.streak;
      }else{
        streakVal=d.streak;
      }
    }
    renderAll();
    later(()=>showWin(rec,isFirstTime,streakVal),850);
  }

  /* stroke engine */
  function applyCell(idx){
    const st=stroke;if(!st)return;
    const fr=Math.floor(st.lastIdx/n),fc=st.lastIdx%n,tr=Math.floor(idx/n),tc=idx%n;
    const steps=Math.max(Math.abs(tr-fr),Math.abs(tc-fc));const line=[];
    if(steps===0){line.push(idx);}
    else{for(let s=0;s<=steps;s++){const r=Math.round(fr+((tr-fr)*s)/steps),c=Math.round(fc+((tc-fc)*s)/steps);line.push(r*n+c);}}
    st.lastIdx=idx;
    for(const k of line){
      if(st.visited.has(k))continue;
      st.visited.add(k);
      const cur=cells[k];let touched=false;const draft=cells.slice();
      if(st.action==="fill"){
        if(cur!==1){
          if(puzzle.grid[k]===1){
            draft[k]=1;touched=true;
            const now=performance.now();if(now-lastSound>40){sound.fill();lastSound=now;}
          }else{
            draft[k]=1;touched=true;mistakes++;sound.error();errors.add(k);
            setTimeout(()=>{if(cells[k]===1)cells[k]=2;errors.delete(k);renderAll();},380);
          }
        }
      }else if(st.action==="x"){
        if(cur!==2){draft[k]=2;touched=true;sound.cross();}
      }else if(st.action==="unx"){
        if(cur===2){draft[k]=0;touched=true;sound.cross();}
      }else if(st.action==="erase"){
        if(cur!==0){errors.delete(k);draft[k]=0;touched=true;sound.undo();}
      }
      if(touched){cells=draft;renderAll();}
    }
  }

  function finalizeStroke(){
    const st=stroke;stroke=null;activeRow=-1;activeCol=-1;
    moveHandler=null;upHandler=null;
    if(!st)return;
    const draft=cells.slice();
    autoCross(draft);
    cells=draft;
    if(st.before.length){history.push({before:st.before,after:draft.slice()});if(history.length>200)history.shift();future.length=0;}
    renderAll();checkWin(draft);
  }

  function onBoardDown(e){
    if(won||modalOpen())return;
    if(e.button!==0&&e.button!==2)return;
    let t=e.target&&e.target.closest?e.target.closest("[data-cell]"):null;
    if(!t&&e.clientX!=null&&e.clientY!=null){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      t=el?el.closest("[data-cell]"):null;
    }
    if(!t||!boardEl.contains(t))return;
    const idx=Number(t.dataset.cell);if(!isFinite(idx))return;
    e.preventDefault();
    started=true;

    const forcedX=e.button===2,cur=cells[idx];
    let action;
    if(forcedX||tool==="x"){
      action=(cur===2)?"unx":"x";
    }else{
      action=(cur===1)?"erase":"fill";
    }

    activeRow=Math.floor(idx/n);activeCol=idx%n;
    stroke={action,visited:new Set(),before:cells.slice(),lastIdx:idx};
    applyCell(idx);

    try{boardEl.setPointerCapture(e.pointerId);}catch(err){}

    moveHandler=function(ev){
      if(!stroke)return;
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const cell=el?el.closest("[data-cell]"):null;
      if(!cell||!boardEl.contains(cell))return;
      const i=Number(cell.dataset.cell);
      if(isFinite(i)){
        activeRow=Math.floor(i/n);activeCol=i%n;
        applyCell(i);
      }
    };
    upHandler=function(ev){
      boardEl.removeEventListener("pointermove",moveHandler);
      boardEl.removeEventListener("pointerup",upHandler);
      boardEl.removeEventListener("pointercancel",upHandler);
      try{boardEl.releasePointerCapture(e.pointerId);}catch(err){}
      finalizeStroke();
    };
    boardEl.addEventListener("pointermove",moveHandler);
    boardEl.addEventListener("pointerup",upHandler);
    boardEl.addEventListener("pointercancel",upHandler);
  }

  function undo(){
    if(won||modalOpen()||!history.length)return;
    const entry=history.pop();
    future.push(entry);cells=entry.before.slice();sound.undo();renderAll();
  }
  function redo(){
    if(won||modalOpen()||!future.length)return;const entry=future.pop();if(!entry||!entry.after)return;
    history.push(entry);const draft=entry.after.slice();
    for(let i=0;i<total;i++)if(draft[i]===1&&puzzle.grid[i]!==1)draft[i]=2;
    cells=draft;sound.undo();renderAll();
  }
  function useHint(){
    if(won||modalOpen())return;
    if(hintCount<=0){sound.denied();const b=document.getElementById("tHint");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");return;}
    const draft=cells.slice(),fillTargets=[],xTargets=[];
    for(let i=0;i<total;i++){if(puzzle.grid[i]===1&&draft[i]!==1)fillTargets.push(i);if(puzzle.grid[i]===0&&draft[i]===0)xTargets.push(i);}
    let target,toX=false;
    if(fillTargets.length){target=fillTargets[Math.floor(Math.random()*fillTargets.length)];draft[target]=1;}
    else if(xTargets.length){target=xTargets[Math.floor(Math.random()*xTargets.length)];draft[target]=2;toX=true;}
    else return;
    const before=cells.slice();autoCross(draft);history.push({before,after:draft.slice()});future.length=0;
    cells=draft;hintCount--;hintsUsed++;sound.hint();
    hinted=target;later(()=>{if(hinted===target){hinted=-1;renderAll();}},1100);
    if(!toX)lastSound=performance.now();
    renderAll();checkWin(draft);
  }
  function restart(){
    cells=new Array(total).fill(0);history.length=0;future.length=0;
    mistakes=0;hintsUsed=0;elapsed=0;started=false;won=false;errors=new Set();hinted=-1;activeRow=-1;activeCol=-1;
    hintCount=maxHints;
    closeModal();buildBoard();
  }

  function hasMoves(){
    return history.length>0 || mistakes>0 || hintsUsed>0 || cells.some(c=>c!==0);
  }
  function doBack(){
    cleanup();G.cleanup=null;
    if(mode==="daily"){G.screen={name:"daily"};renderDailyScreen();}
    else if(mode==="mosaic"&&customOpts){G.screen={name:"mosaic"};renderMosaicScreen(customOpts.bigIdx,customOpts.subMode);}
    else{G.screen={name:"select",mode,size};renderLevelSelect(mode,size);}
  }

  /* wire controls */
  document.getElementById("gBack").onclick=()=>{
    sound.click();
    if(!won && hasMoves()){
      showLeaveConfirm(doBack);
    } else {
      doBack();
    }
  };
  document.getElementById("gHelp").onclick=()=>{sound.click();showHelp();};
  document.getElementById("gSet").onclick=()=>{sound.click();showSettings();};
  document.getElementById("tPen").onclick=()=>{tool="pen";sound.click();renderAll();};
  document.getElementById("tX").onclick=()=>{tool="x";sound.click();renderAll();};
  document.getElementById("tUndo").onclick=undo;
  document.getElementById("tRedo").onclick=redo;
  document.getElementById("tHint").onclick=useHint;
  document.getElementById("tRestart").onclick=()=>{sound.click();showRestartConfirm(restart);};
  /* document.getElementById("tOut").onclick=()=>{zoom=Math.max(1,+(zoom-.2).toFixed(2));buildBoard();};
  document.getElementById("tIn").onclick=()=>{zoom=Math.min(maxZoom,+(zoom+.2).toFixed(2));buildBoard();}; */

  boardEl=document.getElementById("board");
  boardEl.addEventListener("pointerdown",onBoardDown);
  boardEl.addEventListener("contextmenu",e=>e.preventDefault());

  let resizeT;
  ro=new ResizeObserver(()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(!dead)buildBoard();},60);});
  ro.observe(document.getElementById("boardWrap"));

  /* timer */
  timerId=setInterval(()=>{
    if(started&&!won&&!modalOpen()){elapsed++;document.getElementById("gTime").textContent=fmtTime(elapsed);}
  },1000);
  document.addEventListener("visibilitychange",onVis);
  function onVis(){if(document.hidden)started=false;}

  /* keyboard */
  document.addEventListener("keydown",onKey);
  function onKey(e){
    if(modalOpen()){if(e.key==="Escape")closeModal();return;}
    const k=e.key.toLowerCase();
    if(k==="z"&&!e.ctrlKey&&!e.metaKey){e.preventDefault();undo();}
    else if(k==="y"&&!e.ctrlKey&&!e.metaKey){e.preventDefault();redo();}
    else if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();}
    else if(k==="x"){tool="x";renderAll();}
    else if(k==="p"){tool="pen";renderAll();}
    else if(k==="+"||k==="="){zoom=Math.min(maxZoom,+(zoom+.2).toFixed(2));buildBoard();}
    else if(k==="-"||k==="_"){zoom=Math.max(1,+(zoom-.2).toFixed(2));buildBoard();}
  }

  buildBoard();
  if(!seenHelpSession && Object.keys(G.solved).length === 0){seenHelpSession=true;showHelp();}

  /* win modal */
  function hasNextLevel(){
    if(mode==="mosaic"&&customOpts)return customOpts.blockId<8;
    return mode!=="daily"&&(id<LEVELS_PER_SIZE-1||size!==15);
  }
  function showWin(rec,isBest,streakVal){
    let starsHTML="";for(let s=1;s<=3;s++)starsHTML+='<span class="star-ic '+(s<=rec.stars?"on":"")+'" style="animation-delay:'+(250+s*160)+'ms">'+icon("star")+"</span>";
    let winTitle=mode==="daily"?"Daily Complete!":(mode==="mosaic"?"Section Complete!":"Puzzle Complete!");
    let winSub="";
    if(mode==="mosaic"&&customOpts){
      const spec=BIG_SPECS[customOpts.bigIdx];
      const blocksDone=bigDone(customOpts.subMode,customOpts.bigIdx);
      const isFin=Object.keys(blocksDone).length>=9;
      if(isFin){winTitle="Masterpiece Complete!";winSub=spec.label;}
      else{winSub=spec.label+" · Piece "+(customOpts.blockId+1)+"/9";}
    }else if(mode==="daily"){
      winSub=dateObj.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
    }else{
      winSub=mode.toUpperCase()+" · "+size+"×"+size+" · #"+(id+1);
    }
    const body=
      confettiHTML()+
      '<div class="modal win-modal">'+
        "<h2>"+winTitle+"</h2>"+
        '<div style="font-family:\'Roboto Mono\',monospace;font-size:12px;font-weight:700;color:var(--muted);margin-top:-10px;margin-bottom:8px;text-transform:uppercase">'+winSub+"</div>"+
        '<div class="win-art">'+thumbHTML(puzzle.grid,n)+"</div>"+
        '<div class="stars">'+starsHTML+"</div>"+
        (mode==="daily"&&streakVal>0?'<div class="win-streak">'+icon("flame")+" "+streakVal+" day streak</div>":"")+
        (isBest&&mode!=="daily"?'<div class="win-best">New best time!</div>':"")+
        '<div class="win-stats">'+
          '<div class="win-stat">'+icon("clock")+"<p>"+fmtTime(rec.time)+"</p></div>"+
          '<div class="win-stat">'+icon("x")+"<p>"+rec.mistakes+"</p></div>"+
          '<div class="win-stat">'+icon("bulb")+"<p>"+rec.hints+"</p></div>"+
        "</div>"+
        '<div class="modal-actions">'+
          '<button class="square-btn press" id="wHome">'+icon("home")+'</button>'+
          '<button class="square-btn press" id="wReplay">'+icon("restart")+'</button>'+
          (hasNextLevel()?'<button class="btn-primary press" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px" id="wNext">NEXT '+icon("play")+'</button>':'<button class="btn-primary press" style="flex:1" id="wDone">Done</button>')+
        "</div>"+
      "</div>";
    /* note confetti must be outside the modal overlay */
    modalRoot.innerHTML='<div class="overlay" style="background:rgba(30,41,59,.4)">'+body+'</div>';
    document.getElementById("wHome").onclick=()=>{
      closeModal();cleanup();G.cleanup=null;
      if(mode==="daily"){G.screen={name:"daily"};renderDailyScreen();}
      else if(mode==="mosaic"&&customOpts){G.screen={name:"mosaic"};renderMosaicScreen(customOpts.bigIdx,customOpts.subMode);}
      else{G.screen={name:"select",mode,size};renderLevelSelect(mode,size);}
    };
    document.getElementById("wReplay").onclick=()=>{closeModal();restart();};
    const wn=document.getElementById("wNext");
    if(wn)wn.onclick=()=>{closeModal();nextLevel();};
    const wd=document.getElementById("wDone");
    if(wd)wd.onclick=()=>{
      closeModal();cleanup();G.cleanup=null;
      if(mode==="daily"){G.screen={name:"daily"};renderDailyScreen();}
      else if(mode==="mosaic"&&customOpts){G.screen={name:"mosaic"};renderMosaicScreen(customOpts.bigIdx,customOpts.subMode);}
      else{G.screen={name:"menu"};renderMenu();}
    };
  }
  function nextLevel(){
    cleanup();G.cleanup=null;
    if(mode==="mosaic"&&customOpts){
      startMosaicGame(customOpts.bigIdx,customOpts.subMode,customOpts.blockId+1);
    }else if(id<LEVELS_PER_SIZE-1){
      startGame(mode,size,id+1);
    }else{
      const idx=SIZES.indexOf(size);
      if(idx>=0&&idx<SIZES.length-1)startGame(mode,SIZES[idx+1],0);
      else{G.screen={name:"select",mode,size};renderLevelSelect(mode,size);}
    }
  }
}

/* ==================================================================
   MODALS — help / settings / restart confirm
   ================================================================== */
function showHelp(){
  let demo='<div class="help-clue mono">2 2</div>';
  [1,0,1,0,1].forEach(v=>{demo+='<div class="help-cell '+(v?"on":"")+'">'+(v?"":icon("x"))+"</div>";});
  showModal(
    '<div class="modal"><h2>How To Play</h2>'+
      '<div class="help-step"><div class="help-ic">1</div><p>The numbers are clues — each one counts a run of filled squares in a row or column. Multiple numbers mean multiple runs with gaps between them.</p></div>'+
      '<div class="help-demo" style="display:flex;gap:4px;align-items:center">'+demo+'</div>'+
      '<div class="help-step"><div class="help-ic">'+icon("pen")+'</div><p><b>Tap or drag</b> across the grid to fill squares. Drag from a filled square to erase it.</p></div>'+
      '<div class="help-step"><div class="help-ic">'+icon("x")+'</div><p>Switch to the <b>X tool</b> — or right-click / long-press — to mark squares you know are empty.</p></div>'+
      '<div class="help-step"><div class="help-ic">?</div><p>In <b>Expert Mode</b> some clues are hidden as “?”. Use logic to work them out!</p></div>'+
      '<div class="help-note">Shortcuts: <b>Z</b> undo · <b>Y</b> redo · <b>+ / −</b> zoom · <b>X</b> X-tool · <b>P</b> pen</div>'+
      '<button class="btn-primary press" style="margin-top:18px" id="helpOk">Got It</button>'+
    "</div>"
  );
  document.getElementById("helpOk").onclick=()=>{sound.click();closeModal();};
}
function showSettings(){
  const rows=[
    {key:"dark",label:"Dark Mode",desc:"Easy on the eyes at night"},
    {key:"sound",label:"Sound Effects",desc:"Clicks, pops and victory chimes"},
    {key:"autoCross",label:"Auto X Marks",desc:"Cross out finished lines automatically"},
    {key:"highlight",label:"Highlight Line",desc:"Shade the row & column you drag on"}
  ];
  let body='<div class="modal"><h2>Settings</h2>';
  rows.forEach(r=>{
    body+='<div class="set-row"><div><b>'+r.label+'</b><small style="display:block">'+r.desc+'</small></div>'+
      '<button class="switch '+(G.settings[r.key]?"on":"")+'" data-key="'+r.key+'"><i></i></button></div>';
  });
  body+='<button class="btn-danger press" id="setReset">Reset All Progress</button>'+
    '<button class="btn-primary press" style="margin-top:12px" id="setClose">Close</button></div>';
  showModal(body);
  modalRoot.querySelectorAll(".switch").forEach(sw=>{
    sw.onclick=()=>{
      const key=sw.dataset.key;G.settings[key]=!G.settings[key];saveSettings(G.settings);
      sw.classList.toggle("on",G.settings[key]);
      if(key==="dark"){applyDark();document.querySelectorAll("[data-act=dark]").forEach(b=>b.innerHTML=icon(G.settings.dark?"sun":"moon"));}
      if(key==="sound")sound.enabled=G.settings.sound;
      sound.click();
    };
  });
  document.getElementById("setClose").onclick=()=>{sound.click();closeModal();};
  document.getElementById("setReset").onclick=()=>{
    localStorage.clear();G.settings=Object.assign({},DEFAULT_SETTINGS);saveSettings(G.settings);
    applyDark();sound.enabled=true;
    if(G.cleanup){G.cleanup();G.cleanup=null;}
    refreshStores();closeModal();
    G.screen={name:"menu"};renderMenu();
  };
}
function showRestartConfirm(onConfirm){
  showModal(
    '<div class="modal"><h2>Restart Puzzle?</h2>'+
    '<p class="confirm-text">Your current progress on this puzzle will be lost.</p>'+
    '<div class="modal-actions"><button class="btn-ghost press" id="rcCancel">Cancel</button>'+
    '<button class="btn-red press" id="rcOk">Restart</button></div></div>'
  );
  document.getElementById("rcCancel").onclick=()=>{sound.click();closeModal();};
  document.getElementById("rcOk").onclick=()=>{sound.click();onConfirm();};
}
function showLeaveConfirm(onLeave){
  showModal(
    '<div class="modal"><h2>Leave Puzzle?</h2>'+
    '<p class="confirm-text">Your unfinished progress on this puzzle will be lost.</p>'+
    '<div class="modal-actions"><button class="btn-ghost press" id="lcCancel">Keep Playing</button>'+
    '<button class="btn-red press" id="lcOk">Leave</button></div></div>'
  );
  document.getElementById("lcCancel").onclick=()=>{sound.click();closeModal();};
  document.getElementById("lcOk").onclick=()=>{sound.click();closeModal();onLeave();};
}

/* ==================================================================
   BOOT
   ================================================================== */
applyDark();
sound.enabled=G.settings.sound;
renderMenu();
</script>
</body>
</html>
