<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Car Circle – Roundabout Traffic Timing Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#a8dcf7;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.ol{text-shadow:0 4px 0 #173b63,3px 0 0 #173b63,-3px 0 0 #173b63,0 -3px 0 #173b63,2px 2px 0 #173b63,-2px 2px 0 #173b63,2px -2px 0 #173b63,-2px -2px 0 #173b63}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.screen.show{opacity:1;pointer-events:auto}
.dim{background:rgba(20,45,80,.38)}
button{font-family:inherit;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.btn{border:none;border-radius:24px;color:#fff;font-size:34px;letter-spacing:1px;padding:14px 50px 16px;background:linear-gradient(#86e660,#41b832);box-shadow:0 7px 0 #2b7f22,0 12px 24px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #2b7f22,0 5px 10px rgba(0,0,0,.25)}
.btn.orange{background:linear-gradient(#ffc34d,#ff9318);box-shadow:0 7px 0 #c26208,0 12px 24px rgba(0,0,0,.25)}
.btn.orange:active{box-shadow:0 2px 0 #c26208}
.btn.blue{background:linear-gradient(#5fc6ff,#2a8ff0);box-shadow:0 7px 0 #1a5eab,0 12px 24px rgba(0,0,0,.25);font-size:26px;padding:12px 34px 14px}
.btn.blue:active{box-shadow:0 2px 0 #1a5eab}
.ibtn{width:58px;height:58px;border-radius:18px;border:none;background:#fff;box-shadow:0 5px 0 #b7c7d8,0 8px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s;padding:0}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b7c7d8}
.ibtn svg{width:30px;height:30px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .25s}
#hud.show{opacity:1}
#topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 0}
#timer{pointer-events:none;display:flex;align-items:center;gap:6px;background:#fff;border-radius:30px;padding:6px 16px 6px 8px;box-shadow:0 5px 0 #b7c7d8,0 8px 16px rgba(0,0,0,.18);color:#24456b;font-size:28px;min-width:118px}
#timer svg{width:32px;height:32px}
#timer.low{animation:pulse .5s infinite alternate;background:#ff5a5a;color:#fff;box-shadow:0 5px 0 #b52b2b}
@keyframes pulse{to{transform:scale(1.08)}}
#levelBox{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
#levelTxt{font-size:32px;letter-spacing:1px}
#carsRow{display:flex;gap:3px;background:rgba(23,59,99,.45);padding:5px 9px;border-radius:16px;max-width:62vw;flex-wrap:wrap;justify-content:center}
#carsRow i{display:block;width:16px;height:22px;transition:transform .25s}
#carsRow i svg{width:100%;height:100%}
#carsRow i.done{transform:scale(1.15)}
#pauseBtn{pointer-events:auto}
#hint{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:9;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#hint .hand{font-size:58px;animation:tapA 1s infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
#hint span{font-size:28px}
@keyframes tapA{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(10px) scale(.9)}}
/* menu */
#logo{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;animation:bob 2.4s ease-in-out infinite}
#logo svg{width:150px;height:150px;filter:drop-shadow(0 8px 0 rgba(23,59,99,.35))}
#logo .t1{font-size:78px;line-height:.9;color:#ffd23f;margin-top:-6px}
#logo .t2{font-size:64px;line-height:.95;color:#fff}
@keyframes bob{50%{transform:translateY(-8px)}}
#menuLevel{font-size:26px;background:rgba(23,59,99,.55);padding:6px 20px;border-radius:20px;margin-bottom:22px}
#menuInfo{margin-top:26px;font-size:19px;max-width:300px;text-align:center;opacity:.95}
.corner{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}
/* panels */
.panel{background:#fff;border-radius:30px;padding:56px 34px 30px;box-shadow:0 10px 0 #b7c7d8,0 20px 40px rgba(0,0,0,.3);position:relative;display:flex;flex-direction:column;align-items:center;min-width:290px;color:#24456b;transform:scale(.7);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.screen.show .panel{transform:scale(1)}
.ribbon{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:10px 34px 14px;border-radius:22px;font-size:40px;background:linear-gradient(#5fc6ff,#2a8ff0);box-shadow:0 6px 0 #1a5eab}
.ribbon.red{background:linear-gradient(#ff7a6b,#e8413a);box-shadow:0 6px 0 #a3231d}
.ribbon.green{background:linear-gradient(#86e660,#41b832);box-shadow:0 6px 0 #2b7f22}
.sub{font-size:22px;margin:6px 0 20px;color:#5a7594;text-align:center}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:16px;align-items:center}
#stars{display:flex;gap:6px;margin:4px 0 8px;align-items:flex-end}
#stars svg{width:62px;height:62px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
#stars svg:nth-child(2){width:80px;height:80px}
#stars svg.on{transform:scale(1)}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .22s}
#fade.on{opacity:1}
.float{position:fixed;z-index:12;pointer-events:none;font-size:30px;transform:translate(-50%,-50%);animation:fl 1s ease-out forwards;white-space:nowrap}
.float.perfect{color:#ffd23f;font-size:36px}
.float.close{color:#ff8a3d}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
#flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,80,60,0) 40%,rgba(255,40,30,.45));opacity:0;pointer-events:none;z-index:8;transition:opacity .5s}
#flash.on{opacity:1;transition:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#a8dcf7;z-index:50;font-size:34px;transition:opacity .4s}
@media (max-height:560px){#logo svg{width:100px;height:100px}#logo .t1{font-size:56px}#logo .t2{font-size:46px}#menuInfo{display:none}}
@media (max-width:420px){#levelTxt{font-size:26px}#timer{font-size:24px;min-width:100px}.ibtn{width:50px;height:50px}#carsRow i{width:13px;height:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="loading" class="ol">LOADING…</div>

<div id="hud">
  <div id="topbar">
    <div id="timer"><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="12" fill="#ffd23f" stroke="#24456b" stroke-width="3"/><rect x="13" y="1.5" width="6" height="4" rx="1.5" fill="#24456b"/><path d="M16 10v7l5 3" stroke="#24456b" stroke-width="3" fill="none" stroke-linecap="round"/></svg><span id="timeTxt">0:00</span></div>
    <div id="levelBox"><div id="levelTxt" class="ol">LEVEL 1</div><div id="carsRow"></div></div>
    <button id="pauseBtn" class="ibtn" aria-label="Pause"><svg viewBox="0 0 30 30"><rect x="7" y="5" width="6" height="20" rx="2" fill="#24456b"/><rect x="17" y="5" width="6" height="20" rx="2" fill="#24456b"/></svg></button>
  </div>
</div>
<div id="hint"><div class="hand"><svg viewBox="0 0 48 60" width="54" height="66"><path d="M18 30V9a4 4 0 0 1 8 0v16l2-.5a4 4 0 0 1 4 2.5l.5-.2a4 4 0 0 1 4.8 2.6 4 4 0 0 1 5.2 3.6V44c0 8-6 14-14 14h-3c-5 0-8-2.5-11-7L7 40a4 4 0 0 1 6.4-4.8L18 40z" fill="#fff" stroke="#173b63" stroke-width="3" stroke-linejoin="round"/></svg></div><span class="ol">TAP TO SEND A CAR</span></div>

<div id="menu" class="screen">
  <div id="logo">
    <svg viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="70" fill="#8fd16a" stroke="#fff" stroke-width="6"/>
      <circle cx="80" cy="80" r="50" fill="none" stroke="#5b6270" stroke-width="26"/>
      <circle cx="80" cy="80" r="50" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="7 7"/>
      <circle cx="80" cy="80" r="30" fill="#6cc04a" stroke="#e5484d" stroke-width="4" stroke-dasharray="6 6"/>
      <circle cx="80" cy="80" r="30" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="6 6" stroke-dashoffset="6"/>
      <circle cx="80" cy="80" r="12" fill="#5fc6ff" stroke="#fff" stroke-width="3"/>
      <g transform="rotate(-30 80 80)"><rect x="70" y="21" width="20" height="12" rx="4" fill="#ff4d4d" stroke="#173b63" stroke-width="2"/><rect x="74" y="23" width="7" height="8" rx="1.5" fill="#cfe9ff"/></g>
      <g transform="rotate(110 80 80)"><rect x="70" y="21" width="20" height="12" rx="4" fill="#ffd23f" stroke="#173b63" stroke-width="2"/><rect x="74" y="23" width="7" height="8" rx="1.5" fill="#cfe9ff"/></g>
      <g transform="rotate(220 80 80)"><rect x="70" y="21" width="20" height="12" rx="4" fill="#3fa9f5" stroke="#173b63" stroke-width="2"/><rect x="74" y="23" width="7" height="8" rx="1.5" fill="#cfe9ff"/></g>
    </svg>
    <div class="t1 ol">CAR</div>
    <div class="t2 ol">CIRCLE</div>
  </div>
  <div id="menuLevel" class="ol">LEVEL 1</div>
  <button id="playBtn" class="btn">PLAY</button>
  <div id="menuInfo" class="ol">Tap to send cars into the roundabout.<br/>Find the gap – don't crash!</div>
  <button id="soundBtn1" class="ibtn corner sndBtn" aria-label="Sound"></button>
</div>

<div id="pause" class="screen dim">
  <div class="panel">
    <div class="ribbon ol">PAUSED</div>
    <div class="col" style="margin-top:6px">
      <button id="resumeBtn" class="btn">RESUME</button>
      <div class="row">
        <button id="restartBtn" class="ibtn" aria-label="Restart"><svg viewBox="0 0 30 30"><path d="M23 15a8 8 0 1 1-2.6-5.9" stroke="#24456b" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M17 4.5l5.5 4.5-6 3z" fill="#24456b"/></svg></button>
        <button id="homeBtn1" class="ibtn" aria-label="Home"><svg viewBox="0 0 30 30"><path d="M4 15L15 5l11 10" stroke="#24456b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v12h5v-6h4v6h5V13" fill="#24456b"/></svg></button>
        <button id="soundBtn2" class="ibtn sndBtn" aria-label="Sound"></button>
      </div>
    </div>
  </div>
</div>

<div id="win" class="screen dim">
  <div class="panel">
    <div class="ribbon green ol" id="winTitle">LEVEL 1</div>
    <div style="font-size:40px;color:#41b832;margin-top:-6px">COMPLETE!</div>
    <div id="stars">
      <svg viewBox="0 0 50 50"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" fill="#ffd23f" stroke="#e09a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 50 50"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" fill="#ffd23f" stroke="#e09a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 50 50"><path d="M25 3l6.5 14 15 1.6-11.3 10 3.3 15L25 36l-13.5 7.6 3.3-15L3.5 18.6l15-1.6z" fill="#ffd23f" stroke="#e09a00" stroke-width="3" stroke-linejoin="round"/></svg>
    </div>
    <div class="sub" id="winSub">Time left 0:00</div>
    <div class="row">
      <button id="homeBtn2" class="ibtn" aria-label="Home"><svg viewBox="0 0 30 30"><path d="M4 15L15 5l11 10" stroke="#24456b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v12h5v-6h4v6h5V13" fill="#24456b"/></svg></button>
      <button id="nextBtn" class="btn">NEXT</button>
    </div>
  </div>
</div>

<div id="fail" class="screen dim">
  <div class="panel">
    <div class="ribbon red ol" id="failTitle">CRASH!</div>
    <div class="sub" id="failSub" style="margin-top:4px">Wait for a clear gap!</div>
    <div class="row">
      <button id="homeBtn3" class="ibtn" aria-label="Home"><svg viewBox="0 0 30 30"><path d="M4 15L15 5l11 10" stroke="#24456b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v12h5v-6h4v6h5V13" fill="#24456b"/></svg></button>
      <button id="retryBtn" class="btn orange">RETRY</button>
    </div>
  </div>
</div>
<div id="fade"></div>

<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('loading').textContent='Could not load 3D engine – check your connection.';return;}
THREE.ColorManagement.legacyMode=false;

/* ============================== CONSTANTS ============================== */
const TAU=Math.PI*2;
const R=10;            // ring lane radius
const MOFF=0.42;       // angular offset of merge/exit points from arm axis
const LANE=1.6;        // lane offset from arm centre line
const STOP_Z=14.2;     // queue front car centre (local arm frame)
const Q_SP=2.85;       // queue spacing
const ACC=15;          // launch acceleration
const ARMS=[{phi:Math.PI/2},{phi:0},{phi:-Math.PI/2},{phi:Math.PI}]; // 0 = player (south)
const mod=(a,n)=>((a%n)+n)%n;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let seed=12345;const srand=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const rnd=(a,b)=>a+Math.random()*(b-a);
function rot(x,z,a){const c=Math.cos(a),s=Math.sin(a);return [x*c-z*s,x*s+z*c];}

/* ============================== PATHS ============================== */
function bez(P,t){const u=1-t;const a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;return [a*P[0][0]+b*P[1][0]+c*P[2][0]+d*P[3][0],a*P[0][1]+b*P[1][1]+c*P[2][1]+d*P[3][1]];}
function makePath(ctrl,tail,alpha){
  const pts=[];for(let i=0;i<=56;i++)pts.push(bez(ctrl,i/56));
  if(tail){const l=pts[pts.length-1];const dx=tail[0]-l[0],dz=tail[1]-l[1];const n=Math.ceil(Math.hypot(dx,dz));for(let i=1;i<=n;i++)pts.push([l[0]+dx*i/n,l[1]+dz*i/n]);}
  const n=pts.length,xs=new Float32Array(n),zs=new Float32Array(n),cum=new Float32Array(n),hx=new Float32Array(n),hz=new Float32Array(n);
  for(let i=0;i<n;i++){const p=rot(pts[i][0],pts[i][1],alpha);xs[i]=p[0];zs[i]=p[1];if(i)cum[i]=cum[i-1]+Math.hypot(xs[i]-xs[i-1],zs[i]-zs[i-1]);}
  for(let i=0;i<n;i++){const a=Math.max(0,i-1),b=Math.min(n-1,i+1);const dx=xs[b]-xs[a],dz=zs[b]-zs[a],l=Math.hypot(dx,dz)||1;hx[i]=dx/l;hz[i]=dz/l;}
  return {xs,zs,cum,hx,hz,n,len:cum[n-1]};
}
function sampleP(p,s,o){
  const n=p.n;
  if(s<=0){o.hx=p.hx[0];o.hz=p.hz[0];o.x=p.xs[0]+o.hx*s;o.z=p.zs[0]+o.hz*s;return o;}
  if(s>=p.len){o.hx=p.hx[n-1];o.hz=p.hz[n-1];o.x=p.xs[n-1]+o.hx*(s-p.len);o.z=p.zs[n-1]+o.hz*(s-p.len);return o;}
  let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(p.cum[m]<=s)lo=m;else hi=m;}
  const t=(s-p.cum[lo])/(p.cum[hi]-p.cum[lo]||1);
  o.x=lerp(p.xs[lo],p.xs[hi],t);o.z=lerp(p.zs[lo],p.zs[hi],t);
  let hx=lerp(p.hx[lo],p.hx[hi],t),hz=lerp(p.hz[lo],p.hz[hi],t);const l=Math.hypot(hx,hz)||1;o.hx=hx/l;o.hz=hz/l;return o;
}
ARMS.forEach(A=>{
  const al=A.phi-Math.PI/2;A.alpha=al;
  const te=Math.PI/2-MOFF,P3=[R*Math.cos(te),R*Math.sin(te)],h=[Math.sin(te),-Math.cos(te)];
  A.entry=makePath([[LANE,STOP_Z],[LANE,STOP_Z-2.3],[P3[0]-h[0]*2.6,P3[1]-h[1]*2.6],P3],null,al);
  const tx=Math.PI/2+MOFF,Q0=[R*Math.cos(tx),R*Math.sin(tx)],g=[Math.sin(tx),-Math.cos(tx)];
  A.exit=makePath([Q0,[Q0[0]+g[0]*2.6,Q0[1]+g[1]*2.6],[-LANE,STOP_Z-2.3],[-LANE,STOP_Z]],[-LANE,80],al);
  A.mergeT=A.phi-MOFF;A.exitT=A.phi+MOFF;
  A.stop=rot(LANE,STOP_Z,al);A.out=rot(0,1,al);
});
function timeToMerge(len,v,v0){v0=v0||0;const da=(v*v-v0*v0)/(2*ACC);return len>da?(v-v0)/ACC+(len-da)/v:(Math.sqrt(v0*v0+2*ACC*len)-v0)/ACC;}

/* ============================== RENDERER / SCENE ============================== */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.82;
const scene=new THREE.Scene();
const SKY=new THREE.Color('#a8dcf7');
scene.background=SKY;scene.fog=new THREE.Fog(SKY,75,150);
const camera=new THREE.PerspectiveCamera(40,1,1,300);

// environment map (procedural sky gradient) for believable reflections on paint & glass
(function(){
  const es=new THREE.Scene();const g=new THREE.SphereGeometry(50,32,16);const cols=[];const top=new THREE.Color('#7cc4ff'),hor=new THREE.Color('#ffffff'),bot=new THREE.Color('#5d7e4a');
  const pos=g.attributes.position;for(let i=0;i<pos.count;i++){const y=pos.getY(i)/50;const c=y>0?hor.clone().lerp(top,Math.pow(y,.6)):hor.clone().lerp(bot,Math.min(1,-y*3));cols.push(c.r,c.g,c.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const sun=new THREE.Mesh(new THREE.SphereGeometry(6,12,8),new THREE.MeshBasicMaterial({color:new THREE.Color(8,7.5,6.5)}));sun.position.set(25,35,15);es.add(sun);
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,0.04).texture;pm.dispose();
})();
scene.add(new THREE.HemisphereLight('#dff1ff','#6d8f55',0.35));
const sunL=new THREE.DirectionalLight('#fff1d6',1.9);
sunL.position.set(16,34,12);sunL.castShadow=true;sunL.shadow.mapSize.set(2048,2048);
const sc=sunL.shadow.camera;sc.left=-38;sc.right=38;sc.top=38;sc.bottom=-38;sc.near=5;sc.far=90;sunL.shadow.bias=-0.0006;sunL.shadow.normalBias=0.03;
scene.add(sunL);scene.add(sunL.target);

/* ============================== TEXTURES ============================== */
function ctex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.repeat.set(rx||1,ry||1);return t;}
function noise(g,w,h,n,cols,smin,smax){for(let i=0;i<n;i++){g.fillStyle=cols[(Math.random()*cols.length)|0];const s=smin+Math.random()*(smax-smin);g.fillRect(Math.random()*w,Math.random()*h,s,s);}}

function step(dt){

  const sdt=dt*game.slow;const v=lv.v,w=v/R;
  // queues
  for(let i=0;i<4;i++){const q=armQ[i];for(let k=0;k<q.length;k++){const c=q[k];const tgt=k*Q_SP;
    if(c.q>tgt+0.001){const need=c.q-tgt;const vmax=Math.min(9,Math.sqrt(2*12*need)+0.5);c.qv=Math.min(vmax,c.qv+14*sdt);c.q=Math.max(tgt,c.q-c.qv*sdt);c.acc=0;}else{c.qv=0;c.q=tgt;}

  // NPC arms
  const npcArms=st==='menu'?[0,1,2,3]:[1,2,3];
  if(st==='menu'||st==='play'||st==='win'){
    for(const i of npcArms){armCool[i]-=sdt;const q=armQ[i];
      if(q.length<2&&Math.random()<sdt*0.7)queueSpawn(i,true);
      const f=q[0];if(f&&f.q<0.05&&armCool[i]<=0){
        if(ringLoad()<lv.density&&isSafe(i,f.L)){q.shift();startEnter(f,i);armCool[i]=rnd(0.9,2.6);}else armCool[i]=0.12;}
    }
  }

    else if(c.state==='crashed'){c.x+=c.vx*dt;c.z+=c.vz*dt;const f=Math.exp(-2.6*dt);c.vx*=f;c.vz*=f;c.yaw+=c.spin*dt;c.spin*=Math.exp(-2.2*dt);c.vy-=22*dt;c.y+=c.vy*dt;if(c.y<0){c.y=0;c.vy=Math.abs(c.vy)>1.5?-c.vy*0.3:0;}c.sp=Math.hypot(c.vx,c.vz);

function collide(a,b){
  const dx=a.x-b.x,dz=a.z-b.z,lim=(a.L+b.L)/2+0.4;if(dx*dx+dz*dz>lim*lim)return false;

function syncCars(dt,time){
  const blinkOn=Math.floor(time*3.2)%2===0;
  for(const c of cars){const g=c.v.g;
    let yaw=c.state==='crashed'?c.yaw:Math.atan2(-c.hz,c.hx);
    if(c.lastYaw===null)c.lastYaw=yaw;let dy=yaw-c.lastYaw;dy=mod(dy+Math.PI,TAU)-Math.PI;c.lastYaw=yaw;
    const yr=dt>0?dy/dt:0;

    const tRoll=c.state==='crashed'?0:clamp(yr*c.sp*0.012,-.09,.09);const tPitch=clamp(c.acc*0.006,-.06,.06)+(c.brake&&c.qv>0.5?-0.03:0);
    c.roll=lerp(c.roll,tRoll,Math.min(1,dt*8));c.pitch=lerp(c.pitch,tPitch,Math.min(1,dt*6));
    c.v.body.rotation.x=c.roll;c.v.body.rotation.z=c.pitch;
    c.v.body.position.y=c.state==='queue'&&c.qv<0.1&&c.player&&armQ[0][0]===c?Math.abs(Math.sin(time*28))*0.012:0;
    const dd=c.sp*dt;c.wr-=dd/0.25;for(const w of c.v.wheels)w.rotation.z=c.wr;
    c.v.tail.emissiveIntensity=c.brake?1.6:0.25;
    const bl=(c.state==='ring'&&c.theta-c.exitTheta<1.15)||(c.state==='exit'&&c.s<6);c.v.blink.emissiveIntensity=bl&&blinkOn?2.2:0;
  }
}

function updCamera(dt,time){

  const fx=game.focus?game.focus[0]:0,fz=game.focus?game.focus[1]:0;
  const portrait=camera.aspect<0.8;
  camT.set(lerp(0,fx*0.45,game.camK),0,lerp(portrait?4.5:3.2,fz*0.45+2,game.camK));
  let d=baseDist*lerp(1,0.8,game.camK);
  if(game.state==='menu')d*=1.0+Math.sin(time*0.2)*0.015;
  camera.position.copy(camT).addScaledVector(camDir,d);
  if(game.state==='menu'){const a=Math.sin(time*0.12)*0.08;const p=camera.position.clone().sub(camT);p.applyAxisAngle(new THREE.Vector3(0,1,0),a);camera.position.copy(camT).add(p);}
  if(game.shake>0){game.shake=Math.max(0,game.shake-dt*1.8);const s=game.shake*game.shake*0.9;camera.position.x+=(Math.random()-.5)*s;camera.position.y+=(Math.random()-.5)*s;camera.position.z+=(Math.random()-.5)*s;}
  camera.lookAt(camT);
}

/* ============================== UI ============================== */
const $=id=>document.getElementById(id);
const SCREENS=['menu','pause','win','fail'];
function showOnly(name){SCREENS.forEach(s=>$(s).classList.toggle('show',s===name));$('hud').classList.toggle('show',name==='hud'||name==='pause');}
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
const carIcon=(c)=>`<svg viewBox="0 0 16 22"><rect x="1.5" y="1" width="13" height="20" rx="4.5" fill="${c}" stroke="#173b63" stroke-width="1.6"/><rect x="4" y="5" width="8" height="4.5" rx="1.2" fill="#cfe9ff"/><rect x="4" y="14" width="8" height="3" rx="1" fill="#cfe9ff"/></svg>`;
function buildCarsRow(){const r=$('carsRow');r.innerHTML='';for(let i=0;i<game.lv.queue;i++){const e=document.createElement('i');e.innerHTML=carIcon('#9fb2c6');r.appendChild(e);}}
function updateHUD(){
  $('levelTxt').textContent='LEVEL '+game.lv.n;$('timeTxt').textContent=fmt(game.time);
  $('timer').classList.toggle('low',game.timerOn&&game.time<=5);
  const icons=$('carsRow').children;for(let i=0;i<icons.length;i++){const d=i<game.merged;if(icons[i].classList.contains('done')!==d){icons[i].classList.toggle('done',d);icons[i].innerHTML=carIcon(d?'#44d17a':'#9fb2c6');}}
}
function setHint(on){$('hint').classList.toggle('show',on);}
const vproj=new THREE.Vector3();
function floatText(txt,x,z,cls){vproj.set(x,1.6,z).project(camera);const e=document.createElement('div');e.className='float ol '+cls;e.textContent=txt;e.style.left=((vproj.x+1)/2*innerWidth)+'px';e.style.top=((1-vproj.y)/2*innerHeight)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1050);}
function fadeTo(fn){const f=$('fade');f.classList.add('on');setTimeout(()=>{fn();requestAnimationFrame(()=>f.classList.remove('on'));},230);}
// confetti
const fxc=$('fx'),fxg=fxc.getContext('2d');let conf=[];
function confetti(){const W=fxc.width,H=fxc.height;const cols=['#ff4d4d','#ffd23f','#3fa9f5','#44d17a','#ff6fb5','#a66cff'];
  for(let i=0;i<160;i++){const left=i%2===0;conf.push({x:left?0:W,y:H*0.75,vx:(left?1:-1)*rnd(4,15)*W/900,vy:-rnd(12,24)*H/900,w:rnd(8,16),h:rnd(5,9),r:Math.random()*6,vr:rnd(-.3,.3),c:cols[i%cols.length],life:rnd(2.5,3.5)});}}
function updConfetti(dt){if(!conf.length){return;}const H=fxc.height;fxg.clearRect(0,0,fxc.width,H);
  conf.forEach(p=>{p.vy+=36*dt*H/900;p.vx*=Math.pow(.6,dt);p.vy*=Math.pow(.7,dt);p.x+=p.vx*60*dt;p.y+=p.vy*60*dt*0.5;p.r+=p.vr;p.life-=dt;
    fxg.save();fxg.translate(p.x,p.y);fxg.rotate(p.r);fxg.scale(1,Math.cos(p.r*2));fxg.fillStyle=p.c;fxg.globalAlpha=Math.min(1,p.life);fxg.fillRect(-p.w/2,-p.h/2,p.w,p.h);fxg.restore();});
  conf=conf.filter(p=>p.life>0&&p.y<H+40);if(!conf.length)fxg.clearRect(0,0,fxc.width,H);}

/* ============================== AUDIO (procedural) ============================== */
const Snd={ctx:null,out:null,ambG:null,nb:null,
  init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();
    const comp=this.ctx.createDynamicsCompressor();comp.connect(this.ctx.destination);this.out=this.ctx.createGain();this.out.gain.value=game.sound?0.8:0;this.out.connect(comp);
    const len=this.ctx.sampleRate*2;const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate);const d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){d[i]=Math.random()*2-1;}this.nb=b;
    // brown noise ambience (distant traffic)
    const bb=this.ctx.createBuffer(1,len,this.ctx.sampleRate);const bd=bb.getChannelData(0);for(let i=0;i<len;i++){last=(last+0.02*(Math.random()*2-1))/1.02;bd[i]=last*3.5;}
    const src=this.ctx.createBufferSource();src.buffer=bb;src.loop=true;const lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;this.ambG=this.ctx.createGain();this.ambG.gain.value=0;src.connect(lp);lp.connect(this.ambG);this.ambG.connect(this.out);src.start();this.amb(0.5);},
  setOn(on){if(this.out)this.out.gain.setTargetAtTime(on?0.8:0,this.ctx.currentTime,0.05);},
  amb(v){if(this.ambG)this.ambG.gain.setTargetAtTime(v*0.22,this.ctx.currentTime,0.4);},
  env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);},
  osc(type,f0,f1,t,dur,peak,filt){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);let n=o;if(filt){const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);n=f;}n.connect(g);g.connect(this.out);this.env(g,t,0.01,peak,dur);o.start(t);o.stop(t+dur+0.05);},
  noise(t,dur,peak,type,f0,f1,q){if(!this.ctx)return;const s=this.ctx.createBufferSource();s.buffer=this.nb;const f=this.ctx.createBiquadFilter();f.type=type;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=this.ctx.createGain();s.connect(f);f.connect(g);g.connect(this.out);this.env(g,t,0.005,peak,dur);s.start(t,Math.random());s.stop(t+dur+0.1);},
  rev(){if(!this.ctx)return;const t=this.ctx.currentTime;const o=this.ctx.createOscillator(),o2=this.ctx.createOscillator(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();o.type='sawtooth';o2.type='square';
    o.frequency.setValueAtTime(55,t);o.frequency.exponentialRampToValueAtTime(150,t+0.28);o.frequency.exponentialRampToValueAtTime(95,t+0.6);o2.frequency.setValueAtTime(27.5,t);o2.frequency.exponentialRampToValueAtTime(75,t+0.28);o2.frequency.exponentialRampToValueAtTime(48,t+0.6);
    f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.linearRampToValueAtTime(900,t+0.25);f.frequency.linearRampToValueAtTime(400,t+0.6);o.connect(f);o2.connect(f);f.connect(g);g.connect(this.out);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.04);g.gain.setValueAtTime(0.22,t+0.3);g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);o.start(t);o2.start(t);o.stop(t+0.75);o2.stop(t+0.75);
    this.noise(t,0.15,0.08,'bandpass',2500,800,2);},
  pop(p){if(!this.ctx)return;const t=this.ctx.currentTime;this.osc('sine',620*p,980*p,t,0.12,0.25);this.osc('triangle',1240*p,1600*p,t+0.05,0.12,0.1);},
  whoosh(){if(!this.ctx)return;const t=this.ctx.currentTime;this.noise(t,0.35,0.3,'bandpass',600,3000,3);this.osc('sine',500,700,t,0.15,0.12);},
  crash(){if(!this.ctx)return;const t=this.ctx.currentTime;this.noise(t,0.7,0.9,'lowpass',3000,250,0.7);this.osc('sine',140,38,t,0.4,0.9);
    this.osc('square',1150,980,t+0.01,0.25,0.07,4000);this.osc('square',1730,1500,t+0.02,0.3,0.05,5000);
    for(let i=0;i<6;i++)this.osc('sine',2500+Math.random()*2500,0,t+0.08+Math.random()*0.35,0.12,0.05);this.noise(t+0.05,0.4,0.25,'highpass',4000,0,1);},
  horn(){if(!this.ctx)return;const t=this.ctx.currentTime;[0,0.45].forEach(d=>{this.osc('square',392,0,t+d,0.28,0.06,1600);this.osc('square',494,0,t+d,0.28,0.05,1600);});},
  tick(){if(!this.ctx)return;this.osc('sine',1100,0,this.ctx.currentTime,0.07,0.18);},
  click(){if(!this.ctx)return;const t=this.ctx.currentTime;this.osc('sine',700,1100,t,0.06,0.2);},
  star(i){if(!this.ctx)return;this.osc('triangle',880*Math.pow(1.26,i),0,this.ctx.currentTime,0.25,0.22);},
  win(){if(!this.ctx)return;const t=this.ctx.currentTime;[523,659,784,1047].forEach((f,i)=>{this.osc('triangle',f,0,t+i*0.11,0.3,0.22);this.osc('sine',f*2,0,t+i*0.11,0.2,0.06);});[523,659,784].forEach(f=>this.osc('triangle',f,0,t+0.5,0.8,0.12));},
  fail(){if(!this.ctx)return;const t=this.ctx.currentTime;[392,330,262].forEach((f,i)=>this.osc('triangle',f,f*0.97,t+i*0.16,0.3,0.2));}
};
function sndIcon(){const on=game.sound;document.querySelectorAll('.sndBtn').forEach(b=>b.innerHTML=`<svg viewBox="0 0 30 30"><path d="M4 11h5l7-6v20l-7-6H4z" fill="#24456b"/>${on?'<path d="M20 10a6 6 0 0 1 0 10M23 7a10 10 0 0 1 0 16" stroke="#24456b" stroke-width="2.6" fill="none" stroke-linecap="round"/>':'<path d="M20 11l7 8M27 11l-7 8" stroke="#e8413a" stroke-width="3" stroke-linecap="round"/>'}</svg>`);}

/* ============================== INPUT ============================== */
canvas.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();tap();});
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){Snd.init();if(game.state==='play'){e.preventDefault();tap();}else if(game.state==='menu'&&e.code!=='ArrowUp'){$('playBtn').click();}}
  if(e.code==='Escape'||e.code==='KeyP'){if(game.state==='play')pause();else if(game.state==='paused')resume();}
});
const btn=(id,fn)=>$(id).addEventListener('click',e=>{e.stopPropagation();Snd.init();Snd.click();fn();});
btn('playBtn',()=>fadeTo(()=>{startLevel(game.level);Snd.amb(0.35);}));
btn('pauseBtn',()=>pause());
btn('resumeBtn',()=>resume());
btn('restartBtn',()=>fadeTo(()=>startLevel(game.lv.n)));
btn('retryBtn',()=>fadeTo(()=>startLevel(game.lv.n)));
btn('nextBtn',()=>fadeTo(()=>startLevel(game.level)));
['homeBtn1','homeBtn2','homeBtn3'].forEach(id=>btn(id,()=>fadeTo(startMenu)));
document.querySelectorAll('.sndBtn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();game.sound=!game.sound;localStorage.setItem('cc_sound',game.sound?'1':'0');Snd.init();Snd.setOn(game.sound);sndIcon();Snd.click();}));
function pause(){if(game.state!=='play')return;game.prev='play';game.state='paused';showOnly('pause');setHint(false);Snd.amb(0.1);}
function resume(){if(game.state!=='paused')return;game.state='play';showOnly('hud');if(!game.tapped)setHint(true);Snd.amb(0.35);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

/* ============================== LOOP ============================== */
let last=performance.now(),clock=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
  if(game.state!=='paused'&&game.state!=='loading'){
    const n=dt>0.02?2:1;for(let i=0;i<n;i++)step(dt/n);
    if(game.state==='play'||game.state==='crash'||game.state==='fail')updateHUD();
  }
  if(game.state!=='paused'){syncCars(dt,clock);updParts(dt);
    // fountain
    for(let i=0;i<DROPS;i++){const p=dropPh[i];const t=mod(clock*0.75*p[2]+p[0],1);const r=0.15+t*1.9;const y=2.35+3.0*t-3.9*t*t*1.15;tmpO.position.set(r*Math.cos(p[1]),Math.max(0.75,y),r*Math.sin(p[1]));tmpO.rotation.set(0,0,0);tmpO.scale.setScalar(1-t*0.4);tmpO.updateMatrix();dropIM.setMatrixAt(i,tmpO.matrix);}
    dropIM.instanceMatrix.needsUpdate=true;
    world.userData.water.forEach((w,i)=>{w.material.emissive.setRGB(0.05,0.12,0.2);w.material.emissiveIntensity=0.6+Math.sin(clock*3+i)*0.25;});
  }
  updCamera(dt,clock);updConfetti(dt);
  renderer.render(scene,camera);
}
resize();sndIcon();
game.lv=menuLV;startMenu();
requestAnimationFrame(frame);
const ld=$('loading');ld.style.opacity=0;setTimeout(()=>ld.remove(),450);
})();
</script>
