/* ---------------- easing + tween engine ---------------- */
const Ease={
 linear:t=>t, quadIn:t=>t*t, quadOut:t=>t*(2-t), quadInOut:t=>t<.5?2*t*t:-1+(4-2*t)*t,
 cubicIn:t=>t*t*t, cubicOut:t=>1-Math.pow(1-t,3),
 backOut:t=>{const s=1.70158;t-=1;return t*t*((s+1)*t+s)+1},
 backIn:t=>{const s=1.70158;return t*t*((s+1)*t-s)},
 elasticOut:t=>{if(t<=0)return 0;if(t>=1)return 1;const p=0.45,s=p/4;return Math.pow(2,-10*t)*Math.sin((t-s)*(2*Math.PI)/p)+1},
 bounceOut:t=>{if(t<1/2.75)return 7.5625*t*t;if(t<2/2.75){t-=1.5/2.75;return 7.5625*t*t+.75}if(t<2.5/2.75){t-=2.25/2.75;return 7.5625*t*t+.9375}t-=2.625/2.75;return 7.5625*t*t+.984375}
};
class Tween{
 constructor(obj,group,opts){this.obj=obj;this.g=group;this.steps=[];this.i=0;this.t=0;this.cur=null;this.loop=!!(opts&&opts.loop);this.done=false}
 to(props,dur,ease){this.steps.push({type:'to',props,dur:dur||0,ease:ease||Ease.linear});return this}
 wait(ms){this.steps.push({type:'wait',dur:ms});return this}
 call(fn){this.steps.push({type:'call',fn});return this}
 update(dt){
  if(this.done)return;let rem=dt,guard=0;
  while(rem>=0&&!this.done&&guard++<60){
   if(this.i>=this.steps.length){if(this.loop&&this.steps.length){this.i=0;this.cur=null;continue}this.done=true;return}
   const s=this.steps[this.i];
   if(s.type==='call'){this.i++;this.cur=null;s.fn.call(this.obj,this.obj);continue}
   if(this.cur!==s){this.cur=s;this.t=0;if(s.type==='to'){s.from={};for(const k in s.props)s.from[k]=this.obj[k]}}
   this.t+=rem;rem=-1;
   if(s.type==='to'){const p=s.dur>0?Math.min(1,this.t/s.dur):1,e=s.ease(p);for(const k in s.props)this.obj[k]=s.from[k]+(s.props[k]-s.from[k])*e;if(p>=1){rem=this.t-s.dur;this.i++;this.cur=null}}
   else if(this.t>=s.dur){rem=this.t-s.dur;this.i++;this.cur=null}
  }
 }
}
class TweenGroup{
 constructor(){this.list=[]}
 get(obj,opts){const t=new Tween(obj,this,opts);this.list.push(t);return t}
 remove(obj){for(const t of this.list)if(t.obj===obj)t.done=true;this.list=this.list.filter(t=>!t.done)}
 clear(){for(const t of this.list)t.done=true;this.list=[]}
 update(dt){const l=this.list.slice();for(const t of l)t.update(dt);this.list=this.list.filter(t=>!t.done)}
}

/* ---------------- procedural audio (original equivalents of the reference's sound set) ---------------- */
const Snd={
 ctx:null,on:true,musicVol:1,started:false,
 init(){
  if(this.ctx)return;
  try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const c=this.ctx;
  this.master=c.createGain();this.master.gain.value=this.on?1:0;this.master.connect(c.destination);
  this.sfx=c.createGain();this.sfx.gain.value=0.55;this.sfx.connect(this.master);
  this.mus=c.createGain();this.mus.gain.value=0.26*this.musicVol;this.mus.connect(this.master);
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=buf;
  this.startMusic();
 },
 resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
 setOn(v){this.on=v;if(this.master)this.master.gain.setTargetAtTime(v?1:0,this.ctx.currentTime,0.02)},
 setMusicVolume(v){this.musicVol=v;if(this.mus)this.mus.gain.setTargetAtTime(0.26*v,this.ctx.currentTime,0.1)},
 tone(f,t0,dur,type,vol,dest,slideTo){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(dest||this.sfx);o.start(t0);o.stop(t0+dur+0.02)},
 noiseBurst(t0,dur,vol,f0,f1,q){const c=this.ctx,s=c.createBufferSource();s.buffer=this.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=q||1;bp.frequency.setValueAtTime(f0,t0);if(f1)bp.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(bp);bp.connect(g);g.connect(this.sfx);s.start(t0);s.stop(t0+dur+0.05)},
 play(name){
  if(!this.ctx||!this.on)return;this.resume();const t=this.ctx.currentTime;
  switch(name){
   case 'click':this.tone(880,t,0.05,'square',0.12);this.tone(1320,t+0.03,0.05,'square',0.07);break;
   case 'dices':for(let i=0;i<7;i++){const tt=t+i*0.06+Math.random()*0.02;this.noiseBurst(tt,0.05,0.5,1800+Math.random()*1500,900,2);this.tone(2400+Math.random()*900,tt,0.025,'triangle',0.08)}this.noiseBurst(t+0.46,0.09,0.4,700,300,1.5);break;
   case 'dice_land':this.tone(250,t,0.085,'sine',0.28,null,95);this.noiseBurst(t,0.045,0.19,1100,450,1.1);break;
   case 'step_land':this.tone(190,t,0.09,'sine',0.35,null,70);this.noiseBurst(t,0.04,0.15,900,400,1);break;
   case 'bonus':[523,659,784].forEach((f,i)=>this.tone(f,t+i*0.09,0.16,'triangle',0.3));this.tone(1046,t+0.27,0.3,'triangle',0.28);break;
   case 'malus':[440,370,311].forEach((f,i)=>this.tone(f,t+i*0.12,0.2,'sawtooth',0.14));this.tone(220,t+0.36,0.4,'sawtooth',0.12,null,150);break;
   case 'ladder':{const c=this.ctx,o=c.createOscillator(),g=c.createGain(),v=c.createOscillator(),vg=c.createGain();o.type='triangle';o.frequency.setValueAtTime(330,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.9);v.frequency.value=14;vg.gain.value=18;v.connect(vg);vg.connect(o.frequency);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.05);g.gain.setValueAtTime(0.25,t+0.75);g.gain.exponentialRampToValueAtTime(0.0001,t+1);o.connect(g);g.connect(this.sfx);o.start(t);v.start(t);o.stop(t+1.05);v.stop(t+1.05);for(let i=0;i<8;i++)this.tone(500+i*90,t+i*0.11,0.05,'square',0.05);break}
   case 'snake':this.noiseBurst(t+0.05,0.5,0.25,5000,3500,0.8);break;
   case 'pop':this.tone(420,t,0.12,'sine',0.4,null,1100);this.noiseBurst(t,0.06,0.25,1200,600,1);break;
   case 'eat':this.tone(320,t,0.22,'sine',0.35,null,110);this.tone(140,t+0.2,0.12,'sine',0.3,null,90);this.noiseBurst(t+0.05,0.12,0.2,500,200,1);break;
   case 'chute':this.noiseBurst(t,1.2,0.5,1800,350,1.2);this.tone(900,t,1.1,'sine',0.08,null,250);break;
   case 'game_win':{const seq=[[523,0],[659,0.12],[784,0.24],[1046,0.36],[784,0.6],[1046,0.72]];seq.forEach(([f,d])=>{this.tone(f,t+d,0.28,'square',0.13);this.tone(f/2,t+d,0.28,'triangle',0.16)});this.tone(1318,t+0.95,0.6,'square',0.12);this.tone(1046,t+0.95,0.6,'triangle',0.16);this.tone(659,t+0.95,0.6,'triangle',0.12);break}
   case 'game_over':[392,349,311,262].forEach((f,i)=>{this.tone(f,t+i*0.22,0.3,'sawtooth',0.12);this.tone(f/2,t+i*0.22,0.3,'triangle',0.15)});this.tone(196,t+0.9,0.9,'sawtooth',0.12,null,140);break;
  }
 },
 /* upbeat looping soundtrack: bass + chords + pentatonic lead, 4 bars, 132 bpm */
 startMusic(){
  if(this.started)return;this.started=true;const c=this.ctx;const bpm=132,step=60/bpm/2;// 8th notes
  const chords=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
  const bass=[[130.8,130.8,196,130.8,130.8,130.8,196,164.8],[110,110,164.8,110,110,110,164.8,130.8],[87.3,87.3,130.8,87.3,87.3,87.3,130.8,110],[98,98,146.8,98,98,98,146.8,123.5]];
  const lead=[[523,0,659,784,0,659,587,0],[523,0,440,0,523,659,0,587],[523,0,392,440,523,0,659,587],[494,587,0,784,0,659,587,494],
              [784,0,659,784,880,0,784,659],[523,659,0,523,0,440,523,0],[659,0,523,440,392,0,440,523],[587,0,494,587,784,0,0,0]];
  let bar=0,st=0,next=c.currentTime+0.1;const self=this;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(this.mus);
  function sched(){
   if(!self.ctx)return;
   while(next<c.currentTime+0.25){
    const ch=chords[bar%4];
    // kick / hat
    if(st%2===0)self.tone(120,next,0.11,'sine',0.5,lp,45);
    { const s=c.createBufferSource();s.buffer=self.noise;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;const g=c.createGain();g.gain.setValueAtTime(st%2?0.12:0.05,next);g.gain.exponentialRampToValueAtTime(0.0001,next+0.05);s.connect(hp);hp.connect(g);g.connect(lp);s.start(next);s.stop(next+0.06)}
    if(st===4){self.noiseBurst(next,0.16,0.2,1800,500,0.7)}// snare
    self.tone(bass[bar%4][st],next,step*0.9,'triangle',0.5,lp);
    if(st%4===0)ch.forEach(f=>self.tone(f,next+0.005,step*1.6,'square',0.06,lp));
    const l=lead[bar%8][st];if(l)self.tone(l,next,step*0.85,'square',0.11,lp);
    st++;if(st>=8){st=0;bar++}next+=step;
   }
  }
  this.musTimer=setInterval(sched,60);
 }

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
let Q=1; // cache resolution multiplier (matches the on-screen pixel density)
function mkHi(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w*Q);c.height=Math.ceil(h*Q);c.lw=w;c.lh=h;c.getContext('2d').scale(Q,Q);return c}
function invalidateCaches(){grassTex=null;for(const k in boardCache)delete boardCache[k];msgBoxTex=null;logoTex=null}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(ctx,str,x,y,size,fill,outline,ow,align,base,maxW){
 ctx.font=`${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline=base||'middle';
 ctx.lineJoin='round';
 if(outline){ctx.lineWidth=ow||4;ctx.strokeStyle=outline;ctx.strokeText(str,x,y,maxW)}
 ctx.fillStyle=fill;ctx.fillText(str,x,y,maxW);
}
// multi-line, auto-shrinks like CTLText

/* ---------- premium text / ribbon / star helpers ---------- */
function fancyText(g,str,x,y,size,c1,c2,outline,ow,maxW){
 g.save();g.font=`${size}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
 g.translate(x,y);if(maxW){const w=g.measureText(str).width;if(w>maxW){const k=maxW/w;g.scale(k,k)}}
 g.lineWidth=ow+5;g.strokeStyle='rgba(0,0,0,0.3)';g.strokeText(str,0,size*.09);
 g.lineWidth=ow;g.strokeStyle=outline;g.strokeText(str,0,0);
 const gr=g.createLinearGradient(0,-size*.42,0,size*.42);gr.addColorStop(0,c1);gr.addColorStop(.55,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillText(str,0,0);
 g.restore();
}
function drawRibbon(g,cx,cy,w,col){
 col=col||'#e8402a';const h=58,dk=shade(col,-.4),ol=shade(col,-.65);
 g.save();g.translate(cx,cy);g.lineJoin='round';
 for(const sx of[-1,1]){
  g.fillStyle='rgba(0,0,0,0.25)';g.beginPath();g.moveTo(sx*(w/2-20),-h/2+16);g.lineTo(sx*(w/2+40),-h/2+16);g.lineTo(sx*(w/2+26),16);g.lineTo(sx*(w/2+40),h/2+16);g.lineTo(sx*(w/2-20),h/2+16);g.closePath();g.fill();
  g.fillStyle=dk;g.strokeStyle=ol;g.lineWidth=2.5;g.beginPath();g.moveTo(sx*(w/2-20),-h/2+12);g.lineTo(sx*(w/2+38),-h/2+12);g.lineTo(sx*(w/2+24),12);g.lineTo(sx*(w/2+38),h/2+12);g.lineTo(sx*(w/2-20),h/2+12);g.closePath();g.fill();g.stroke();

/* Centripetal Catmull-Rom spline: perfectly smooth, no cusps, no kinks */
function samplePath(pts,spacing){
 const N=pts.length;
 if(N<2)return pts;
 const pStart=[2*pts[0][0]-pts[1][0], 2*pts[0][1]-pts[1][1]];
 const pEnd=[2*pts[N-1][0]-pts[N-2][0], 2*pts[N-1][1]-pts[N-2][1]];
 const P=[pStart, ...pts, pEnd];
 const out=[];
 let prev=null;
 for(let i=1;i<P.length-2;i++){
  const p0=P[i-1], p1=P[i], p2=P[i+1], p3=P[i+2];
  const tj=(ti,pi,pj)=>ti+Math.hypot(pj[0]-pi[0],pj[1]-pi[1])**0.5;
  const t0=0, t1=tj(t0,p0,p1), t2=tj(t1,p1,p2), t3=tj(t2,p2,p3);
  if(t2<=t1)continue;
  const steps=Math.max(12,Math.round((t2-t1)*8));
  for(let s=0;s<steps;s++){
   const t=t1+(t2-t1)*(s/steps);
   const A1=[(t1-t)/(t1-t0)*p0[0]+(t-t0)/(t1-t0)*p1[0], (t1-t)/(t1-t0)*p0[1]+(t-t0)/(t1-t0)*p1[1]];
   const A2=[(t2-t)/(t2-t1)*p1[0]+(t-t1)/(t2-t1)*p2[0], (t2-t)/(t2-t1)*p1[1]+(t-t1)/(t2-t1)*p2[1]];
   const A3=[(t3-t)/(t3-t2)*p2[0]+(t-t2)/(t3-t2)*p3[0], (t3-t)/(t3-t2)*p2[1]+(t-t2)/(t3-t2)*p3[1]];
   const B1=[(t2-t)/(t2-t0)*A1[0]+(t-t0)/(t2-t0)*A2[0], (t2-t)/(t2-t0)*A1[1]+(t-t0)/(t2-t0)*A2[1]];
   const B2=[(t3-t)/(t3-t1)*A2[0]+(t-t1)/(t3-t1)*A3[0], (t3-t)/(t3-t1)*A2[1]+(t-t1)/(t3-t1)*A3[1]];
   const C=[(t2-t)/(t2-t1)*B1[0]+(t-t1)/(t2-t1)*B2[0], (t2-t)/(t2-t1)*B1[1]+(t-t1)/(t2-t1)*B2[1]];
   if(!prev||Math.hypot(C[0]-prev[0],C[1]-prev[1])>=(spacing||1.5)){
    out.push(C);
    prev=C;
   }
  }
 }
 out.push(pts[N-1]);
 return out;
}

const CHUTE_THEMES={
 16:{body:'#ffad26',light:'#ffbe4d',dark:'#b85200'}, // 16->6 Yellow/Orange
 47:{body:'#ff6292',light:'#ff8eb2',dark:'#b01c4e'}, // 47->26 Pink

 64:{body:'#ffad26',light:'#ffbe4d',dark:'#b85200'}, // 64->60 Yellow/Orange
 87:{body:'#ff6292',light:'#ff8eb2',dark:'#b01c4e'}, // 87->24 Pink

};
const chutePaths={};
function getChutePath(k){return chutePaths[k]||(chutePaths[k]=samplePath(CHUTES_COORDS[k],1.2))}
const chuteNormalsCache={};
function computePathNormals(pts){
 const N=pts.length,raw_n=[],span=4;
 for(let i=0;i<N;i++){
  const p0=pts[Math.max(0,i-span)],p1=pts[Math.min(N-1,i+span)];
  const dx=p1[0]-p0[0],dy=p1[1]-p0[1],L=Math.hypot(dx,dy)||1;
  raw_n.push([-dy/L, dx/L]);
 }
 for(let i=1;i<N;i++){
  if((raw_n[i][0]*raw_n[i-1][0]+raw_n[i][1]*raw_n[i-1][1])<0){
   raw_n[i][0]=-raw_n[i][0];raw_n[i][1]=-raw_n[i][1];
  }
 }
 if(raw_n.length>0&&raw_n[0][1]>0){
  for(let i=0;i<N;i++){raw_n[i][0]=-raw_n[i][0];raw_n[i][1]=-raw_n[i][1];}
 }
 const normals=[];
 for(let i=0;i<N;i++){
  let sx=0, sy=0;
  for(let j=Math.max(0,i-4);j<=Math.min(N-1,i+4);j++){
   sx+=raw_n[j][0]; sy+=raw_n[j][1];
  }
  const L=Math.hypot(sx,sy)||1;
  normals.push([sx/L, sy/L]);
 }
 return normals;
}
function getCachedChuteNormals(k){
 if(chuteNormalsCache[k])return chuteNormalsCache[k];

}

function renderChuteAlongPath(g,pts,theme,r_out,r_in,hasShadow,normals){
 normals=normals||computePathNormals(pts);
 const N=pts.length;
 if(N<2)return;
 r_out=r_out||16.0;
 r_in=r_in||(r_out*0.7);

 const pOutL=[], pInL=[], pInR=[], pOutR=[];
 for(let i=0;i<N;i++){
  const [px,py]=pts[i],[nx,ny]=normals[i];
  pOutL.push([px+nx*r_out, py+ny*r_out]);
  pInL.push([px+nx*r_in, py+ny*r_in]);
  pInR.push([px-nx*r_in, py-ny*r_in]);
  pOutR.push([px-nx*r_out, py-ny*r_out]);
 }

 g.save();
 g.lineCap='round';
 g.lineJoin='round';

 // 1. Ambient Drop Shadow underneath the entire slide
 if(hasShadow!==false){
  g.save();
  g.translate(3,6);
  g.fillStyle='rgba(0,0,0,0.28)';
  g.beginPath();
  g.moveTo(pOutL[0][0],pOutL[0][1]);
  for(let i=1;i<N;i++)g.lineTo(pOutL[i][0],pOutL[i][1]);
  for(let i=N-1;i>=0;i--)g.lineTo(pOutR[i][0],pOutR[i][1]);
  g.closePath();
  g.fill();
  g.restore();
 }

 // 2. Main Sliding Bed (Trough Floor)
 g.fillStyle=theme.body;
 g.beginPath();
 g.moveTo(pOutL[0][0],pOutL[0][1]);
 for(let i=1;i<N;i++)g.lineTo(pOutL[i][0],pOutL[i][1]);
 for(let i=N-1;i>=0;i--)g.lineTo(pOutR[i][0],pOutR[i][1]);
 g.closePath();
 g.fill();

 // 3. Upper Raised Guard Wall
 g.fillStyle=theme.dark;
 g.beginPath();
 g.moveTo(pOutL[0][0],pOutL[0][1]);
 for(let i=1;i<N;i++)g.lineTo(pOutL[i][0],pOutL[i][1]);
 for(let i=N-1;i>=0;i--)g.lineTo(pInL[i][0],pInL[i][1]);
 g.closePath();
 g.fill();

 // 4. Lower Raised Guard Wall
 g.fillStyle=shade(theme.body,-0.18);
 g.beginPath();
 g.moveTo(pInR[0][0],pInR[0][1]);
 for(let i=1;i<N;i++)g.lineTo(pInR[i][0],pInR[i][1]);
 for(let i=N-1;i>=0;i--)g.lineTo(pOutR[i][0],pOutR[i][1]);
 g.closePath();
 g.fill();

 // 5. Inner Wall Drop Shadow onto the Sliding Floor
 g.fillStyle='rgba(0,0,0,0.22)';
 g.beginPath();
 g.moveTo(pInL[0][0],pInL[0][1]);
 for(let i=1;i<N;i++)g.lineTo(pInL[i][0],pInL[i][1]);
 for(let i=N-1;i>=0;i--){
  const [px,py]=pts[i],[nx,ny]=normals[i];
  g.lineTo(px+nx*(r_out*0.25), py+ny*(r_out*0.25));
 }
 g.closePath();
 g.fill();

 // 6. Upper Wall Light Ridge (Highlight catching top edge)
 if(N>4){
  g.strokeStyle='rgba(255,255,255,0.45)';
  g.lineWidth=1.3;
  g.beginPath();
  const p0=[pts[2][0]+normals[2][0]*(r_out*0.89), pts[2][1]+normals[2][1]*(r_out*0.89)];
  g.moveTo(p0[0],p0[1]);
  for(let i=3;i<=N-3;i++){
   g.lineTo(pts[i][0]+normals[i][0]*(r_out*0.89), pts[i][1]+normals[i][1]*(r_out*0.89));
  }
  g.stroke();
 }

 // 7. The 2 Inner Crease Lines
 if(N>5){
  g.strokeStyle='#2b1406';
  g.lineWidth=2.0;

  g.beginPath();
  g.moveTo(pInL[2][0],pInL[2][1]);
  for(let i=3;i<=N-3;i++)g.lineTo(pInL[i][0],pInL[i][1]);
  g.stroke();

  g.beginPath();
  g.moveTo(pInR[2][0],pInR[2][1]);
  for(let i=3;i<=N-3;i++)g.lineTo(pInR[i][0],pInR[i][1]);
  g.stroke();
 }

 // 8. UNIFIED GAPLESS CONTINUOUS OUTER BORDER
 g.beginPath();
 g.moveTo(pOutL[0][0],pOutL[0][1]);
 for(let i=1;i<N;i++)g.lineTo(pOutL[i][0],pOutL[i][1]);
 g.lineTo(pOutR[N-1][0],pOutR[N-1][1]);
 for(let i=N-2;i>=0;i--)g.lineTo(pOutR[i][0],pOutR[i][1]);
 g.closePath();
 g.strokeStyle='#221105';
 g.lineWidth=2.8;
 g.lineJoin='round';
 g.lineCap='round';
 g.stroke();

 g.restore();
}

function drawChute(g,k){

 renderChuteAlongPath(g,pts,theme,16.0,11.2,true,getCachedChuteNormals(k));
}

const SNAKE_COLS=['#e23b2e','#2fa84f','#8a4fd8','#f28c1c','#1f8fe0','#e23b2e','#2fa84f','#e94c9b','#f28c1c','#1f8fe0'];

 const [rx,ry,rz]=rotation,cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry),cz=Math.cos(rz),sz=Math.sin(rz);
 const spin=([a,b,c])=>{let Y=b*cx-c*sx,Z=b*sx+c*cx;let X=a*cy+Z*sy;Z=-a*sy+Z*cy;return[X*cz-Y*sz,X*sz+Y*cz,Z]};
 const project=p=>{const k=size*.5*(1+p[2]*.09);return[x+p[0]*k,y+p[1]*k]};
 const visible=[];
 for(const f of DIE_FACES){const norm=spin(f.n);if(norm[2]<.045)continue;
  const uv=(a,b,lift=0)=>project(spin([f.n[0]*(1+lift)+f.u[0]*a+f.v[0]*b,f.n[1]*(1+lift)+f.u[1]*a+f.v[1]*b,f.n[2]*(1+lift)+f.u[2]*a+f.v[2]*b]));
  visible.push({f,norm,uv})
 }
 visible.sort((a,b)=>a.norm[2]-b.norm[2]);
 g.save();g.lineJoin='round';g.lineCap='round';
 for(const {f,norm,uv} of visible){
  const corners=[uv(-1,-1),uv(1,-1),uv(1,1),uv(-1,1)];
  g.beginPath();g.moveTo(...corners[0]);for(let i=1;i<4;i++)g.lineTo(...corners[i]);g.closePath();
  const lit=.69+.31*norm[2]-.13*Math.max(0,norm[0]);
  const base=Math.round(236*lit+17),edge=Math.round(213*lit+20);
  const fg=g.createLinearGradient(corners[0][0],corners[0][1],corners[2][0],corners[2][1]);
  fg.addColorStop(0,`rgb(${Math.min(255,base+8)},${Math.min(255,base+8)},${Math.min(255,base+13)})`);
  fg.addColorStop(1,`rgb(${edge},${edge},${Math.min(255,edge+9)})`);
  g.fillStyle=fg;g.fill();g.lineWidth=3.4;g.strokeStyle='#a4a6b3';g.stroke();
  g.lineWidth=1.2;g.strokeStyle='rgba(255,255,255,.9)';
  g.beginPath();g.moveTo(...uv(-.89,.84));g.lineTo(...uv(-.89,-.88));g.lineTo(...uv(.86,-.88));g.stroke();
  for(const [px,py] of DIE_PIPS[f.value]){
   const center=uv(px,py,.012),rad=.118;
   g.beginPath();for(let j=0;j<=16;j++){const a=j*Math.PI/8,p=uv(px+Math.cos(a)*rad,py+Math.sin(a)*rad,.016);j?g.lineTo(...p):g.moveTo(...p)}g.closePath();
   g.fillStyle='#171a24';g.fill();g.lineWidth=1;g.strokeStyle='rgba(10,12,22,.25)';g.stroke();
   const gl=uv(px-rad*.31,py-rad*.32,.019);g.fillStyle='rgba(255,255,255,.48)';g.beginPath();g.arc(gl[0],gl[1],Math.max(1.2,size*.015),0,Math.PI*2);g.fill();
  }
 }
 g.restore();
}

/* ---------- glossy UI buttons ---------- */
const BTN={play:'#f6a21c',settings:'#e23b2e',exit:'#f28c1c',help:'#2b7ed8',home:'#2b7ed8',restart:'#f4c21d',check:'#9b4fd8',yes:'#3faf3c',no:'#e23b2e',info:'#9b4fd8',audio:'#f6a21c',fullscreen:'#f6a21c',mode0:'#f6a21c',mode1:'#2fa0e8',skip:'#f6a21c',start:'#f6a21c'};
function glossRect(g,x,y,w,h,r,col){
 g.save();
 g.fillStyle='rgba(0,0,0,0.3)';rr(g,x+2,y+4,w,h,r);g.fill();
 const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,shade(col,.35));gr.addColorStop(.5,col);gr.addColorStop(1,shade(col,-.35));
 g.fillStyle=gr;rr(g,x,y,w,h,r);g.fill();
 g.strokeStyle='rgba(60,20,0,0.65)';g.lineWidth=2.5;rr(g,x,y,w,h,r);g.stroke();
 g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=2;rr(g,x+3,y+3,w-6,h-6,Math.max(2,r-3));g.stroke();
 const gl=g.createLinearGradient(0,y,0,y+h*.5);gl.addColorStop(0,'rgba(255,255,255,0.55)');gl.addColorStop(1,'rgba(255,255,255,0.05)');
 g.fillStyle=gl;rr(g,x+4,y+4,w-8,h*.48,Math.max(2,r-3));g.fill();
 g.restore();
}
const ICONS={
 play(g,s){g.fillStyle='#fff';g.beginPath();g.moveTo(-s*.22,-s*.3);g.lineTo(s*.32,0);g.lineTo(-s*.22,s*.3);g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,0.3)';g.lineWidth=2;g.stroke()},
 x(g,s){g.strokeStyle='#fff';g.lineCap='round';g.lineWidth=s*.17;g.beginPath();g.moveTo(-s*.22,-s*.22);g.lineTo(s*.22,s*.22);g.moveTo(s*.22,-s*.22);g.lineTo(-s*.22,s*.22);g.stroke()},
 gear(g,s){g.fillStyle='#fff';const R=s*.3,r=s*.21;g.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,rad=i%2?R:r;g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}g.closePath();g.fill();g.beginPath();g.arc(0,0,s*.09,0,7);g.fillStyle=BTN.settings;g.fill()},
 help(g,s){text(g,'?',0,s*.02,s*.62,'#fff',null,0)},
 home(g,s){g.fillStyle='#fff';g.beginPath();g.moveTo(0,-s*.32);g.lineTo(s*.34,0);g.lineTo(s*.24,0);g.lineTo(s*.24,s*.28);g.lineTo(-s*.24,s*.28);g.lineTo(-s*.24,0);g.lineTo(-s*.34,0);g.closePath();g.fill();g.fillStyle=BTN.home;g.fillRect(-s*.07,s*.08,s*.14,s*.2)},
 restart(g,s){g.strokeStyle='#fff';g.lineWidth=s*.11;g.lineCap='round';g.beginPath();g.arc(0,0,s*.24,-Math.PI*.3,Math.PI*1.45);g.stroke();g.fillStyle='#fff';g.save();g.rotate(-Math.PI*.3);g.translate(s*.24,0);g.beginPath();g.moveTo(-s*.13,-s*.02);g.lineTo(s*.13,-s*.02);g.lineTo(0,s*.17);g.closePath();g.fill();g.restore()},
 eye(g,s){g.fillStyle='#fff';g.beginPath();g.moveTo(-s*.36,0);g.quadraticCurveTo(0,-s*.4,s*.36,0);g.quadraticCurveTo(0,s*.4,-s*.36,0);g.fill();g.fillStyle=BTN.check;g.beginPath();g.arc(0,0,s*.14,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(s*.04,-s*.05,s*.05,0,7);g.fill()},
 check(g,s){g.strokeStyle='#fff';g.lineCap='round';g.lineJoin='round';g.lineWidth=s*.15;g.beginPath();g.moveTo(-s*.26,0);g.lineTo(-s*.07,s*.2);g.lineTo(s*.28,-s*.22);g.stroke()},
 info(g,s){text(g,'i',0,s*.02,s*.62,'#fff',null,0)},
 audio(g,s,on){g.fillStyle='#fff';g.beginPath();g.moveTo(-s*.3,-s*.12);g.lineTo(-s*.14,-s*.12);g.lineTo(s*.02,-s*.3);g.lineTo(s*.02,s*.3);g.lineTo(-s*.14,s*.12);g.lineTo(-s*.3,s*.12);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=s*.07;g.lineCap='round';if(on){g.beginPath();g.arc(s*.04,0,s*.17,-.9,.9);g.stroke();g.beginPath();g.arc(s*.04,0,s*.3,-.9,.9);g.stroke()}else{g.strokeStyle='#e23b2e';g.lineWidth=s*.11;g.beginPath();g.moveTo(-s*.3,-s*.3);g.lineTo(s*.3,s*.3);g.stroke()}},
 fullscreen(g,s,on){g.strokeStyle='#fff';g.lineWidth=s*.09;g.lineCap='round';g.lineJoin='round';const a=s*.3,b=s*.12;for(const [sx,sy] of[[-1,-1],[1,-1],[1,1],[-1,1]]){g.beginPath();if(!on){g.moveTo(sx*a,sy*b);g.lineTo(sx*a,sy*a);g.lineTo(sx*b,sy*a)}else{g.moveTo(sx*b,sy*a);g.lineTo(sx*b,sy*b);g.lineTo(sx*a,sy*b)}g.stroke()}},
 skip(g,s){g.fillStyle='#fff';g.beginPath();g.moveTo(-s*.3,-s*.25);g.lineTo(s*.05,0);g.lineTo(-s*.3,s*.25);g.closePath();g.fill();g.fillRect(s*.1,-s*.25,s*.1,s*.5)},
 dice(g,s){drawDie3D(g,0,0,s*.55,[.28,-.35,-.18])},
 person(g,s,robot){g.fillStyle='#fff';if(!robot){g.beginPath();g.arc(0,-s*.17,s*.13,0,7);g.fill();g.beginPath();g.moveTo(-s*.25,s*.3);g.quadraticCurveTo(-s*.25,-s*.02,0,-s*.02);g.quadraticCurveTo(s*.25,-s*.02,s*.25,s*.3);g.closePath();g.fill()}else{rr(g,-s*.17,-s*.3,s*.34,s*.26,s*.05);g.fill();g.fillStyle='#2b7ed8';g.fillRect(-s*.11,-s*.23,s*.07,s*.08);g.fillRect(s*.04,-s*.23,s*.07,s*.08);g.fillStyle='#fff';rr(g,-s*.22,s*.02,s*.44,s*.28,s*.05);g.fill();g.fillRect(-s*.02,-s*.38,s*.04,s*.08);g.beginPath();g.arc(0,-s*.4,s*.04,0,7);g.fill()}}
};
function drawIconButton(g,size,col,icon,arg){glossRect(g,-size/2,-size/2,size,size,size*.22,col);if(icon)ICONS[icon](g,size,arg)}

/* ---------- message box (blue striped panel with orange frame) ---------- */
let msgBoxTex=null;
function getMsgBox(){
 if(msgBoxTex)return msgBoxTex;
 const w=619,h=403,c=mkHi(w+20,h+20),g=c.getContext('2d');g.translate(10,10);
 g.fillStyle='rgba(0,0,0,0.35)';rr(g,4,8,w,h,30);g.fill();
 const fr=g.createLinearGradient(0,0,0,h);fr.addColorStop(0,'#ffb347');fr.addColorStop(1,'#e2730f');
 g.fillStyle=fr;rr(g,0,0,w,h,30);g.fill();g.strokeStyle='rgba(80,30,0,0.7)';g.lineWidth=3;rr(g,0,0,w,h,30);g.stroke();
 g.save();rr(g,14,14,w-28,h-28,20);g.clip();
 const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#5fc1f6');bg.addColorStop(1,'#1b86d6');g.fillStyle=bg;g.fillRect(0,0,w,h);
 g.fillStyle='rgba(255,255,255,0.13)';for(let x=-h;x<w+h;x+=56){g.beginPath();g.moveTo(x,0);g.lineTo(x+28,0);g.lineTo(x+28-h,h);g.lineTo(x-h,h);g.closePath();g.fill()}

 g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=2.5;rr(g,14,14,w-28,h-28,20);g.stroke();

let logoTex=null;
function getLogo(){
 if(logoTex)return logoTex;
 const c=mkHi(640,340),g=c.getContext('2d');g.translate(320,170);
 // ribbon
 g.save();g.rotate(-0.04);

 g.strokeStyle='#7a3b08';g.lineWidth=4;rr(g,-275,-125,540,235,40);g.stroke();g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=2.5;rr(g,-266,-116,522,217,32);g.stroke();

 const sd={pts:samplePath([[300,-70],[260,-30],[290,20],[250,70],[300,120]],3),col:'#2fa84f'};renderSnake(g,sd,-1,true);

<script>
/* =====================================================================
   UI FRAMEWORK
   ===================================================================== */
class Widget{
 constructor(o){this.x=0;this.y=0;this.w=60;this.h=60;this.visible=true;this.enabled=true;this.sx=1;this.sy=1;this.alpha=1;this.ax=null;this.ay=null;this.rot=0;this.pressed=false;this.round=true;Object.assign(this,o)}
 get px(){return this.x+(this.ax==='l'?App.offX:this.ax==='r'?-App.offX:0)}
 get py(){return this.y+(this.ay==='b'?-App.offY:this.ay==='t'?App.offY:0)}
 contains(mx,my){const dx=mx-this.px,dy=my-this.py;return Math.abs(dx)<=this.w/2&&Math.abs(dy)<=this.h/2}
 render(g){if(!this.visible)return;const ht=(App.hoverW===this&&this.enabled)?1:0;this.hv=(this.hv||0)+(ht-(this.hv||0))*.22;g.save();g.globalAlpha*=this.alpha;g.translate(this.px,this.py);const p=(this.pressed?.9:1)*(1+.07*this.hv);g.scale(this.sx*p,this.sy*p);g.rotate(this.rot);this.draw(g,this);g.restore()}
 draw(){}
 pulse(){TWUI.remove(this);TWUI.get(this,{loop:true}).to({sx:.9,sy:.9},850,Ease.quadOut).to({sx:1,sy:1},650,Ease.quadIn)}
 stopTweens(){TWUI.remove(this);this.sx=this.sy=1}
}
class Button extends Widget{
 constructor(o){super(o);this.onClick=o.onClick||null;this.silent=!!o.silent}
}
function iconButton(x,y,size,kind,icon,onClick,extra){
 return new Button(Object.assign({x,y,w:size,h:size,kind,icon,onClick,draw(g,b){drawIconButton(g,size,BTN[b.kind],b.icon,b.iconArg)}},extra||{}))
}
class Toggle extends Button{
 constructor(o){super(o);this.active=!!o.active;const oc=o.onToggle;this.onClick=()=>{this.active=!this.active;oc&&oc(this.active)}}
}
function toggleButton(x,y,kind,active,onToggle,extra){
 return new Toggle(Object.assign({x,y,w:60,h:60,kind,active,onToggle,draw(g,b){drawIconButton(g,60,BTN[b.kind],b.kind,b.active)}},extra||{}))
}
class Layer{constructor(o){this.widgets=[];this.modal=false;this.visible=true;this.alpha=1;this.draw=null;this.onDown=null;this.update=null;Object.assign(this,o)}
 add(w){this.widgets.push(w);return w}
 remove(w){this.widgets=this.widgets.filter(x=>x!==w)}
}

const App={
 layers:[],screen:null,offX:0,offY:0,scale:1,cssX:0,cssY:0,audio:true,fullscreen:false,mode:MODE_SNAKES,
 gamesPlayed:0,gamesWon:0,pressedW:null,fade:{a:0},
 pushLayer(o){const l=o instanceof Layer?o:new Layer(o);this.layers.push(l);return l},
 removeLayer(l){this.layers=this.layers.filter(x=>x!==l)},
 setScreen(ctor,...args){TW.clear();TWUI.clear();this.paused=false;this.layers=[];this.pressedW=null;this.screen=null;this.screen=new ctor(...args)},
 fadeIn(ms){this.fade.a=1;TWUI.remove(this.fade);TWUI.get(this.fade).to({a:0},ms||1000)},
 topTarget(x,y){
  for(let i=this.layers.length-1;i>=0;i--){const l=this.layers[i];if(!l.visible)continue;
   for(let j=l.widgets.length-1;j>=0;j--){const w=l.widgets[j];if(w.visible&&w.enabled&&w.contains(x,y))return{layer:l,w}}
   if(l.onDown||l.modal)return{layer:l,w:null};
  }return null;
 },
 down(x,y){const t=this.topTarget(x,y);if(!t)return;if(t.w){t.w.pressed=true;this.pressedW=t.w;t.w.onDown&&t.w.onDown()}else if(t.layer.onDown)t.layer.onDown(x,y)},
 up(x,y){const w=this.pressedW;this.pressedW=null;if(!w)return;w.pressed=false;if(w.contains(x,y)&&w.visible&&w.enabled){if(!w.silent)Snd.play('click');w.onClick&&w.onClick(w)}},
 move(x,y){if(isMobile)return;const t=this.topTarget(x,y);this.hoverW=t&&t.w||null;canvas.style.cursor=this.hoverW?'pointer':'default'},
 load(){try{const p=localStorage.getItem('snakesandladders_gamesplayed'),w=localStorage.getItem('snakesandladders_gameswon');if(p!==null)this.gamesPlayed=+p;if(w!==null)this.gamesWon=+w}catch(e){}},
 save(){try{localStorage.setItem('snakesandladders_gamesplayed',this.gamesPlayed);localStorage.setItem('snakesandladders_gameswon',this.gamesWon)}catch(e){}}
};
function drawBoardBg(g){g.drawImage(getBoard(App.mode),0,0,W,H);if(App.mode===MODE_SNAKES){const now=performance.now();for(let i=0;i<10;i++){const sd=getSnake(i);drawSnakeHead(g,sd,snakeIdleState(sd,now))}}}
function drawTitle(g,str){g.save();g.font=`34px ${FONT}`;const tw=Math.min(500,g.measureText(str).width);g.restore();drawRibbon(g,HW,124,Math.max(330,tw+80));fancyText(g,str,HW,122,34,'#ffffff','#ffe7a0','#6e1408',7,500)}
function dimScreen(g,a){g.fillStyle=`rgba(0,0,0,${a})`;g.fillRect(-W,-H,W*3,H*3)}
function toggleFullscreen(){
 const d=document,el=d.documentElement;
 const isFs=!!(d.fullscreenElement||d.webkitFullscreenElement);
 if(isFs){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const r=el.requestFullscreen||el.webkitRequestFullscreen;r&&r.call(el).catch(()=>{})}
}
const fsAvailable=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)&&!/iPhone|iPod/.test(navigator.userAgent);
function audioToggle(x,y,extra){return toggleButton(x,y,'audio',App.audio,v=>{App.audio=v;Snd.setOn(v)},extra)}

/* =====================================================================
   PRELOADER
   ===================================================================== */
class Preloader{
 constructor(){
  this.p=0;this.ready=false;this.logoA=0;
  const L=App.pushLayer({modal:true,draw:g=>this.draw(g)});
  this.btn=L.add(new Button({x:HW,y:HH+80,w:200,h:76,visible:false,onClick:()=>this.start(),draw(g){glossRect(g,-100,-38,200,76,22,BTN.start);text(g,T.PRELOADER_CONTINUE,0,2,42,'#fff','#7a3b08',5)}}));
  // warm up caches while the bar fills
  const tasks=[()=>getGrass(),()=>getMsgBox(),()=>getLogo(),()=>getBoard(0),()=>getBoard(1),()=>{for(let i=0;i<10;i++)getSnake(i)},()=>getBoard(0)];
  let i=0;const step=()=>{if(i<tasks.length){tasks[i++]();this.p=Math.round(i/(tasks.length+1)*100);setTimeout(step,40)}else{this.fontReady().then(()=>{this.p=100;this.ready=true;this.btn.visible=true;this.btn.pulse()})}};
  setTimeout(step,80);
  TWUI.get(this).to({logoA:1},500);
 }
 fontReady(){if(!document.fonts)return Promise.resolve();return Promise.race([document.fonts.load(`40px "Lilita One"`).then(()=>document.fonts.ready),new Promise(r=>setTimeout(r,2500))])}
 start(){Snd.init();Snd.resume();App.setScreen(Menu)}
 draw(g){
  {const bg=g.createRadialGradient(HW,HH-60,40,HW,HH,820);bg.addColorStop(0,'#4fa334');bg.addColorStop(1,'#123d0c');g.fillStyle=bg;g.fillRect(0,0,W,H)}
  g.save();g.globalAlpha=this.logoA;const l=getLogo();g.drawImage(l,HW-l.lw/2*.6,HH-100-l.lh/2*.6,l.lw*.6,l.lh*.6);g.restore();
  if(!this.ready){const bw=300,bh=22,bx=HW-bw/2,by=HH+130;g.fillStyle='#222';rr(g,bx,by,bw,bh,11);g.fill();g.fillStyle='#f6a21c';rr(g,bx,by,Math.max(22,bw*this.p/100),bh,11);g.fill();g.strokeStyle='#fff';g.lineWidth=2;rr(g,bx,by,bw,bh,11);g.stroke();text(g,this.p+'%',HW,HH+180,30,'#fff')}
 }
}

/* =====================================================================
   MENU
   ===================================================================== */
class Menu{
 constructor(){
  Snd.setMusicVolume(1);
  this.logo={y:-500,s:1};
  const L=App.pushLayer({draw:g=>this.draw(g)});
  this.play=L.add(iconButton(HW,H-120,142,'play','play',()=>App.setScreen(ModeChoose),{ay:'b'}));this.play.pulse();
  L.add(audioToggle(W-41,41,{ax:'r'}));
  L.add(iconButton(41,41,60,'info','info',()=>new CreditsPanel(),{ax:'l'}));

  TWUI.get(this.logo).to({y:HH-100},500,Ease.linear);
  TWUI.get(this.logo,{loop:true}).to({s:1.1},850,Ease.quadOut).to({s:1},650,Ease.quadIn);
  App.load();App.fadeIn(1000);
 }
 draw(g){
  g.drawImage(getGrass(),0,0,W,H);
  const now=performance.now()/1000,cy=HH-100;
  g.save();g.translate(HW,cy);g.rotate(now*.07);g.globalCompositeOperation='lighter';
  for(let i=0;i<18;i++){g.rotate(Math.PI*2/18);g.fillStyle=i%2?'rgba(255,240,170,0.07)':'rgba(255,240,170,0.03)';g.beginPath();g.moveTo(0,0);g.arc(0,0,1000,-0.09,0.09);g.closePath();g.fill()}
  g.restore();
  {const rg=g.createRadialGradient(HW,cy,30,HW,cy,460);rg.addColorStop(0,'rgba(255,246,190,0.42)');rg.addColorStop(1,'rgba(255,246,190,0)');g.fillStyle=rg;g.fillRect(0,0,W,H)}
  const bob=k=>Math.sin(now*1.7+k)*9;

<script>
/* =====================================================================
   GAME
   ===================================================================== */
class Player{
 constructor(idx,ci,game){this.idx=idx;this.ci=ci;this.g=game;this.reset()}
 reset(){const z=ZERO_SQUARE_POSITIONS[this.idx];this.pos=0;this.x=z[0];this.y=z[1];this.hop=0;this.scale=1;this.shA=1;this.shVisible=true;this.visible=true;this.flip=false;this.anim='idle';this.animT=Math.random()*3;this.arrow=false;this.curve=null;this.curveI=0;this.curveAcc=0;this.eaten=false}
}
class Dice{
 constructor(game){this.g=game;this.state='hidden';this.t=0;this.value=1;this.alpha=1;this.x=1080;this.y=480;this.h=0;this.angles=[.28,-.35,-.18];this.duration=1120;this.contacts=0}
 fitToView(){
  if(this.layoutX===App.offX&&this.layoutY===App.offY)return;
  this.layoutX=App.offX;this.layoutY=App.offY;
  const right=W-App.offX-20;
  this.targetX=Math.min(1100,right-85);this.targetY=H-App.offY-173;
  this.startX=Math.min(right-60,this.targetX+55);this.startY=H-App.offY-83;
  if(this.state==='shown'){this.x=this.targetX;this.y=this.targetY}
 }
 show(){
  TW.remove(this);this.g.r=false;this.value=1+irnd(6);this.state='anim';this.t=0;this.alpha=1;this.contacts=0;
  this.layoutX=null;this.fitToView();
  this.x=this.startX;this.y=this.startY;this.h=0;
  const [rx,ry]=DIE_FINAL[this.value];
  this.end=[rx+.22,ry-.26,.13];
  this.begin=[this.end[0]-Math.PI*4.8,this.end[1]+Math.PI*3.6,this.end[2]-Math.PI*3.7];
  this.angles=this.begin.slice();Snd.play('dices');
 }
 update(dt){
  if(this.state!=='anim')return;this.fitToView();
  this.t=Math.min(this.duration,this.t+dt);const u=this.t/this.duration;
  if(u<.52){const p=u/.52;this.x=lerp(this.startX,this.targetX-25,Ease.quadOut(p));this.y=lerp(this.startY,this.targetY+5,p);this.h=115*Math.sin(Math.PI*p)}
  else if(u<.77){const p=(u-.52)/.25;this.x=lerp(this.targetX-25,this.targetX+8,p);this.y=lerp(this.targetY+5,this.targetY,p);this.h=33*Math.sin(Math.PI*p)}
  else{const p=(u-.77)/.23;this.x=lerp(this.targetX+8,this.targetX,Ease.quadOut(p));this.y=this.targetY;this.h=9*Math.sin(Math.PI*p)}
  const spin=1-Math.pow(1-u,2.35);
  this.angles=this.begin.map((a,i)=>lerp(a,this.end[i],spin));
  if(u>=.52&&this.contacts<1){this.contacts=1;Snd.play('dice_land')}
  if(u>=.77&&this.contacts<2){this.contacts=2;Snd.play('dice_land')}
  if(u>=1){this.x=this.targetX;this.y=this.targetY;this.h=0;this.angles=this.end.slice();this.state='shown';this.g.onDiceEnd(this.value)}
 }
 fadeOut(){if(this.state==='hidden')return;TW.remove(this);TW.get(this).to({alpha:0},200).call(()=>this.hide())}
 hide(){this.state='hidden'}
 draw(g){
  if(this.state==='hidden')return;this.fitToView();g.save();g.globalAlpha=this.alpha;
  const px=clamp(this.x,App.offX+64,W-App.offX-64);
  const ground=this.y+44,sh=1-clamp(this.h/180,0,.7);
  const shadow=g.createRadialGradient(px,ground,2,px,ground,54*sh);
  shadow.addColorStop(0,`rgba(20,33,10,${.34*sh})`);shadow.addColorStop(1,'rgba(20,33,10,0)');
  g.fillStyle=shadow;g.beginPath();g.ellipse(px,ground,54*sh,21*sh,0,0,Math.PI*2);g.fill();
  if(this.state==='anim'&&this.contacts){const p=this.contacts===1?this.t/this.duration-.52:this.t/this.duration-.77;if(p<.07){g.strokeStyle=`rgba(255,255,255,${.55*(1-p/.07)})`;g.lineWidth=2;g.beginPath();g.ellipse(px,ground,14+p*260,5+p*80,0,0,Math.PI*2);g.stroke()}}
  drawDie3D(g,px,this.y-this.h,62,this.angles);
  g.restore();
 }
}
class Game{
 constructor(num,chosen,vs,colours){
  this.f=num;this.v=vs;this.mode=App.mode;this.p=0;
  if(vs===HUMAN_VS_CPU){const a=shuffle([0,1,2,3,4,5]);a.splice(a.indexOf(chosen),1);this.p=irnd(num);a.splice(this.p,0,chosen);colours=a.slice(0,num)}
  this.players=colours.map((ci,i)=>new Player(i,ci,this));
  this.resetVariables();this.msgs=[];this.snakeAnim=null;this.cpuTimer=null;this.fx=[];this.shake=0;this.rings=[];this.sparks=[];
  this.dice=new Dice(this);
  this.main=App.pushLayer({draw:g=>this.draw(g),onDown:()=>false});
  this.ui=new Interface(this);
  Snd.setMusicVolume(SOUNDTRACK_VOLUME_IN_GAME);
  App.fadeIn(600);
  new HelpPanel(this,()=>{this.z=true;this.r=true;this.turnShown=false});
 }
 resetVariables(){this.z=false;this.r=false;this.q=0;this.u=0;this.t=0;this.turnShown=false;this.specialPending=false;this.specialTimer=0;this.specialFn=null;this.chuteFollow=false;this.paused=false}
 pause(v){this.paused=v;App.paused=v}
 onExit(){Snd.setMusicVolume(1);App.setScreen(Menu)}
 sq(n){return BOARD_SQUARES[n]}
 /* ---- turn flow ---- */
 checkForNextTurn(){
  const P=this.players[this.t];
  if(this.v===HUMAN_VS_CPU&&this.t!==this.p){P.arrow=false;this.ui.enableDice(false);this.cpuTimer=delay(550,()=>{this.cpuTimer=null;if(this.z&&this.r)this.dice.show()})}
  else{P.arrow=true;this.ui.enableDice(true)}
  this.ui.setTurn(this.t);
 }
 launchDices(){if(this.v===HUMAN_VS_CPU&&this.t!==this.p)return;if(!this.ui.diceEnabled||!this.r||!this.z)return;this.dice.show();this.ui.enableDice(false)}
 onDiceEnd(v){this.u=v;this.movePlayer(v)}
 movePlayer(n){this.q=n;this.players[this.t].arrow=false;this.playerAdvance(this.t,this.q)}
 checkToFlip(a){if(this.mode===MODE_SNAKES)return;const P=this.players[a],row=Math.floor((P.pos-1)/10);P.flip=P.pos>0&&row%2===1}
 playerAdvance(a,b){
  const P=this.players[a];P.pos++;
  if(b===0){this.playerArrived(a);return}
  const [cx,cy]=this.sq(P.pos);this.checkToFlip(a);let ease;
  if(this.mode===MODE_SNAKES){ease=Ease.quadIn;TW.get(P).to({hop:-20},150,Ease.quadIn).to({hop:0},150,Ease.quadIn);TW.get(P).to({shA:.5},150,Ease.quadIn).to({shA:1},150,Ease.quadIn)}
  else{ease=Ease.linear;P.anim='walk'}
  TW.get(P).to({x:cx,y:cy},300,ease).call(()=>{Snd.play('step_land');this.rings.push({x:cx,y:cy,t:0});this.checkFinalSquare(a,b-1)});
 }
 checkFinalSquare(a,b){
  const pos=this.players[a].pos;
  if(PERFECT_SCORE){if(pos>=LAST_SQUARE&&b>0)this.playerBack(a,b);else this.playerAdvance(a,b)}
  else{if(pos===LAST_SQUARE)this.onWin(a);else this.playerAdvance(a,b)}
 }
 playerBack(a,b){
  const P=this.players[a];P.pos--;
  if(b===0){if(this.mode===MODE_CHUTES)P.anim='idle';P.pos++;this.checkForSpecialSquares(a);return}
  this.checkToFlip(a);const [cx,cy]=this.sq(P.pos);
  TW.get(P).to({x:cx,y:cy},100,Ease.quadIn).call(()=>this.playerBack(a,b-1));
 }
 playerArrived(a){const P=this.players[a];if(this.mode===MODE_CHUTES)P.anim='idle';P.pos--;this.checkToFlip(a);this.checkForSpecialSquares(a)}
 checkForAnotherPlayer(sq,a){let c=0;for(const P of this.players)if(P.pos===sq)c++;if(c>1&&sq>0){const off=c%2===0?5*Math.floor(c/2):-5*Math.floor(c/2);const [x,y]=this.sq(sq);TW.get(this.players[a]).to({x:x+off,y:y+off},150)}}
 checkForSpecialSquares(a){
  const P=this.players[a],pos=P.pos;this.checkForAnotherPlayer(pos,a);
  if(pos===LAST_SQUARE){this.onWin(a);return}
  this.specialPending=true;this.specialTimer=0;
  if(OBSTACLES_SQUARES.includes(pos)){Snd.play('malus');this.showMsg(MSG_BAD);this.specialFn=()=>this.startObstacleAnimation(pos,a)}
  else if(LADDERS_SQUARES.includes(pos)){Snd.play('bonus');this.showMsg(MSG_GOOD);this.specialFn=()=>this.ladderSquare(a)}
  else this.specialFn=()=>this.changeTurn();
 }
 startObstacleAnimation(sq,a){
  const idx=OBSTACLES_SQUARES.indexOf(sq),P=this.players[a];
  if(this.mode===MODE_SNAKES){
   P.shVisible=false;P.eaten=true;this.snakeAnim={idx,t:0,dur:EAT_END+90,player:a};
   const [hx,hy]=snakeMouthPos(getSnake(idx));
   // pawn is lifted and sucked between the open jaws, then the mouth snaps shut
   TW.get(P).wait(90).to({hop:-16,scale:.85},170,Ease.quadOut).to({hop:-2,x:hx,y:hy+8,scale:.3},EAT_CHOMP-260,Ease.quadIn).call(()=>{P.visible=false});
   delay(EAT_CHOMP,()=>{Snd.play('eat');this.shake=5});
   delay(EAT_END,()=>this.obstacleAnimationOver(a,idx));
  }else{
   P.anim='slide';const path=getChutePath(sq);Snd.play('chute');
   TW.get(P).to({x:path[0][0],y:path[0][1]},150,Ease.quadIn).call(()=>{P.curve=path;P.curveI=0;P.curveAcc=0;this.chuteFollow=true});
  }
 }
 obstacleAnimationOver(a,idx){
  const dest=OBSTACLES_MOVEMENT_SQUARES[idx][1],P=this.players[a],[x,y]=this.sq(dest);
  if(this.mode===MODE_SNAKES){
   Snd.play('pop');Snd.play('snake');const tp=getSnake(idx).pts;const tl=tp[tp.length-1];
   P.x=x;P.y=y;P.hop=0;P.scale=0;P.eaten=false;P.visible=true;P.shVisible=true;
   TW.get(P).to({scale:1.25},170,Ease.quadOut).to({scale:1},260,Ease.backOut);
   TW.get(P).to({hop:-16},170,Ease.quadOut).to({hop:0},300,Ease.bounceOut);
   this.puff(tl[0],tl[1]);
  }
  else TW.get(P).to({x,y},100,Ease.quadIn).call(()=>{P.anim='idle'});
  P.pos=dest+1;this.playerArrived(a);
 }
 ladderSquare(a){
  const P=this.players[a];for(const [from,to] of LADDER_MOVEMENT_SQUARES)if(P.pos===from){const [x,y]=this.sq(to);Snd.play('ladder');P.sparkle=true;if(this.mode===MODE_CHUTES)P.anim='walk';TW.get(P).to({x,y},LADDERS_SPEED,Ease.cubicOut).call(()=>{P.sparkle=false;this.rings.push({x,y,t:0});P.pos=to+1;this.playerArrived(a)})}
 }
 changeTurn(){
  this.dice.fadeOut();
  if(this.u!==6){this.t=(this.t+1)%this.f;this.r=true;this.turnShown=false}
  else{Snd.play('bonus');this.showMsg(MSG_DICE,()=>{if(this.z)this.dice.show()})}
 }
 showMsg(kind,onEnd){
  let str;if(kind===MSG_DICE)str=T.EXTRA_DICE;else str=(kind===MSG_GOOD?T.GOOD:T.BAD)[irnd(5)];
  const m={str,kind,s:.55,x:kind===MSG_DICE?HW:0,y:kind===MSG_DICE?-100:HH};TW.get(m).to({s:1},760,Ease.backOut);const ex=kind===MSG_DICE?[HW,H+300]:[W+300,HH];
  this.msgs.push(m);
  TW.get(m).to({x:HW,y:HH},700,Ease.cubicIn).wait(700).to({x:ex[0],y:ex[1]},350,Ease.cubicOut).call(()=>{this.msgs=this.msgs.filter(q=>q!==m);onEnd&&onEnd()});
 }
 onWin(a){
  this.z=false;for(const P of this.players)P.arrow=false;this.ui.enableDice(false);
  App.gamesPlayed++;
  const won=this.v===HUMAN_VS_CPU?a===this.p:true;
  if(won)App.gamesWon++;App.save();
  if(this.mode===MODE_CHUTES)for(const P of this.players)P.anim='idle';
  Snd.play(won?'game_win':'game_over');
  this.end=new EndPanel(this,won);
 }
 puff(x,y){for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,sp=rnd(40,95);this.fx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.45-12,r:rnd(3.5,7),t:0,max:rnd(380,650)})}}
 restartGame(){
  TW.clear();this.dice.hide();this.msgs=[];this.snakeAnim=null;this.fx=[];this.shake=0;this.rings=[];this.sparks=[];for(const P of this.players)P.sparkle=false;this.resetVariables();
  for(const P of this.players)P.reset();this.z=true;this.r=true;this.ui.setTurn(0);
 }
 /* ---- per-frame ---- */
 update(dt){
