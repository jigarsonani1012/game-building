<!DOCTYPE html>
<html lang="en">
<head>

  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3a4e8c;font-family:'Fredoka','Arial Rounded MT Bold','Nunito',Arial,sans-serif;}

<body>
<canvas id="game" tabindex="0" aria-label="Blocky Blast Puzzle game"></canvas>
<script>
(function(){
'use strict';
/* ============================================================
   BLOCKY BLAST PUZZLE — single-file reconstruction
   Canvas 2D, procedural sprites, procedural audio, no assets.
   ============================================================ */

// ---------- constants / layout (design space 720x1280) ----------
var DW=720, DH=1280;
var GRID=8, P=78, CELL=70, GAP=P-CELL, PAD=20;
var BOARD_W=GRID*P-GAP+PAD*2;           // 656
var BOARD_X=(DW-BOARD_W)/2;             // 32
var BOARD_Y=190;
var CX=BOARD_X+PAD, CY=BOARD_Y+PAD;     // cell origin
var BOARD_B=BOARD_Y+BOARD_W;            // 846
var TRAY_Y=1085, TRAY_SCALE=0.46, SLOT_W=218;
var SKIP_BTN={x:40,y:BOARD_B+22,w:124,h:62};
var SAVE_SLOT={x:DW-40-92,y:BOARD_B+14,w:92,h:92};
var LEVEL_COUNT=40;
var FONT="'Fredoka','Arial Rounded MT Bold','Nunito',Arial,sans-serif";

// ---------- utils ----------
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOutCubic(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3);}
function easeOutBack(t){t=clamp(t,0,1);var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function easeInCubic(t){t=clamp(t,0,1);return t*t*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(function(v){v=clamp(Math.round(v),0,255);return (v<16?'0':'')+v.toString(16);}).join('');}
function shade(hex,amt){var c=hexToRgb(hex);var t=amt>0?255:0;var a=Math.abs(amt);return rgbToHex(c[0]+(t-c[0])*a,c[1]+(t-c[1])*a,c[2]+(t-c[2])*a);}
function rgba(hex,a){var c=hexToRgb(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fmt(n){return Math.round(n).toLocaleString('en-US');}

// ---------- persistence ----------
var SAVE_KEY='blocky_blast_puzzle_v1';
var data=(function(){try{var d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&typeof d==='object')return d;}catch(e){}return null;})()||{};
var defaults={best:0,totalScore:0,totalBlocks:0,adv:0,theme:'standard',sound:true,music:true,vibe:true,run:null,games:0};
for(var k in defaults)if(!(k in data))data[k]=defaults[k];
var saveTimer=null;
function persist(){if(saveTimer)return;saveTimer=setTimeout(function(){saveTimer=null;try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}},80);}

// ---------- themes ----------
var PAL_STD={yellow:'#ffc43a',orange:'#ff8a2b',red:'#f0483f',pink:'#f45fae',purple:'#b14ff0',blue:'#3f86f2',cyan:'#31d3ee',green:'#46d14a'};
var PAL_NEON={yellow:'#fff23a',orange:'#ff9a1f',red:'#ff3355',pink:'#ff4fd8',purple:'#c04bff',blue:'#3a8bff',cyan:'#19f5ff',green:'#3dff6b'};
var PAL_WHITE={yellow:'#f7c541',orange:'#f99a52',red:'#f26b6b',pink:'#f48cc2',purple:'#b58af2',blue:'#6aa0f5',cyan:'#5fd0e8',green:'#6fd470'};
var PAL_PINK={yellow:'#ffd04a',orange:'#ff8d3f',red:'#ff5a6b',pink:'#ff7ad0',purple:'#c566ff',blue:'#5b9cff',cyan:'#4fe3ff',green:'#62e36a'};
var THEMES={
  standard:{name:'Standard',bg:['#4059a0','#33457f'],board:'#23294d',cell:'#2b325a',text:'#ffffff',dim:'#aab4e0',panel:'#2c3566',panelEdge:'#1a2048',hud:'#303e6a',slot:'#191f43',track:'#182849',fill:'#f0be55',pal:PAL_STD,glow:false,dark:false},
  pink:{name:'Pink',bg:['#f27db5','#d94f93'],board:'#5a1f49',cell:'#6a2a58',text:'#ffffff',dim:'#ffd4ea',panel:'#6e2a5c',panelEdge:'#4a1740',hud:'#7a3568',slot:'#471538',track:'#3f1233',fill:'#ffd34d',pal:PAL_PINK,glow:false,dark:false},
  lightblue:{name:'Light Blue',bg:['#7cc4f5','#55a3e6'],board:'#1d4470',cell:'#25507f',text:'#ffffff',dim:'#d6ecff',panel:'#2a5588',panelEdge:'#173a60',hud:'#2f5d92',slot:'#153356',track:'#133052',fill:'#ffd34d',pal:PAL_STD,glow:false,dark:false},
  pinkblue:{name:'Pink-Blue',bg:['#f06aa8','#4a7fe0'],board:'#2a2552',cell:'#352f66',text:'#ffffff',dim:'#e4d9ff',panel:'#38316e',panelEdge:'#221d4a',hud:'#433b7c',slot:'#1e1a44',track:'#1c1940',fill:'#ffd34d',pal:PAL_STD,glow:false,dark:false},
  neon:{name:'Neon',bg:['#120f2a','#07060f'],board:'#15132c',cell:'#1e1b3b',text:'#ffffff',dim:'#9a93c8',panel:'#1b1838',panelEdge:'#0d0b1f',hud:'#26224a',slot:'#0f0d22',track:'#0f0d22',fill:'#19f5ff',pal:PAL_NEON,glow:true,dark:false},
  white:{name:'White',bg:['#f6f7fb','#e6e9f2'],board:'#d9dde9',cell:'#ffffff',text:'#2b3358',dim:'#6b7599',panel:'#ffffff',panelEdge:'#c9cfdf',hud:'#e3e7f1',slot:'#c7cde0',track:'#cfd5e4',fill:'#f0b429',pal:PAL_WHITE,glow:false,dark:true}
};
var THEME_ORDER=['standard','pink','lightblue','pinkblue','neon','white'];
var theme=THEMES[data.theme]||THEMES.standard;
function setTheme(id){theme=THEMES[id]||THEMES.standard;data.theme=id;persist();document.body.style.background=theme.bg[1];spriteCache={};}
document.body.style.background=theme.bg[1];
var GEM={red:{dark:'#8e0c28',mid:'#ee2b4e',light:'#ff95aa'},blue:{dark:'#0c3a94',mid:'#2d7bf0',light:'#9ccdff'}};
var TAN='#e6c48d', GREY='#6f7488';

// ---------- shapes ----------
function parseRows(rows){var c=[];rows.forEach(function(r,y){for(var x=0;x<r.length;x++)if(r[x]==='#')c.push([y,x]);});return c;}
function normCells(c){var mr=1e9,mc=1e9;c.forEach(function(p){mr=Math.min(mr,p[0]);mc=Math.min(mc,p[1]);});return c.map(function(p){return [p[0]-mr,p[1]-mc];}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});}
function rotCells(c){var h=0;c.forEach(function(p){h=Math.max(h,p[0]);});h++;return normCells(c.map(function(p){return [p[1],h-1-p[0]];}));}
function cellKey(c){return c.map(function(p){return p.join(',');}).join(';');}
var FAMILIES=[
  {name:'dot',rows:['#'],col:'yellow',w:2.2},
  {name:'line2',rows:['##'],col:'pink',w:3},
  {name:'line3',rows:['###'],col:'orange',w:3},
  {name:'line4',rows:['####'],col:'cyan',w:2.4},
  {name:'line5',rows:['#####'],col:'red',w:1.5},
  {name:'sq2',rows:['##','##'],col:'green',w:3},
  {name:'sq3',rows:['###','###','###'],col:'blue',w:0.9},
  {name:'rect23',rows:['###','###'],col:'purple',w:1.6},
  {name:'l3',rows:['#.','##'],col:'orange',w:3},
  {name:'l4',rows:['#.','#.','##'],col:'purple',w:2.4},
  {name:'j4',rows:['.#','.#','##'],col:'blue',w:2.4},
  {name:'l5',rows:['#..','#..','###'],col:'blue',w:1.6},
  {name:'t4',rows:['###','.#.'],col:'red',w:2.4},
  {name:'s4',rows:['.##','##.'],col:'green',w:1.6},
  {name:'z4',rows:['##.','.##'],col:'cyan',w:1.6}
];
var SHAPES=[];
FAMILIES.forEach(function(f,fi){
  var seen={},c=normCells(parseRows(f.rows));
  f.variants=[];
  for(var i=0;i<4;i++){
    var kk=cellKey(c);
    if(!seen[kk]){seen[kk]=1;var rows=0,cols=0;c.forEach(function(p){rows=Math.max(rows,p[0]+1);cols=Math.max(cols,p[1]+1);});
      SHAPES.push({id:SHAPES.length,cells:c,rows:rows,cols:cols,col:f.col,fam:fi});f.variants.push(SHAPES.length-1);}
    c=rotCells(c);
  }
});
var FAM_W_TOTAL=FAMILIES.reduce(function(a,f){return a+f.w;},0);
function randomShape(){var r=Math.random()*FAM_W_TOTAL;for(var i=0;i<FAMILIES.length;i++){r-=FAMILIES[i].w;if(r<=0){var v=FAMILIES[i].variants;return v[Math.floor(Math.random()*v.length)];}}return 0;}
var pieceSeq=1;
function makePiece(sid){return {s:sid,col:SHAPES[sid].col,id:pieceSeq++};}
function randomPiece(){return makePiece(randomShape());}

// ---------- grid logic ----------
function emptyGrid(){var g=[];for(var r=0;r<GRID;r++){g.push([]);for(var c=0;c<GRID;c++)g[r].push(null);}return g;}
function canPlace(grid,sh,r,c){if(r<0||c<0||r+sh.rows>GRID||c+sh.cols>GRID)return false;for(var i=0;i<sh.cells.length;i++){if(grid[r+sh.cells[i][0]][c+sh.cells[i][1]])return false;}return true;}
function anyFit(grid,sh){for(var r=0;r<=GRID-sh.rows;r++)for(var c=0;c<=GRID-sh.cols;c++)if(canPlace(grid,sh,r,c))return true;return false;}
function fullLines(grid){var rows=[],cols=[];for(var r=0;r<GRID;r++){var ok=true;for(var c=0;c<GRID;c++)if(!grid[r][c]){ok=false;break;}if(ok)rows.push(r);}for(var c2=0;c2<GRID;c2++){var ok2=true;for(var r2=0;r2<GRID;r2++)if(!grid[r2][c2]){ok2=false;break;}if(ok2)cols.push(c2);}return {rows:rows,cols:cols};}
function previewLines(grid,sh,r,c){var g=grid.map(function(row){return row.slice();});sh.cells.forEach(function(p){g[r+p[0]][c+p[1]]={col:'x'};});return fullLines(g);}

// ---------- canvas setup ----------
var cv=document.getElementById('game'),ctx=cv.getContext('2d');
var VW=1,VH=1,DPR=1,S=1,OX=0,OY=0;
var spriteCache={};
function resize(){
  var d=Math.min(2.5,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  if(d!==DPR){DPR=d;spriteCache={};}
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  S=Math.min(VW/DW,VH/DH);OX=(VW-DW*S)/2;OY=(VH-DH*S)/2;
}
window.addEventListener('resize',resize);
resize();

// ---------- block sprites (procedural bevelled blocks) ----------
function poly(c,pts,fill){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fillStyle=fill;c.fill();}
function paintBlock(c,x,y,s,hex){
  var b=Math.max(2,s*0.17);
  c.fillStyle=hex;c.fillRect(x,y,s,s);
  poly(c,[[x,y],[x+s,y],[x+s-b,y+b],[x+b,y+b]],shade(hex,0.42));
  poly(c,[[x,y],[x+b,y+b],[x+b,y+s-b],[x,y+s]],shade(hex,0.18));
  poly(c,[[x+s,y],[x+s,y+s],[x+s-b,y+s-b],[x+s-b,y+b]],shade(hex,-0.22));
  poly(c,[[x,y+s],[x+b,y+s-b],[x+s-b,y+s-b],[x+s,y+s]],shade(hex,-0.45));
  var g=c.createLinearGradient(0,y+b,0,y+s-b);g.addColorStop(0,shade(hex,0.12));g.addColorStop(0.55,hex);g.addColorStop(1,shade(hex,-0.08));
  c.fillStyle=g;c.fillRect(x+b,y+b,s-2*b,s-2*b);
  c.fillStyle='rgba(255,255,255,0.13)';c.fillRect(x+b,y+b,s-2*b,(s-2*b)*0.34);
  c.strokeStyle='rgba(0,0,0,0.32)';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,s-1,s-1);
}
function paintGem(c,cx,cy,s,gem){
  var g=GEM[gem],rx=s*0.33,ry=s*0.25;
  c.save();
  c.shadowColor='rgba(0,0,0,0.35)';c.shadowBlur=s*0.06;c.shadowOffsetY=s*0.03;
  poly(c,[[cx,cy-ry],[cx+rx,cy],[cx,cy+ry],[cx-rx,cy]],g.dark);
  c.shadowColor='transparent';
  var ix=rx*0.56,iy=ry*0.56;
  poly(c,[[cx,cy-iy],[cx+ix,cy],[cx,cy+iy],[cx-ix,cy]],g.mid);
  poly(c,[[cx,cy-ry],[cx-rx,cy],[cx-ix,cy],[cx,cy-iy]],g.light);
  poly(c,[[cx,cy-ry],[cx+rx,cy],[cx+ix,cy],[cx,cy-iy]],shade(g.mid,0.25));
  poly(c,[[cx-rx,cy],[cx,cy+ry],[cx,cy+iy],[cx-ix,cy]],shade(g.mid,-0.15));
  poly(c,[[cx+rx,cy],[cx,cy+ry],[cx,cy+iy],[cx+ix,cy]],shade(g.dark,0.1));
  c.fillStyle='rgba(255,255,255,0.85)';c.beginPath();c.ellipse(cx-rx*0.35,cy-ry*0.3,s*0.045,s*0.03,-0.6,0,Math.PI*2);c.fill();
  c.restore();
}
function blockSprite(hex,gem){
  var key=hex+'|'+(gem||'')+'|'+(theme.glow?1:0);
  var sp=spriteCache[key];if(sp)return sp;
  var s=CELL,pad=theme.glow?Math.ceil(s*0.3):2;
  var c=document.createElement('canvas');c.width=c.height=Math.ceil((s+pad*2)*DPR);
  var g=c.getContext('2d');g.scale(DPR,DPR);
  if(theme.glow){g.save();g.shadowColor=hex;g.shadowBlur=s*0.28;g.fillStyle=hex;g.fillRect(pad,pad,s,s);g.fillRect(pad,pad,s,s);g.restore();}
  paintBlock(g,pad,pad,s,hex);
  if(gem)paintGem(g,pad+s/2,pad+s/2,s,gem);
  sp={c:c,pad:pad};spriteCache[key]=sp;return sp;
}
function colorOf(cell){if(cell.gem)return TAN;if(cell.col==='grey')return GREY;return theme.pal[cell.col]||cell.col;}
function drawBlock(x,y,s,hex,gem){var sp=blockSprite(hex,gem);var k=s/CELL;ctx.drawImage(sp.c,x-sp.pad*k,y-sp.pad*k,(CELL+sp.pad*2)*k,(CELL+sp.pad*2)*k);}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(str,x,y,o){o=o||{};ctx.save();ctx.font=(o.weight||700)+' '+(o.size||32)+'px '+FONT;ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  if(o.shadow){ctx.shadowColor=typeof o.shadow==='string'?o.shadow:'rgba(0,0,0,0.35)';ctx.shadowBlur=o.shadowBlur||0;ctx.shadowOffsetY=o.shadowY||3;}
  if(o.stroke){ctx.lineJoin='round';ctx.lineWidth=o.strokeW||6;ctx.strokeStyle=o.stroke;ctx.strokeText(str,x,y);}
  ctx.shadowColor='transparent';
  if(o.shadow&&!o.stroke){ctx.shadowColor=typeof o.shadow==='string'?o.shadow:'rgba(0,0,0,0.35)';ctx.shadowBlur=o.shadowBlur||0;ctx.shadowOffsetY=o.shadowY||3;}
  ctx.fillStyle=o.color||theme.text;ctx.fillText(str,x,y);ctx.restore();}
function measure(str,size,weight){ctx.font=(weight||700)+' '+size+'px '+FONT;return ctx.measureText(str).width;}
function panel(x,y,w,h,r){r=r||28;ctx.save();ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;rr(x,y,w,h,r);ctx.fillStyle=theme.panelEdge;ctx.fill();ctx.restore();rr(x,y,w,h-8,r);ctx.fillStyle=theme.panel;ctx.fill();rr(x+3,y+3,w-6,h-14,r-3);ctx.strokeStyle=theme.dark?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.08)';ctx.lineWidth=2;ctx.stroke();}

// ---------- icons ----------
function icoTrophy(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s/40,s/40);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-13,-18);ctx.lineTo(13,-18);ctx.lineTo(12,-4);ctx.quadraticCurveTo(10,8,0,10);ctx.quadraticCurveTo(-10,8,-12,-4);ctx.closePath();ctx.fill();ctx.lineWidth=3.2;ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(-13,-13);ctx.quadraticCurveTo(-22,-12,-19,-3);ctx.quadraticCurveTo(-17,3,-10,2);ctx.moveTo(13,-13);ctx.quadraticCurveTo(22,-12,19,-3);ctx.quadraticCurveTo(17,3,10,2);ctx.stroke();ctx.fillRect(-3,9,6,6);ctx.beginPath();rr(-10,14,20,5,2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.ellipse(-6,-9,2.5,5,0.2,0,Math.PI*2);ctx.fill();ctx.restore();}
function icoGear(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.fillStyle=col;for(var i=0;i<8;i++){ctx.save();ctx.rotate(i*Math.PI/4);rr(-s*0.11,-s*0.5,s*0.22,s*0.26,s*0.04);ctx.fill();ctx.restore();}ctx.beginPath();ctx.arc(0,0,s*0.34,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(0,0,s*0.14,0,Math.PI*2);ctx.fill();ctx.restore();}
function icoPalette(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,s*0.48,s*0.42,0,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(s*0.22,s*0.14,s*0.16,0,Math.PI*2);ctx.fill();ctx.restore();var dots=[['#f0483f',-0.22,-0.14],['#ffc43a',0.02,-0.22],['#46d14a',0.26,-0.08],['#3f86f2',-0.24,0.14]];dots.forEach(function(d){ctx.fillStyle=d[0];ctx.beginPath();ctx.arc(x+d[1]*s,y+d[2]*s,s*0.085,0,Math.PI*2);ctx.fill();});}
function icoSwap(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=s*0.12;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-s*0.42,-s*0.18);ctx.lineTo(s*0.3,-s*0.18);ctx.stroke();ctx.beginPath();ctx.moveTo(s*0.14,-s*0.38);ctx.lineTo(s*0.42,-s*0.18);ctx.lineTo(s*0.14,s*0.02);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(s*0.42,s*0.2);ctx.lineTo(-s*0.3,s*0.2);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*0.14,0);ctx.lineTo(-s*0.42,s*0.2);ctx.lineTo(-s*0.14,s*0.4);ctx.closePath();ctx.fill();ctx.restore();}

    var maxDelay=0;
    Object.keys(set).forEach(function(k){var idx=+k,rr_=Math.floor(idx/GRID),cc=idx%GRID;var cell=G.grid[rr_][cc];if(!cell)return;
      var d=Math.hypot(CX+cc*P+CELL/2-cxp,CY+rr_*P+CELL/2-cyp)*0.00075;maxDelay=Math.max(maxDelay,d);
      fx.clearing.push({r:rr_,c:cc,cell:cell,t:now,delay:d,tint:hex,spawned:false});
      if(cell.gem){collectGem(cell.gem,rr_,cc,d);}
      G.grid[rr_][cc]=null;G.blocks++;data.totalBlocks++;});
    fl.rows.forEach(function(rr_){fx.glows.push({type:'row',i:rr_,t:now,hex:hex});});
    fl.cols.forEach(function(cc){fx.glows.push({type:'col',i:cc,t:now,hex:hex});});
    addScore(gain);
    fx.floats.push({x:cxp,y:cyp-30,t:now,txt:'+'+gain,hex:hex,size:lines>1?52:42});
    if(G.combo>=2)fx.banner={t:now,txt:'Combo '+G.combo,hex:hex};
    sfx.clear(lines,G.combo);if(G.combo>=2)sfx.combo(G.combo);vibrate(lines>1?[20,30,20]:25);
    fx.bump=now;fx.shake=lines>=2?now:0;
    fx.pendingCheck=now+0.35+maxDelay;
  }else{
    if(G.combo>0&&--G.comboLeft<=0)G.combo=0;
    fx.pendingCheck=now+0.05;
  }
  if(trayEmpty())refillTray();
  saveRun();
}
function collectGem(gem,r,c,delay){
  var tx=gem==='red'?DW/2-62:DW/2+62,ty=78;
  fx.flyers.push({gem:gem,x:CX+c*P+CELL/2,y:CY+r*P+CELL/2,tx:tx,ty:ty,t:now+delay+0.15});
  G.gems[gem]=Math.max(0,G.gems[gem]-1);
}
function runEndChecks(){
  if(!G||G.phase!=='play')return;
  if(G.mode==='adventure'&&G.gems.red===0&&G.gems.blue===0){
    G.phase='won';G.won=true;if(G.level>data.adv){data.adv=G.level;}persist();
    setTimeout(function(){if(G&&G.phase==='won'){overlay='levelwin';sfx.win();}},700);return;
  }
  if(!hasAnyMove()){startDying();return;}
  if(!trayFits()){fx.hint=G.skips>0?'skip':((!G.saved&&G.tray.filter(Boolean).length===1)?'save':null);}else fx.hint=null;
}
function startDying(){G.phase='dying';fx.grayT=0;drag=null;sfx.over();data.run=null;persist();}
function skipPieces(){
  if(!G||G.phase!=='play'||drag||G.skips<=0)return;
  G.skips--;sfx.skip();fx.trayIn=[now+0.1,now+0.16,now+0.22];
  G.tray=genTray();fx.hint=null;fx.pendingCheck=now+0.3;saveRun();
}
function revive(){
  if(!G||G.revived)return;G.revived=true;
  for(var r=2;r<6;r++)for(var c=2;c<6;c++){var cell=G.grid[r][c];if(cell&&!cell.gem){fx.clearing.push({r:r,c:c,cell:cell,t:now,delay:(Math.abs(r-3.5)+Math.abs(c-3.5))*0.04,tint:'#ffffff',spawned:false});G.grid[r][c]=null;}}
  // also clear bottom two rows for breathing room
  for(var r2=6;r2<8;r2++)for(var c2=0;c2<8;c2++){var cl=G.grid[r2][c2];if(cl&&!cl.gem){fx.clearing.push({r:r2,c:c2,cell:cl,t:now,delay:0.2+(c2)*0.02,tint:'#ffffff',spawned:false});G.grid[r2][c2]=null;}}
  G.phase='play';fx.grayT=-1;overlay=null;G.combo=0;G.comboLeft=0;
  G.tray=genTray();fx.trayIn=[now+0.3,now+0.36,now+0.42];
  fx.pendingCheck=now+0.6;sfx.win();saveRun();
}
function finishGameOver(){
  G.phase='over';overlay='gameover';data.run=null;persist();
}
function goHome(){saveRun();drag=null;overlay=null;screen='title';}

// ---------- input ----------
function toDesign(e){return {x:(e.clientX-OX)/S,y:(e.clientY-OY)/S};}
function trayRect(i){return {x:DW/2+(i-1)*SLOT_W-SLOT_W/2,y:TRAY_Y-105,w:SLOT_W,h:210};}
function inRect(p,r,m){m=m||0;return p.x>=r.x-m&&p.x<=r.x+r.w+m&&p.y>=r.y-m&&p.y<=r.y+r.h+m;}
function startDrag(piece,from,idx,p,type){
  var lift=type==='touch'?120:28;
  drag={piece:piece,from:from,idx:idx,x:p.x,y:p.y-lift,lift:lift,t:now,sx:p.x,sy:p.y,startScale:from==='save'?0.4:TRAY_SCALE,type:type};
  if(from==='tray')G.tray[idx]=null;else G.saved=null;
  sfx.pick();
}
function dragCenter(){return {x:drag.x,y:drag.y};}
function dragGridPos(){var sh=SHAPES[drag.piece.s];var left=drag.x-sh.cols*P/2+GAP/2,top=drag.y-sh.rows*P/2+GAP/2;return {r:Math.round((top-CY)/P),c:Math.round((left-CX)/P)};}
function returnDrag(){
  var sh=SHAPES[drag.piece.s];
  var target=drag.from==='tray'?{x:DW/2+(drag.idx-1)*SLOT_W,y:TRAY_Y,s:TRAY_SCALE}:{x:SAVE_SLOT.x+SAVE_SLOT.w/2,y:SAVE_SLOT.y+SAVE_SLOT.h/2,s:0.4};
  fx.returning={piece:drag.piece,from:drag.from,idx:drag.idx,x0:drag.x,y0:drag.y,t:now,tx:target.x,ty:target.y,ts:target.s};
  if(drag.from==='tray')G.tray[drag.idx]=drag.piece;else G.saved=drag.piece;
  drag=null;
}
function endDrag(p){
  if(!drag)return;
  var sh=SHAPES[drag.piece.s];
  // save slot?
  if(inRect({x:drag.x,y:drag.y+drag.lift},SAVE_SLOT,30)||inRect(p,SAVE_SLOT,14)){
    if(drag.from==='save'){G.saved=drag.piece;drag=null;return;}
    if(!G.saved){G.saved=drag.piece;fx.saveIn=now;drag=null;sfx.save();fx.hint=null;if(trayEmpty())refillTray();fx.pendingCheck=now+0.1;saveRun();return;}
    // swap
    var old=G.saved;G.saved=drag.piece;G.tray[drag.idx]=old;fx.saveIn=now;fx.trayIn[drag.idx]=now;drag=null;sfx.save();saveRun();return;
  }
  var gp=dragGridPos();
  if(canPlace(G.grid,sh,gp.r,gp.c)){var piece=drag.piece;drag=null;placePiece(piece,gp.r,gp.c);return;}
  sfx.bad();returnDrag();
}
function onDown(e){
  audioInit();audioResume();
  if(e.pointerType==='mouse'&&e.button!==0)return;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  var p=toDesign(e);
  var b=hitButton(p);
  if(b){if(!b.disabled)pressedId=b.id;return;}
  if(screen==='game'&&!overlay&&G&&G.phase==='play'&&!drag&&!fx.returning){
    for(var i=0;i<3;i++){if(G.tray[i]&&inRect(p,trayRect(i))){startDrag(G.tray[i],'tray',i,p,e.pointerType);return;}}
    if(G.saved&&inRect(p,SAVE_SLOT,16)){startDrag(G.saved,'save',0,p,e.pointerType);return;}
  }
}
function onMove(e){
  var p=toDesign(e);hoverId=null;
  if(drag){drag.x=p.x;drag.y=p.y-drag.lift;return;}
  var b=hitButton(p);if(b&&!b.disabled)hoverId=b.id;
  cv.style.cursor=(b&&!b.disabled)?'pointer':(screen==='game'&&!overlay&&G&&G.phase==='play'&&(G.tray.some(function(pc,i){return pc&&inRect(p,trayRect(i));})||(G.saved&&inRect(p,SAVE_SLOT,16))))?'grab':'default';
}
function onUp(e){
  var p=toDesign(e);
  if(pressedId){var b=hitButton(p);if(b&&b.id===pressedId&&!b.disabled){sfx.click();b.onClick();}pressedId=null;return;}
  if(drag){drag.x=p.x;drag.y=p.y-drag.lift;endDrag(p);}
}
function onCancel(){pressedId=null;if(drag)returnDrag();}
cv.addEventListener('pointerdown',onDown);
cv.addEventListener('pointermove',onMove);
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onCancel);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(screen==='game'&&G&&G.phase==='play'){overlay=overlay?null:'pause';}else if(overlay&&overlay!=='gameover'&&overlay!=='levelwin')overlay=null;}
  if(e.key===' '&&screen==='game'&&!overlay)skipPieces();
});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(AU.ctx)AU.ctx.suspend();if(screen==='game'&&G&&G.phase==='play'&&!overlay)overlay='pause';}else audioResume();});

function drawPiece(piece,cx,cy,scale,alpha){
  var sh=SHAPES[piece.s],hex=theme.pal[piece.col];
  ctx.save();if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);ctx.scale(scale,scale);
  var ox=-(sh.cols*P-GAP)/2,oy=-(sh.rows*P-GAP)/2;

}

function drawBoard(){
  var t=theme;
  var sh=fx.shake?Math.max(0,1-(now-fx.shake)/0.3):0;
  ctx.save();if(sh>0)ctx.translate(Math.sin(now*90)*4*sh,Math.cos(now*70)*3*sh);
  // panel
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;rr(BOARD_X,BOARD_Y,BOARD_W,BOARD_W+8,26);ctx.fillStyle=shade(t.board,t.dark?-0.08:-0.35);ctx.fill();ctx.restore();
  rr(BOARD_X,BOARD_Y,BOARD_W,BOARD_W,26);ctx.fillStyle=t.board;ctx.fill();
  // cells
  ctx.fillStyle=t.cell;
  for(var r=0;r<GRID;r++)for(var c=0;c<GRID;c++){rr(CX+c*P,CY+r*P,CELL,CELL,6);ctx.fill();}
  // ghost / line preview
  var ghost=null,lines=null;
  if(drag){var gp=dragGridPos();var s=SHAPES[drag.piece.s];if(canPlace(G.grid,s,gp.r,gp.c)){ghost={r:gp.r,c:gp.c,sh:s,hex:theme.pal[drag.piece.col]};lines=previewLines(G.grid,s,gp.r,gp.c);}}
  if(lines&&(lines.rows.length||lines.cols.length)){
    var pulse=0.55+0.25*Math.sin(now*10);
    lines.rows.forEach(function(rr_){rr(CX-6,CY+rr_*P-6,GRID*P-GAP+12,CELL+12,10);ctx.fillStyle=rgba(ghost.hex,0.28*pulse);ctx.fill();});
    lines.cols.forEach(function(cc){rr(CX+cc*P-6,CY-6,CELL+12,GRID*P-GAP+12,10);ctx.fillStyle=rgba(ghost.hex,0.28*pulse);ctx.fill();});
  }
  // dead grey wave
  var greyRows=-1;if(G.phase==='dying'||G.phase==='over'){greyRows=G.phase==='over'?GRID:Math.floor(fx.grayT/0.09);}
  // blocks
  for(var r2=0;r2<GRID;r2++)for(var c2=0;c2<GRID;c2++){var cell=G.grid[r2][c2];if(!cell)continue;
    var x=CX+c2*P,y=CY+r2*P;
    var isGrey=greyRows>=0&&(GRID-1-r2)<greyRows;
    var hex=isGrey?GREY:colorOf(cell);
    var pl=null;for(var i=0;i<fx.placing.length;i++)if(fx.placing[i].r===r2&&fx.placing[i].c===c2){pl=fx.placing[i];break;}
    if(pl){var k=clamp((now-pl.t)/0.16,0,1);var sc=1+0.16*(1-easeOutCubic(k))*Math.sin(k*Math.PI);ctx.save();ctx.translate(x+CELL/2,y+CELL/2);ctx.scale(sc,sc);drawBlock(-CELL/2,-CELL/2,CELL,hex,isGrey?null:cell.gem);ctx.restore();}
    else drawBlock(x,y,CELL,hex,isGrey?null:cell.gem);
    if(lines&&!isGrey){var inLine=lines.rows.indexOf(r2)>=0||lines.cols.indexOf(c2)>=0;if(inLine){ctx.fillStyle=rgba('#ffffff',0.22+0.12*Math.sin(now*10));rr(x,y,CELL,CELL,3);ctx.fill();}}
  }
  // ghost cells
  if(ghost){ghost.sh.cells.forEach(function(p){var x=CX+(ghost.c+p[1])*P,y=CY+(ghost.r+p[0])*P;ctx.save();ctx.globalAlpha=lines&&(lines.rows.length||lines.cols.length)?0.8:0.45;drawBlock(x,y,CELL,ghost.hex);ctx.restore();});}
  // clearing cells
  for(var j=fx.clearing.length-1;j>=0;j--){var cl=fx.clearing[j];var age=now-cl.t-cl.delay;var x3=CX+cl.c*P,y3=CY+cl.r*P;
    if(age<0){drawBlock(x3,y3,CELL,colorOf(cl.cell),cl.cell.gem);ctx.fillStyle=rgba(cl.tint,0.55);rr(x3,y3,CELL,CELL,3);ctx.fill();continue;}
    if(!cl.spawned){cl.spawned=true;spawnBurst(x3+CELL/2,y3+CELL/2,cl.tint,colorOf(cl.cell));}
    var k2=age/0.3;if(k2>=1){fx.clearing.splice(j,1);continue;}
    ctx.save();ctx.globalAlpha=1-k2;ctx.translate(x3+CELL/2,y3+CELL/2);var s2=1-easeInCubic(k2)*0.9;ctx.scale(s2,s2);drawBlock(-CELL/2,-CELL/2,CELL,cl.cell.gem?TAN:colorOf(cl.cell),cl.cell.gem);ctx.fillStyle=rgba('#ffffff',0.6*(1-k2));rr(-CELL/2,-CELL/2,CELL,CELL,3);ctx.fill();ctx.restore();
  }
  // line glows
  for(var q=fx.glows.length-1;q>=0;q--){var gl=fx.glows[q];var k3=(now-gl.t)/0.7;if(k3>=1){fx.glows.splice(q,1);continue;}
    var a=(1-k3)*(1-k3);ctx.save();ctx.shadowColor=gl.hex;ctx.shadowBlur=30*a;
    if(gl.type==='row'){rr(CX-8,CY+gl.i*P-8,GRID*P-GAP+16,CELL+16,12);}else{rr(CX+gl.i*P-8,CY-8,CELL+16,GRID*P-GAP+16,12);}
    ctx.fillStyle=rgba(gl.hex,0.35*a);ctx.fill();ctx.strokeStyle=rgba('#ffffff',0.7*a);ctx.lineWidth=3;ctx.stroke();ctx.restore();}
  ctx.restore();
}

// ---------- main loop ----------
var last=0,fontsReady=false,bootT=performance.now();
function frame(ts){
  requestAnimationFrame(frame);
  dt=Math.min(0.05,(ts-last)/1000||0);last=ts;now=ts/1000;
  buttons=[];
  drawBackground();
  if(!fontsReady){text('Loading…',DW/2,DH/2,{size:40,color:theme.text});lastButtons=buttons;return;}
  if(screen==='title'){drawTitle();}
  else if(screen==='levels'){drawLevels();}
  else if(screen==='game'&&G){
    // update
    if(fx.pendingCheck&&now>=fx.pendingCheck&&fx.clearing.length===0){fx.pendingCheck=0;runEndChecks();}
    if(G.phase==='dying'){var prev=Math.floor(fx.grayT/0.09);fx.grayT+=dt;var cur=Math.floor(fx.grayT/0.09);if(cur!==prev&&cur<=GRID)sfx.grey();if(fx.grayT>0.09*GRID+0.5)finishGameOver();}
    if(fx.scoreShown<G.score){fx.scoreShown=Math.min(G.score,fx.scoreShown+Math.max(1,(G.score-fx.scoreShown)*dt*8+60*dt));}else fx.scoreShown=G.score;
    for(var i=fx.placing.length-1;i>=0;i--)if(now-fx.placing[i].t>0.2)fx.placing.splice(i,1);
    // draw
    drawHUD();drawBoard();drawControls();drawTray();drawParticles();drawFloats();drawDrag();drawLevelIntro();
  }
  if(overlay==='pause')drawPauseOverlay();
  else if(overlay==='themes')drawThemesOverlay();
  else if(overlay==='achv')drawAchievementsOverlay();
  else if(overlay==='gameover')drawGameOverOverlay();
  else if(overlay==='levelwin')drawLevelWinOverlay();
  else fx.winT=0;
  lastButtons=buttons;
}
requestAnimationFrame(frame);
